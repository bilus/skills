on.\n\t\t\t\t\tstart, end := spec.Pos(), spec.End()\n\t\t\t\t\tif !d.Lparen.IsValid() {\n\t\t\t\t\t\tstart, end, doc = d.Pos(), d.End(), d.Doc\n\t\t\t\t\t}\n\t\t\t\t\tfor _, n := range names {\n\t\t\t\t\t\tadd(n.Name, start, end, doc)\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\treturn decls, nil\n}\n\n// stdPackages returns the import paths of the standard library.\nfunc stdPackages() (map[string]bool, error) {\n\tout, err := exec.Command(\"go\", \"list\", \"std\").Output()\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"go list std: %w\", err)\n\t}\n\tstd := map[string]bool{}\n\tfor _, p := range strings.Fields(string(out)) {\n\t\tstd[p] = true\n\t}\n\treturn std, nil\n}\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/code/code.go b/hole-driven-delivery/tools/dfdreview/code/code.go\nindex 19db210..55531a4 100644\n--- a/hole-driven-delivery/tools/dfdreview/code/code.go\n+++ b/hole-driven-delivery/tools/dfdreview/code/code.go\n@@ -1,4 +1,5 @@\n-// Package code indexes the Go declarations and the changed files of a change in both versions.\n+// Package code loads the module of a change with its types, and indexes its declarations,\n+// changed files and identifier links in both versions.\n package code\n \n import (\n@@ -17,13 +18,16 @@ import (\n \t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\"\n )\n \n-// Index is the Go declarations and the changed files of a change, in both versions.\n+// Index is the code of a change in both versions: the declarations with the changed ones,\n+// the files the page shows with their identifier links, and the package errors.\n type Index struct {\n-\tBefore, After map[string]Place     // declarations by key, such as \"analyze.sumTypes\"\n-\tChangedDecls  map[string]bool      // the keys of the declarations that differ between the versions\n-\tStd           map[string]bool      // the standard library's import paths\n-\tFiles         map[string]repo.Pair // the files the page shows, by path\n-\tChanged       []repo.Change\n+\tBefore, After           map[string]Place     // declarations by key, such as \"analyze.sumTypes\"\n+\tChangedDecls            map[string]bool      // the keys of the changed declarations\n+\tStd                     map[string]bool      // the standard library's import paths\n+\tFiles                   map[string]repo.Pair // the files the page shows, by path\n+\tChanged                 []repo.Change\n+\tBeforeLinks, AfterLinks map[string][]Link // the identifier links of each Go file, by path\n+\tErrors                  []string          // the package errors of both versions\n }\n \n // Place is where a declaration sits, its doc comment included.\n@@ -32,10 +36,16 @@ type Place struct {\n \tStart, End int // lines, from 1\n }\n \n-// Read indexes the declarations of both versions and the files changed since the base.\n-// The page shows the files of the declarations that the boxes and the type comments\n-// name, and every changed file. Without a base, ChangedDecls is empty.\n+// Read loads the module with its types, then indexes the declarations, the changed files\n+// and the identifier links of both versions. With a module, the page shows every Go file\n+// of both versions, test files included; without one, the files of the declarations that\n+// the boxes and the type comments name. Every changed file shows too. Without a base,\n+// ChangedDecls is empty.\n func Read(r *repo.Repo, d *design.Design) (*Index, error) {\n+\tres, err := Load(r)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n \tbefore, after, err := r.GoFiles()\n \tif err != nil {\n \t\treturn nil, err\n@@ -48,6 +58,7 @@ func Read(r *repo.Repo, d *design.Design) (*Index, error) {\n \t\treturn nil, err\n \t}\n \tif r.Base() != \"\" {\n+\t\t// HOLE(3): compare the methods of both versions too, from the parse, and also mark each function whose reach in the working tree holds a changed function or method\n \t\tidx.ChangedDecls = changedDecls(before, after, idx.Before, idx.After)\n \t}\n \tif idx.Std, err = stdPackages(); err != nil {\n@@ -56,6 +67,7 @@ func Read(r *repo.Repo, d *design.Design) (*Index, error) {\n \tif idx.Changed, err = r.Changed(); err != nil {\n \t\treturn nil, err\n \t}\n+\t// HOLE(3): with a module, show every Go file of both versions, test files included, with the texts of res's resolutions\n \tshow := func(file string) {\n \t\tp := idx.Files[file]\n \t\tif content, ok := before[file]; ok {\n@@ -84,6 +96,15 @@ func Read(r *repo.Repo, d *design.Design) (*Index, error) {\n \tfor _, c := range idx.Changed {\n \t\tidx.Files[c.Path] = c.Content\n \t}\n+\tif res != nil {\n+\t\tif res.Before != nil {\n+\t\t\tidx.BeforeLinks = res.Before.Links\n+\t\t}\n+\t\tif res.After != nil {\n+\t\t\tidx.AfterLinks = res.After.Links\n+\t\t}\n+\t\tidx.Errors = res.Errors\n+\t}\n \treturn idx, nil\n }\n \n"},"code/load_test.go":{"before":null,"after":"package code_test\n\nimport (\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"reflect\"\n\t\"sort\"\n\t\"strings\"\n\t\"testing\"\n\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/code\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/design\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/internal/gittest\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\"\n)\n\nconst goMod = \"module example.com/m\\n\\ngo 1.22\\n\"\n\n// pGo is package p at step n: T.M returns n, and U.M, of the same name, stays the same.\nfunc pGo(n int) string {\n\treturn fmt.Sprintf(`package p\n\n// I has M.\ntype I interface{ M() int }\n\n// T is one implementation of I.\ntype T struct{}\n\n// M returns the step.\nfunc (T) M() int { return %d }\n\n// U is another implementation of I.\ntype U struct{}\n\n// M returns zero.\nfunc (U) M() int { return 0 }\n\n// F calls T.M.\nfunc F() int { return T{}.M() }\n\n// G calls U.M.\nfunc G() int { return U{}.M() }\n\n// H calls M through I.\nfunc H(i I) int { return i.M() }\n`, n)\n}\n\n// qGo calls p.F from another package.\nconst qGo = `package q\n\nimport \"example.com/m/p\"\n\n// K calls p.F.\nfunc K() int { return p.F() }\n`\n\n// module makes a module whose p.T.M changes after the base, and opens it at the base.\nfunc module(t *testing.T) (*repo.Repo, string) {\n\tt.Helper()\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\"go.mod\": goMod, \"docs/flow.dfd\": \"[1. Run\\n (p.F)]\\n\", \"p/p.go\": pGo(1), \"q/q.go\": qGo})\n\tbase := g.Commit(\"base\")\n\tg.Write(map[string]string{\"p/p.go\": pGo(2)})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn r, g.Dir\n}\n\n// index indexes the code of the design at dir/docs/flow.dfd.\nfunc index(t *testing.T, r *repo.Repo, dir string) *code.Index {\n\tt.Helper()\n\td, err := design.Read(r, filepath.Join(dir, \"docs\", \"flow.dfd\"), \"\")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tc, err := code.Read(r, d)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn c\n}\n\nfunc TestLoadResolvesCalls(t *testing.T) {\n\tt.Skip(\"HOLE(1): type-check both versions of the module and resolve the calls of every function and method\")\n\ttmp := t.TempDir()\n\tr, dir := module(t)\n\tt.Setenv(\"TMPDIR\", tmp)\n\tt.Setenv(\"GOFLAGS\", \"-mod=mod\") // the load must not update go.mod even so\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif res.Before == nil || res.After == nil {\n\t\tt.Fatalf(\"resolutions: before %v, after %v\", res.Before != nil, res.After != nil)\n\t}\n\tfor key, want := range map[string][]string{\n\t\t\"p.F\": {\"p.T.M\"},\n\t\t\"p.G\": {\"p.U.M\"},\n\t\t\"p.H\": {\"p.T.M\", \"p.U.M\"}, // both types implement I\n\t\t\"q.K\": nil,                // p.F lies in another package\n\t} {\n\t\tgot := append([]string(nil), res.After.Calls[key]...)\n\t\tsort.Strings(got)\n\t\tif !reflect.DeepEqual(got, want) {\n\t\t\tt.Errorf(\"%s calls %v, want %v\", key, got, want)\n\t\t}\n\t}\n\tif res.Before.Files[\"p/p.go\"] != pGo(1) || res.After.Files[\"p/p.go\"] != pGo(2) {\n\t\tt.Errorf(\"p/p.go as parsed: before %q, after %q\", res.Before.Files[\"p/p.go\"], res.After.Files[\"p/p.go\"])\n\t}\n\tif mod, err := os.ReadFile(filepath.Join(dir, \"go.mod\")); err != nil || string(mod) != goMod {\n\t\tt.Errorf(\"the load changed go.mod to %q (%v)\", mod, err)\n\t}\n\tif left, err := os.ReadDir(tmp); err != nil || len(left) \u003e 0 {\n\t\tt.Errorf(\"the temporary directory holds %d entries after the load (%v)\", len(left), err)\n\t}\n}\n\nfunc TestLoadWithoutModule(t *testing.T) {\n\tt.Skip(\"HOLE(1): a code directory without a module gets no resolutions\")\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\"docs/flow.dfd\": \"[1. Run]\\n\", \"lib/lib.go\": \"package lib\\n\"})\n\tbase := g.Commit(\"base\")\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif res.Before != nil || res.After != nil || len(res.Errors) \u003e 0 {\n\t\tt.Errorf(\"without a module: %+v\", res)\n\t}\n}\n\nfunc TestLoadReportsPackageErrors(t *testing.T) {\n\tt.Skip(\"HOLE(1): a package error leaves the load to finish, with the error recorded for each version\")\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\n\t\t\"go.mod\":        goMod,\n\t\t\"docs/flow.dfd\": \"[1. Run]\\n\",\n\t\t\"p/p.go\":        \"package p\\n\\n// F returns a string as an int.\\nfunc F() int { return \\\"s\\\" }\\n\\n// G returns one.\\nfunc G() int { return 1 }\\n\",\n\t})\n\tbase := g.Commit(\"base\")\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tall := strings.Join(res.Errors, \"\\n\")\n\tif len(res.Errors) != 2 || !strings.Contains(all, \"base\") || !strings.Contains(all, \"working tree\") || strings.Count(all, \"p/p.go\") != 2 {\n\t\tt.Errorf(\"package errors:\\n%s\", all)\n\t}\n\tif _, ok := res.After.Calls[\"p.G\"]; !ok {\n\t\tt.Errorf(\"the package with an error lost its functions: %v\", res.After.Calls)\n\t}\n}\n\nfunc TestLoadLinksIdentifiers(t *testing.T) {\n\tt.Skip(\"HOLE(2): record the identifier links of every Go file in both versions\")\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\n\t\t\"go.mod\":        goMod,\n\t\t\"docs/flow.dfd\": \"[1. Run]\\n\",\n\t\t\"p/a.go\": \"package p\\n\\nimport \\\"strings\\\"\\n\\n// A trims s.\\n\" +\n\t\t\t\"func A(s string) string { return strings.TrimSpace(s) + b }\\n\\n\" +\n\t\t\t\"var c = \\\"\\u00e9\\\" + b\\n\\n\" +\n\t\t\t\"func w(sb *strings.Builder) { sb.WriteString(\\\"x\\\") }\\n\",\n\t\t\"p/b.go\": \"package p\\n\\nvar b = \\\"x\\\"\\n\",\n\t\t\"q/q.go\": \"package q\\n\\nimport \\\"example.com/m/p\\\"\\n\\nvar d = p.A\\n\",\n\t})\n\tbase := g.Commit(\"base\")\n\t// The working tree moves b down two lines.\n\tg.Write(map[string]string{\"p/b.go\": \"package p\\n\\n// b ends each result.\\n\\nvar b = \\\"x\\\"\\n\"})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlinks := func(b int) []code.Link {\n\t\treturn []code.Link{\n\t\t\t{Line: 6, Col: 34, Len: 7, URL: \"https://pkg.go.dev/strings\"},\n\t\t\t{Line: 6, Col: 42, Len: 9, URL: \"https://pkg.go.dev/strings#TrimSpace\"},\n\t\t\t{Line: 6, Col: 52, Len: 1, File: \"p/a.go\", To: 6},\n\t\t\t{Line: 6, Col: 57, Len: 1, File: \"p/b.go\", To: b},\n\t\t\t{Line: 8, Col: 15, Len: 1, File: \"p/b.go\", To: b}, // after a two-byte letter, one UTF-16 unit\n\t\t\t{Line: 10, Col: 12, Len: 7, URL: \"https://pkg.go.dev/strings\"},\n\t\t\t{Line: 10, Col: 20, Len: 7, URL: \"https://pkg.go.dev/strings#Builder\"},\n\t\t\t{Line: 10, Col: 31, Len: 2, File: \"p/a.go\", To: 10},\n\t\t\t{Line: 10, Col: 34, Len: 11, URL: \"https://pkg.go.dev/strings#Builder.WriteString\"},\n\t\t}\n\t}\n\tif got, want := res.Before.Links[\"p/a.go\"], links(3); !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"before:\\n got %+v\\nwant %+v\", got, want)\n\t}\n\tif got, want := res.After.Links[\"p/a.go\"], links(5); !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"after:\\n got %+v\\nwant %+v\", got, want)\n\t}\n\t// A package of the code directory opens at the package clause of its first file.\n\tq := []code.Link{{Line: 5, Col: 9, Len: 1, File: \"p/a.go\", To: 1}, {Line: 5, Col: 11, Len: 1, File: \"p/a.go\", To: 6}}\n\tfor _, v := range []*code.Resolution{res.Before, res.After} {\n\t\tif got := v.Links[\"q/q.go\"]; !reflect.DeepEqual(got, q) {\n\t\t\tt.Errorf(\"q/q.go:\\n got %+v\\nwant %+v\", got, q)\n\t\t}\n\t}\n}\n\nfunc TestReadMarksByReach(t *testing.T) {\n\tt.Skip(\"HOLE(3): mark each function whose reach holds a changed function or method\")\n\tr, dir := module(t)\n\tc := index(t, r, dir)\n\tfor key, want := range map[string]bool{\n\t\t\"p.F\": true,  // reaches T.M, which changed\n\t\t\"p.G\": false, // reaches U.M only, though T.M shares its name\n\t\t\"p.H\": true,  // reaches T.M through I\n\t\t\"q.K\": false, // p.F lies in another package\n\t\t\"p.T\": false, // a type keeps its own rule\n\t} {\n\t\tif got := c.ChangedDecls[key]; got != want {\n\t\t\tt.Errorf(\"%s changed: %v, want %v\", key, got, want)\n\t\t}\n\t}\n}\n\nfunc TestReadMarksByReachWithoutBaseModule(t *testing.T) {\n\tt.Skip(\"HOLE(3): the reach marks functions when only the working tree has a module\")\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\"docs/flow.dfd\": \"[1. Run\\n (p.F)]\\n\", \"p/p.go\": pGo(1)})\n\tbase := g.Commit(\"base\")\n\tg.Write(map[string]string{\"go.mod\": goMod, \"p/p.go\": pGo(2)})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tc := index(t, r, g.Dir)\n\tfor key, want := range map[string]bool{\"p.F\": true, \"p.G\": false, \"p.H\": true} {\n\t\tif got := c.ChangedDecls[key]; got != want {\n\t\t\tt.Errorf(\"%s changed: %v, want %v\", key, got, want)\n\t\t}\n\t}\n}\n\nfunc TestReadHoldsEveryGoFile(t *testing.T) {\n\tt.Skip(\"HOLE(3): hold every Go file of both versions, at it calls\n\tFiles map[string]string   // the text of every Go file as the load parsed it, test files included, by path relative to the code directory\n\tLinks map[string][]Link   // the identifier links of each Go file, by path\n}\n\n// Link is an identifier that uses a declared object, with the object's definition.\ntype Link struct {\n\tLine, Col, Len int    // the identifier's line, and its column and length in UTF-16 code units, from 1\n\tFile           string // the definition's file in the same version, relative to the code directory\n\tTo             int    // the definition's line in File\n\tURL            string // the definition's documentation, for one outside the code directory\n}\n\n// Load type-checks the module in both versions. It records the calls that every function\n// and method makes within its package, the text and the identifier links of every Go file,\n// and the package errors. It reads the base from the base export, a temporary copy of the\n// module directory's blobs at the base that it deletes at the end. It returns an error only\n// when it cannot run: an error that the go command or the type checker reports becomes a\n// package error of its version.\nfunc Load(r *repo.Repo) (*Resolved, error) {\n\t// HOLE(1): type-check both versions of the module with GOWORK=off and -mod=readonly, tests included, the base from the base export; record the calls within its package of every function and method, the text of every Go file as parsed, and the package errors; a version without a module gets no resolution\n\t// HOLE(2): record the identifier links of every Go file in both versions\n\treturn \u0026Resolved{After: \u0026Resolution{Links: map[string][]Link{\"lib/lib.go\": {\n\t\t{Line: 6, Col: 22, Len: 4, File: \"lib/lib.go\", To: 9},\n\t\t{Line: 6, Col: 36, Len: 4, File: \"lib/lib.go\", To: 9},\n\t\t{Line: 6, Col: 41, Len: 4, File: \"lib/lib.go\", To: 9},\n\t\t{Line: 6, Col: 47, Len: 7, URL: \"https://pkg.go.dev/strings\"},\n\t\t{Line: 6, Col ectory\"; 22, the external labels are now working tree files, base files and base export; 23, \"key\"; 24, \"build configuration\"; 25, \"external system\", with \"element\" naming its names; 29, page.go's comment on Link; 32, gone with process 6; 33, the external system is now \"Git command\". Deferred: 16 and 30, \"diff\" against the Diff view of a diagram, and 31, a diagram's title against its description, which predate this change. Discarded: 26, since type-checking and resolving are parts of the load, which the vocabulary defines. Deferred to a separate fix: finding 1's evidence that dfdtext.Link gives a word that is both a term and another term's plural the link of whichever term a map loop writes last.\n+- 2026-09-27 the design review runs again on the revised design.\n+- 2026-09-27 second design review, 6 findings. Applied 1: the load passes -mod=readonly beside GOWORK=off, since a -mod=mod in GOFLAGS lets go list rewrite go.mod, and TestLoadResolvesCalls sets GOFLAGS=-mod=mod and checks go.mod. Applied 2: a base without a resolution would have counted every method as new, so the changed declarations and methods now come from a parse of both versions without types, and the load gives only the working tree's calls; Func and its Text are gone, Resolution.Calls replaces Funcs, and TestReadMarksByReachWithoutBaseModule covers a base without a module. Applied 3: the base export writes the blobs that git cat-file returns, not git archive's output, which applies .gitattributes; Resolution.Files holds the text as the load parsed it. Applied 4: the metaphor's implied rules broke at level 0 (the Diff views of drawings also link, names without a definition, and stars on typed items and tabs), so the metaphor is now three parts: the packet, its old, marked-up and new copies, and citations that open their sources. Its rules hold at levels 0 and 1. Applied 5: Load's doc comment and requirement 6 say that Load fails only when it cannot run, and the plan's replace example now gives package errors. Applied 6: flow.4.dfd's neighbour reads \"3. Load and index the code\", and box 3's purpose line gives each identifier its definition. The changes after this round are wording, a parse inside code.Read and one test, so no third round runs.\n"},"docs/plans/2026-09-27-dfdreview-types.md":{"before":null,"after":"# dfdreview: calls and identifiers resolved by type\n\ndfdreview loads the module of the code directory with its types, in both versions, through go/packages and go/types. The changed mark on a function's link then follows the function's calls into the functions and methods of its own package, and every identifier in the code panel opens its definition.\n\n## Requirements\n\n1. A function's link in a box carries the changed mark when the function is a changed declaration: when it differs between the versions, or when its reach in the working tree holds a function or method that does. The reach stays within the function's own package. A method call resolves by the receiver's type, so a change to another type's method of the same name leaves the caller unmarked. A call of an interface method reaches the method of every type of the package that implements the interface. A type's link keeps its rule: the mark follows the type's own declaration.\n2. In the code panel's Before and After views of a Go file, each identifier that uses an object declared in Go code is an identifier link. A predeclared object, such as `int` or `len`, gives no link, and neither does an identifier that declares its object. An object of the code directory opens the same version of its file in the code panel, at its line, and a package of the code directory opens the package clause of its first Go file in path order. An object outside the code directory opens its documentation on pkg.go.dev: `https://pkg.go.dev/\u003cimport path\u003e#\u003cname\u003e`, with `\u003ctype\u003e.\u003cname\u003e` for a method or a field, and with no anchor for a package name.\n3. The page holds every Go file of the code directory in both versions, test files included, so every identifier link into the code directory opens in the code panel.\n4. The views with identifier links keep the colors of their Go syntax.\n5. The load reads the working tree in place and the base from the base export, which it deletes at the end. It runs the go command with -mod=readonly, so a build changes neither the repository, its go.mod and go.sum included, nor the temporary directory.\n6. Without a module, the page builds as before: no identifier links, and the changed mark only on a declaration that differs itself. A package error leaves the build to finish: the package's files still show in the code panel, their identifiers without type information are not links, and the page lists each package error under \"Package errors\". An error that fails a whole version's load, such as a go.mod that the go command rejects, is a package error of that version, which then has no resolution. The build stops on a load error only when the load cannot run at all, as when git cannot read the base. A Go syntax error in a file of the declaration index stops the build, as it does today. A file outside the build configuration shows without identifier links.\n7. The README and review-page.md describe the reach, the identifier links and the package errors.\n\n## Questions and assumptions\n\n- Build configuration: the load runs the go command with its defaults, so GOOS, GOARCH and GOFLAGS, such as `-tags`, apply. A file for another build configuration shows without identifier links, and a `-tags` flag can come later.\n- go.work and go.mod: the load sets GOWORK=off, so each version loads its own module alone, since the base export holds no go.work. It also passes -mod=readonly, which overrides a -mod=mod in GOFLAGS, so the go command never writes go.mod or go.sum. A module that needs a go.mod update gets package errors instead.\n- Test files: the load includes them, so identifiers in tests are links too. The reach follows the package without its tests.\n- Base export: the load writes the module directory's blobs at the base, as `git cat-file` returns them, into a temporary directory. `git archive` would apply `.gitattributes`, such as export-subst and export-ignore, and then the Before texts and their identifier links could disagree. A `replace` directive that points outside the module directory gives the base's packages package errors, and their Before views then show without identifier links, as requirement 6 says.\n- Dependencies: go/packages runs the go command, which may download missing modules into the module cache.\n- The pkg.go.dev links carry no version, like the existing reference links.\n- Design: code.Read loads the module in its own body, and box 3 names code.Load beside code.Read, so the arrows and code.Read's signature stay as they are. Process 3 stays a leaf box: code.Load and its helpers belong to it.\n- I/O: the existing design predates the rule that every piece of I/O is drawn. Processes 1, 2 and 5 read git and files, process 4 runs the dfd command and writes a file of footnote definitions, and process 5 writes the page, all without an external system. This plan draws process 3's I/O and leaves the rest to a separate change. dfd's layout overlaps the labels of close arrows, so each external system shows one label: the reply of the module directory, the reply of the git command, and the base export written for the go command.\n- Size: the page grows by every Go file of both versions and their identifier links. dfdreview's own page, about 5,000 lines of Go, should stay near 1 MB.\n- The work stays on the skills repository's branch hdd-review-page, which holds all of dfdreview.\n- The installed dfdreview, at 7e87621, builds this plan's review pages until the last stage, so other sessions keep a working tool.\n\n## The change in brief\n\ncode.Read now loads the module with its types in both versions. Each version's resolution holds the calls that every function and method makes in its own package, and the text and the identifier links of every Go file, and the load also reports the package errors. The code index compares the declarations and the methods of both versions, parsed without types, and marks each changed declaration, now with every function whose reach in the working tree holds a changed function or method. The page holds every Go file of both versions with its identifier links, so each identifier in the code panel opens its definition, and the page lists the package errors.\n\n## Metaphor\n\nThe review page is an editor's proof packet. Each changed drawing and file comes as old, marked-up and new copies, and every citation in them opens its source.\n\n## Planned declarations\n\nPackage `code`:\n\n- `type Resolved struct`: `Before, After *Resolution`, nil for a version without a module, and `Errors []string`, the package errors of both versions.\n- `type Resolution struct`, with three fields. `Calls map[string][]string` gives, by the key of each function and method, such as `render.renderer.text`, the keys of the functions and methods of its package that it calls. `Files map[string]string` holds the text of every Go file as the load parsed it, test files included. `Links map[string][]Link` holds the identifier links of each Go file.\n- `type Link struct`: the identifier's `Line`, `Col` and `Len`, in UTF-16 code units, and its definition: `File` and `To`, a line of a Go file of the code directory in the same version, or `URL`.\n- `func Load(r *repo.Repo) (*Resolved, error)`: Load type-checks the module in both versions. code.Read calls it first. It returns an error only when it cannot run.\n- `Index` gains `BeforeLinks, AfterLinks map[string][]Link` and `Errors []string`. `code.Read` keeps its signature.\n\nPackage `page`: `type Link struct`, the page's form of a link, and the fields `File.BeforeLinks`, `File.AfterLinks` and `Data.Errors`.\n\nPackage `dfdreview`: `writePage` copies the links and the package errors into the page.\n\nThe page's script: `linkLine(html, n, version)` wraps the identifiers of line n of the open file in identifier links, `openDefinition(link, version)` opens a link's definition, and `packageErrors()` lists the package errors.\n\nThe helpers of code.Load, such as the base export, come with their fills as unexported functions of package code and methods of repo.Repo, and they stay inside box 3.\n\n## Stages\n\n### Stage 1: the load\n\nGoal: code.Load type-checks both versions of the module and records the calls of every function and method within its package, the text of every Go file, and the package errors.\nRequirement: 1, 5, 6.\nDependencies: plan approval.\nHoles: 1 code.Load.\nAcceptance: TestLoadResolvesCalls, TestLoadWithoutModule and TestLoadReportsPackageErrors in package code.\nSize: 250 lines.\n\n### Stage 2: identifier links\n\nGoal: code.Load records the identifier links of every Go file in both versions.\nRequirement: 2.\nDependencies: stage 1.\nHoles: 2 code.Load#2.\nAcceptance: TestLoadLinksIdentifiers in package code.\nSize: 150 lines.\n\n### Stage 3: the reach and every Go file\n\nGoal: the code index compares the methods of both versions too, marks each function whose reach holds a changed function or method, and holds every Go file of both versions.\nRequirement: 1, 3.\nDependencies: stage 1.\nHoles: 3 code.Read, 3 code.Read#2.\nAcceptance: TestReadMarksByReach, TestReadMarksByReachWithoutBaseModule and TestReadHoldsEveryGoFile in package code.\nSize: 120 lines.\n\n### Stage 4: the code panel\n\nGoal: each identifier link in the code panel's Before and After views opens its definition, the syntax colors stay, the changed mark's tooltip covers a change that comes through a call, and the page lists the package errors.\nRequirement: 2, 4, 6, 7.\nDependencies: stages 2 and 3.\nHoles: 4 linkLine, 4 openDefinition, 4 packageErrors.\nAcceptance: the smoke test TestBuildLinksIdentifiers, and a check in a browser ePage` copies the links and the package errors into the page.\n+\n+The page's script: `linkLine(html, n, version)` wraps the identifiers of line n of the open file in identifier links, `openDefinition(link, version)` opens a link's definition, and `packageErrors()` lists the package errors.\n+\n+The helpers of code.Load, such as the base export, come with their fills as unexported functions of package code and methods of repo.Repo, and they stay inside box 3.\n+\n+## Stages\n+\n+### Stage 1: the load\n+\n+Goal: code.Load type-checks both versions of the module and records the calls of every function and method within its package, the text of every Go file, and the package errors.\n+Requirement: 1, 5, 6.\n+Dependencies: plan approval.\n+Holes: 1 code.Load.\n+Acceptance: TestLoadResolvesCalls, TestLoadWithoutModule and TestLoadReportsPackageErrors in package code.\n+Size: 250 lines.\n+\n+### Stage 2: identifier links\n+\n+Goal: code.Load records the identifier links of every Go file in both versions.\n+Requirement: 2.\n+Dependencies: stage 1.\n+Holes: 2 code.Load#2.\n+Acceptance: TestLoadLinksIdentifiers in package code.\n+Size: 150 lines.\n+\n+### Stage 3: the reach and every Go file\n+\n+Goal: the code index compares the methods of both versions too, marks each function whose reach holds a changed function or method, and holds every Go file of both versions.\n+Requirement: 1, 3.\n+Dependencies: stage 1.\n+Holes: 3 code.Read, 3 code.Read#2.\n+Acceptance: TestReadMarksByReach, TestReadMarksByReachWithoutBaseModule and TestReadHoldsEveryGoFile in package code.\n+Size: 120 lines.\n+\n+### Stage 4: the code panel\n+\n+Goal: each identifier link in the code panel's Before and After views opens its definition, the syntax colors stay, the changed mark's tooltip covers a change that comes through a call, and the page lists the package errors.\n+Requirement: 2, 4, 6, 7.\n+Dependencies: stages 2 and 3.\n+Holes: 4 linkLine, 4 openDefinition, 4 packageErrors.\n+Acceptance: the smoke test TestBuildLinksIdentifiers, and a check in a browser on dfdreview's own page against the base of this plan: identifiers are links, each opens its definition, the syntax colors stay, and the console shows no error.\n+Size: 150 lines.\n"},"docs/vocabulary.md":{"before":"# Vocabulary\n\nTerms of dfdreview, one per line.\n\n- review page: the HTML page a reviewer opens at the plan gate and at each stage boundary.\n- base: the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothing has changed.\n- version: one side of the comparison: the base, shown as Before, or the working tree, shown as After.\n- top diagram: the diagram the command names, such as docs/flow.dfd; a child diagram expands one of its processes, as flow.3.dfd expands process 3.\n- action line: the first line of a box, the step's action in the imperative.\n- view: one drawing of a diagram, or one text of a source file: Before, Diff or After. An unchanged diagram or file has a single view.\n- element: a process title, an entity name, a store name or an arrow label of a dfd source, with its text on each of its lines.\n- reference: a qualified name in the last top-level parentheses of a box, such as analyze.sumTypes.\n- item: one comma-separated part of a flow arrow's label, such as \"sum types\".\n- type comment: a line \"# type: item = type\" of a dfd source; an item with one is a typed item.\n- vocabulary: the file of terms, one \"- term: definition\" per line.\n- term: a word or phrase that the vocabulary defines.\n- target: where a link points: a declaration, a type, a term, or a page outside the repository.\n- link: a span of a drawing that points at a target. dfdreview makes one by wrapping a reference, a typed item or a term in dfd's footnote syntax, {text:id}, with a footnote definition, {id} target.\n- footnote definitions: the target of each footnote id that the links use, passed to dfd in one file.\n- alignment: which lines of a diagram's two versions match, and which the change removed or added, found on the sources before any link.\n- patch: the unified diff of one diagram, with the whole file as context, written from its alignment with the linked lines, that dfd draws as the Diff view.\n- sheet: a diagram ready to draw: both versions and the patch, linked.\n- design: the diagrams and the vocabulary, in both versions.\n- code directory: the directory above the design's directory, whose Go files dfdreview indexes.\n- declaration: a top-level Go function, type, variable or constant, with its file and lines, in one version.\n- code index: the declarations of both versions, and the changed files with their diffs.\n- changed file: a file of the code directory that differs between the versions, a new or a deleted file included.\n- diff: the unified diff of a changed file, as git prints it.\n- score card: the output of dfdmetrics -score. The page shows the old card, cached from the last approved review, beside the new card of this review.\n- report: the output of dfdmetrics without -score.\n- notes: the plan's sections \"The change in brief\" and \"Metaphor\", the score cards and the report.\n- code panel: the part of the page that shows a source file in its views.\n","after":"# Vocabulary\n\nTerms of dfdreview, one per line.\n\n- review page: the HTML page a reviewer opens at the plan gate and at each stage boundary.\n- base: the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothing has changed.\n- version: one side of the comparison: the base, shown as Before, or the working tree, shown as After.\n- top diagram: the diagram the command names, such as docs/flow.dfd. A child diagram expands one process of the diagram above it, as flow.3.dfd expands process 3 and flow.3.2.dfd expands process 3.2.\n- view: one drawing of a diagram, or one text of a source file: Before, Diff or After. An unchanged diagram has a single view. A file has a view for each version that holds it, and a Diff view after a change.\n- element: a process title, an entity or external system name, a store name or an arrow label of a dfd source, with its text on each of its lines.\n- external system: something outside the program that a process sends data to or receives data from, drawn as \u003cName\u003e beside the process, such as \u003cGo command\u003e.\n- reference: a qualified name in the last top-level parentheses of a box, such as analyze.sumTypes.\n- item: one comma-separated part of a flow arrow's label, such as \"sum types\".\n- type comment: a line \"# type: item = type\" of a dfd source; an item with one is a typed item.\n- vocabulary: the file of terms, one \"- term: definition\" per line.\n- term: a word or phrase that the vocabulary defines.\n- target: where a link points: a declaration, a type, a term, or a page outside the repository.\n- link: a span of a drawing that points at a target. dfdreview makes one by wrapping a reference, a typed item or a term in dfd's footnote syntax, {text:id}, with a footnote definition, {id} target.\n- footnote definitions: the target of each footnote id that the links use, passed to dfd in one file.\n- alignment: which lines of a diagram's two versions match, and which the change removed or added, found on the sources before any link.\n- patch: the unified diff of one diagram, with the whole file as context, written from its alignment with the linked lines, that dfd draws as the Diff view.\n- sheet: a diagram ready to draw: both versions and the patch, linked.\n- design: the diagrams and the vocabulary, in both versions.\n- code directory: the directory above the design's directory, whose Go files dfdreview indexes.\n- module: the Go module of the nearest go.mod at or above the code directory, inside the repository, in each version. A version without one has no module.\n- module directory: the directory that holds the module's go.mod.\n- base export: a temporary copy of the module directory's blobs at the base, written for the load and deleted after it.\n- load: the work of code.Load: running the go command and type-checking the module in both versions, the base from the base export.\n- build configuration: the GOOS, GOARCH and build tags of the go command, which choose the files of each package.\n- declaration: a top-level Go function, type, variable or constant of a file other than a test file, with its file and lines, in one version. Methods are not declarations, since a box names a method by its type.\n- key: the package name joined to the name of a declaration, as in analyze.sumTypes, or of a method, as in render.renderer.text. Two packages with one name share their keys.\n- changed declaration: a declaration or a method that differs between the versions, doc comment included, or exists in one of them only, as a parse without types finds it, and a function whose reach in the working tree holds such a function or method.\n- reach: the functions and methods of a function's own package that it calls, and those that they call in turn, without leaving the package or entering its tests. A method call resolves by the receiver's type, and a call of an interface method reaches the method of every type of the package that implements the interface.\n- changed mark: the red asterisk after the link of a changed declaration, and after the label of a diagram tab whose drawings hold such a link.\n- resolution: what the load finds in one version of the module: the functions and methods of its own package that each function and method calls, and the text and the identifier links of every Go file.\n- identifier link: an identifier in a Go file that uses an object declared in Go code, not a predeclared one such as int, with the place where the page opens the object: a line of a Go file of the code directory in the same version, the package clause of a package's first file, or the object's documentation on pkg.go.dev.\n- package error: an error that the load reports for a version: an error of the go command, a parse or type error of a package, or the failure of the version's whole load.\n- code index: the declarations of both versions with the changed ones, the files the page shows with the identifier links of each Go file, the standard library's import paths, the package errors, and the changed files with their diffs.\n- changed file: a file of the code directory that differs between the versions, a new or a deleted file included.\n- diff: the unified diff of a changed file, as git prints it.\n- score card: the output of dfdmetrics -score. The page shows the old card, cached from the last approved review, beside the new card of this review.\n- report: the output of dfdmetrics without -score.\n- notes: the plan's title and its sections \"The change in brief\" and \"Metaphor\", the score cards and the report.\n- code panel: the part of the page that shows a source file in its views.\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md b/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\nindex 9700c02..c159746 100644\n--- a/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\n+++ b/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\n@@ -5,10 +5,10 @@ Terms of dfdreview, one per line.\n - review page: the HTML page a reviewer opens at the plan gate and at each stage boundary.\n - base: the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothing has changed.\n - version: one side of the comparison: the base, shown as Before, or the working tree, shown as After.\n-- top diagram: the diagram the command names, such as docs/flow.dfd; a child diagram expands one of its processes, as flow.3.dfd expands process 3.\n-- action line: the first line of a box, the step's action in the imperative.\n-- view: one drawing of a diagram, or one text of a source irectory's blobs at the base, written for the load and deleted after it.\n+- load: the work of code.Load: running the go command and type-checking the module in both versions, the base from the base export.\n+- build configuration: the GOOS, GOARCH and build tags of the go command, which choose the files of each package.\n+- declaration: a top-level Go function, type, variable or constant of a file other than a test file, with its file and lines, in one version. Methods are not declarations, since a box names a method by its type.\n+- key: the package name joined to the name of a declaration, as in analyze.sumTypes, or of a method, as in render.renderer.text. Two packages with one name share their keys.\n+- changed declaration: a declaration or a method that differs between the versions, doc comment included, or exists in one of them only, as a parse without types finds it, and a function whose reach in the working tree holds such a function or method.\n+- reach: the functions and methods of a function's own package that it calls, and those that they call in turn, without leaving the package or entering its tests. A method call resolves by the receiver's type, and a call of an interface method reaches the method of every type of the package that implements the interface.\n+- changed mark: the red asterisk after the link of a changed declaration, and after the label of a diagram tab whose drawings hold such a link.\n+- resolution: what the load finds in one version of the module: the functions and methods of its own package that each function and method calls, and the text and the identifier links of every Go file.\n+- identifier link: an identifier in a Go file that uses an object declared in Go code, not a predeclared one such as int, with the place where the page opens the object: a line of a Go file of the code directory in the same version, the package clause of a package's first file, or the object's documentation on pkg.go.dev.\n+- package error: an error that ach diagram of d in its views, with links to code, types and terms.\nfunc Views(d *design.Design, c *code.Index, dfd Command) ([]View, error) {\n\talignments := align(d)\n\tsheets, footnotes := link(d, c, alignments)\n\treturn render(dfd, sheets, footnotes)\n}\n\n// sheet is a diagram ready to draw: both versions and the patch, linked.\ntype sheet struct {\n\tnumber, title, path string\n\tsource              repo.Pair // the linked versions\n\tpatch               string    // \"\" for a diagram without changes\n}\n\n// align matches the lines of the two versions of each changed diagram, by path.\n// Without a base, nothing has changed.\nfunc align(d *design.Design) map[string][]dfdtext.Op {\n\talignments := map[string][]dfdtext.Op{}\n\tif d.Base == \"\" {\n\t\treturn alignments\n\t}\n\tfor _, dg := range d.Diagrams {\n\t\tb, a := dg.Source.Before, dg.Source.After\n\t\tif b.Found \u0026\u0026 a.Found \u0026\u0026 b.Content == a.Content {\n\t\t\tcontinue\n\t\t}\n\t\talignments[dg.Path] = dfdtext.Align(b.Content, a.Content)\n\t}\n\treturn alignments\n}\n\n// link links both versions of each diagram and writes each patch with the linked lines.\n// It returns the sheets and the footnote definitions their links use.\nfunc link(d *design.Design, c *code.Index, alignments map[string][]dfdtext.Op) ([]sheet, map[string]string) {\n\tfootnotes := map[string]string{}\n\ttarget := func(ref dfdtext.Reference) string {\n\t\tkey := code.Key(ref)\n\t\t_, before := c.Before[key]\n\t\t_, after := c.After[key]\n\t\tif !before \u0026\u0026 !after \u0026\u0026 (c.Std[ref.Qualifier] || strings.Contains(ref.Qualifier, \".\")) {\n\t\t\treturn \"https://pkg.go.dev/\" + ref.Qualifier + \"#\" + ref.Name\n\t\t}\n\t\t// A name without a declaration still links, so the page can report it.\n\t\treturn \"#code/\" + key\n\t}\n\tlinked := func(t repo.Text, vocabulary repo.Text) repo.Text {\n\t\tif !t.Found {\n\t\t\treturn t\n\t\t}\n\t\tsrc, used := dfdtext.Link(t.Content, dfdtext.Linker{\n\t\t\tCode:     });\n    }\n    $(\"code-body\").innerHTML = out.join(\"\");\n    const target = where \u0026\u0026 document.getElementById(\"L\" + where.start);\n    $(\"code\").scrollTop = target ? target.offsetTop - $(\"code-head\").offsetHeight - 12 : 0;\n  }\n\n  // The notes under the drawings.\n  function section(title, content) {\n    const h = document.createElement(\"h2\");\n    h.textContent = title;\n    $(\"notes\").appendChild(h);\n    $(\"notes\").appendChild(content);\n  }\n\n  function prose(text) {\n    const div = document.createElement(\"div\");\n    div.className = \"prose\";\n    text.split(/\\n\\s*\\n/).forEach((para) =\u003e {\n      const p = document.createElement(\"p\");\n      p.textContent = para.replace(/\\n/g, \" \");\n      div.appendChild(p);\n    });\n    return div;\n  }\n\n  function scoreTable() {\n    const old = data.oldScore;\n    const rows = [\"\u003ctr\u003e\u003cth\u003eColumn\u003c/th\u003e\u003cth\u003eCached\u003c/th\u003e\u003cth\u003eNew\u003c/th\u003e\u003cth\u003eChange\u003c/th\u003e\u003c/tr\u003e\"];\n    data.newScore.columns.forEach((col, i) =\u003e {\n      const now = Number(data.newScore.values[i]);\n      const k = old ? old.columns.indexOf(col) : -1;\n      const before = k \u003e= 0 ? Number(old.values[k]) : null;\n      let change = \"\";\n      if (before !== null \u0026\u0026 !Number.isNaN(now) \u0026\u0026 !Number.isNaN(before)) {\n        const d = now - before;\n        change = d \u003e 0 ? '\u003cspan class=\"rise\"\u003e+' + d + \" rise\u003c/span\u003e\" : d \u003c 0 ? '\u003cspan class=\"fall\"\u003e' + d + \"\u003c/span\u003e\" : \"0\";\n      }\n      rows.push(\"\u003ctr\u003e\u003ctd\u003e\" + esc(col) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + (before === null ? \"\" : before) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' +\n        esc(data.newScore.values[i]) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + change + \"\u003c/td\u003e\u003c/tr\u003e\");\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.join(\"\");\n    return t;\n  }\n\n  function vocabularyChanges() {\n    const before = data.terms.before || {};\n    const after = data.terms.after || {};\n    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();\n    const rows = [];\n    names.forEach((term) =\u003e {\n      let kind = \"\";\n      if (!(term in before)) {\n        kind = \"added\";\n      } else if (!(term in after)) {\n        kind = \"removed\";\n      } else if (before[term] !== after[term]) {\n        kind = \"changed\";\n      }\n      if (kind) {\n        rows.push('\u003ctr\u003e\u003ctd class=\"' + kind + '\"\u003e' + kind + \"\u003c/td\u003e\u003ctd\u003e\" + esc(term) + \"\u003c/td\u003e\u003ctd\u003e\" + esc(after[term] || before[term]) + \"\u003c/td\u003e\u003c/tr\u003e\");\n      }\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.length ? rows.join(\"\") : '\u003ctr\u003e\u003ctd class=\"muted\"\u003eNo changes.\u003c/td\u003e\u003c/tr\u003e';\n    return t;\n  }\n\n  function changedFiles() {\n    const ul = document.createElement(\"ul\");\n    ul.className = \"files\";\n    (data.changed || []).forEach((c) =\u003e {\n      const li = document.createElement(\"li\");\n      const s = document.createElement(\"span\");\n      s.className = \"status \" + ({ added: \"added\", deleted: \"removed\" }[c.status] || \"changed\");\n      s.textContent = c.status;\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = c.path;\n      b.addEventListener(\"click\", () =\u003e openFile(c.path, \"diff\", null));\n      li.appendChild(s);\n      li.appendChild(b);\n      ul.appendChild(li);\n    });\n    if (!ul.children.length) {\n      ul.innerHTML = '\u003cli class=\"muted\"\u003eNo changes.\u003c/li\u003e';\n    }\n    return ul;\n  }\n\n  if (data.brief) {\n    section(\"The change in brief\", prose(data.brief));\n  }\n  if (data.metaphor) {\n    section(\"Metaphor\", prose(data.metaphor));\n  }\n  if (data.newScore) {\n    section(\"Score\", scoreTable());\n  }\n  if (data.base) {\n    section(\"Vocabulary changes\", vocabularyChanges());\n    section(\"Changed files\", changedFiles());\n  }\n  if (data.report) {\n    const pre = document.createElement(\"pre\");\n    pre.className = \"report\";\n    pre.textContent = data.report;\n    section(\"dfdmetrics report\", pre);\n  }\n  if (data.diagrams.length) {\n    selectDiagram(0);\n  }\n\n  // The splitter resizes the code panel, and this browser keeps the width.\n  const main = document.querySelector(\"main\");\n  const splitter = $(\"splitter\");\n  const widthKey = \"dfdreview.codeWidth\";\n  function setCodeWidth(px) {\n    const width = Math.max(240, Math.min(px, main.clientWidth - 320));\n    main.style.setProperty(\"--code-width\", width + \"px\");\n    return width;\n  }\n  function saveCodeWidth(width) {\n    try {\n      localStorage.setItem(widthKey, String(width));\n    } catch (e) {\n      // Without storage, the width lasts until the page reloads.\n    }\n  }\n  try {\n    const saved = Number(localStorage.getItem(widthKey));\n    if (saved \u003e 0) {\n      setCodeWidth(saved);\n    }\n  } catch (e) {\n    // Without storage, the panel keeps its default width.\n  }\n  splitter.addEventListener(\"pointerdown\", (e) =\u003e {\n    e.preventDefault();\n    splitter.setPointerCapture(e.pointerId);\n    splitter.classList.add(\"dragging\");\n    document.body.classList.add(\"resizing\");\n  });\n  splitter.addEventListener(\"pointermove\", (e) =\u003e {\n    if (splitter.hasPointerCapture(e.pointerId)) {\n      setCodeWidth(main.getBoundingClientRect().right - e.clientX);\n    }\n  });\n  splitter.addEventListener(\"pointerup\", (e) =\u003e {\n    splitter.releasePointerCapture(e.pointerId);\n    splitter.classList.remove(\"dragging\");\n    document.body.classList.remove(\"resizing\");\n    saveCodeWidth($(\"code\").offsetWidth);\n  });\n  splitter.addEventListener(\"keydown\", (e) =\u003e {\n    const step = e.shiftKey ? 80 : 20;\n    if (e.key === \"ArrowLeft\" || e.key === \"ArrowRight\") {\n      e.preventDefault();\n      const wider = e.key === \"ArrowLeft\" ? step : -step;\n      saveCodeWidth(setCodeWidth($(\"code\").offsetWidth + wider));\n    }\n  });\n  splitter.addEventListener(\"dblclick\", () =\u003e {\n    main.style.removeProperty(\"--code-width\");\n    try {\n      localStorage.removeItem(widthKey);\n    } catch (e) {\n      // Without storage, there is no saved width to forget.\n    }\n  });\n  window.addEventListener(\"resize\", () =\u003e {\n    if (main.style.getPropertyValue(\"--code-width\")) {\n      setCodeWidth($(\"code\").offsetWidth);\n    }\n  });\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","after":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003e{{TITLE}}\u003c/title\u003e\n\u003cstyle\u003e\n:root {\n  --paper: #f5f6f8; --ink: #1b1f26; --muted: #5d6470; --panel: #ffffff; --rule: #d9dce3;\n  --accent: #4a37b0; --sel: #ece8fb; --sel-rule: #b9acf0;\n  --add: #1e7e34; --add-bg: #e6f4ea; --del: #b3261e; --del-bg: #fdecea; --amber: #b36b00;\n  --code-kw: #8a3d9c; --code-str: #1d6b3a; --code-cmt: #6f7682; --code-type: #1c5fa8; --code-num: #a35a12;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;\n    --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0;\n    --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b;\n    --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;\n  --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0;\n  --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b;\n  --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; height: 100%; }\nbody { background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, \"Segoe UI\", sans-serif; }\nheader { padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }\nheader h1 { font-size: 16px; margin: 0; }\nheader p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }\nmain { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }\n#left { overflow: auto; padding: 12px 16px 32px; }\n#splitter { cursor: col-resize; background: var(--rule); border-left: 3px solid var(--paper); border-right: 3px solid var(--panel); }\n#splitter:hover, #splitter.dragging, #splitter:focus-visible { background: var(--sel-rule); outline: none; }\nbody.resizing { cursor: col-resize; user-select: none; }\n#code { position: relative; overflow: auto; background: var(--panel); }\n@media (max-width: 1000px) {\n  main { grid-template-columns: minmax(0, 1fr); height: auto; }\n  #splitter { display: none; }\n  #code { border-top: 1px solid var(--rule); max-height: 80vh; }\n}\n.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }\n.tabs button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px;\n  background: transparent; color: var(--muted); cursor: pointer; }\n.tabs button[aria-selected=\"true\"] { background: var(--panel); color: var(--ink); border-color: var(--sel-rule); font-weight: 600; }\n.tabs.small button { font-size: 12px; padding: 2px 8px; }\n.tabs button .mark { color: var(--del); font-weight: 700; margin-left: 2px; }\n#drawing svg { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; }\n#drawing a[href] { cursor: pointer; }\n#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }\n#drawing .child { cursor: pointer; fill: #4a37b0; text-decoration: underline; }\n#drawing .missing tspan { fill: #b3261e; }\n/* A larger asterisk stays visible in a scaled-down drawing; the shift keeps it on its line. */\n#drawing a[href] tspan.changed, #drawing a[href]:hover tspan.changed, #drawing a[href]:focus tspan.changed {\n  fill: #b3261e; font-weight: 700; font-size: 1.7em; baseline-shift: -0.35em; }\nh2 { font-size: 14px; margin: 22px 0 6px; }\n#diagram-title { font-size: 15px; margin: 2px 0 8px; }\n.prose p { margin: 0 0 8px; max-width: 70em; }\ntable { border-collapse: collapse; font-size: 13px; }\nth, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }\ntd.num { text-align: right; font-variant-numeric: tabular-nums; }\n.rise { color: var(--del); font-weight: 600; }\n.fall { color: var(--add); }\n.added { color: var(--add); }\n.removed { color: var(--del); }\n.changed { color: var(--amber); }\nul.files { list-style: none; padding: 0; margin: 0; }\nul.files li { padding: 2px 0; }\nul.files button { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }\n.status { display: inline-block; width: 5.5em; font-size: 12px; }\npre.report { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--rule);\n  border-radius: 6px; padding: 8px 10px; overflow-x: auto; }\n.muted { color: var(--muted); }\n#code-head { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; }\n#code-status { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 6px; }\n#code-body { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }\n#code-body .empty { padding: 20px; color: var(--muted); font: 14px/1.5 system-ui, sans-serif; }\n.line { display: flex; white-space: pre; }\n.line .n { flex: 0 0 3.6em; text-align: right; padding-right: 1em; color: var(--muted); user-select: none; }\n.line .s { padding-right: 16px; }\n.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }\n.line.add { background: var(--add-bg); }\n.line.del { background: var(--del-bg); }\n.line.hunk { color: var(--muted); }\n/* The After view marks changed lines beside their numbers; the left edge marks a selected declaration. */\n.line.added .n { box-shadow: inset -4px 0 0 var(--add); }\n.line.modified .n { box-shadow: inset -4px 0 0 var(--amber); }\n.hljs-keyword, .hljs-literal { color: var(--code-kw); }\n.hljs-string { color: var(--code-str); }\n.hljs-comment { color: var(--code-cmt); }\n.hljs-type, .hljs-built_in { color: var(--code-type); }\n.hljs-number { color: var(--code-num); }\n.hljs-title { font-weight: 600; }\n\u003c/style\u003e\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader\u003e\n  \u003ch1 id=\"title\"\u003e\u003c/h1\u003e\n  \u003cp id=\"subtitle\"\u003e\u003c/p\u003e\n\u003c/header\u003e\n\u003cmain\u003e\n  \u003csection id=\"left\"\u003e\n    \u003cdiv id=\"tabs\" class=\"tabs\" role=\"tablist\" aria-label=\"Diagrams\"\u003e\u003c/div\u003e\n    \u003ch2 id=\"diagram-title\"\u003e\u003c/h2\u003e\n    \u003cdiv id=\"views\" class=\"tabs small\" role=\"tablist\" aria-label=\"Views\"\u003e\u003c/div\u003e\n    \u003cdiv id=\"drawing\"\u003e\u003c/div\u003e\n    \u003cdiv id=\"notes\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n  \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" aria-label=\"Resize the code panel\" tabindex=\"0\" title=\"Drag to resize; double-click to reset\"\u003e\u003c/div\u003e\n  \u003caside id=\"code\" aria-label=\"Code\"\u003e\n    \u003cdiv id=\"code-head\"\u003e\n      \u003cdiv id=\"code-status\"\u003eNo file open.\u003c/div\u003e\n      \u003cdiv id=\"code-views\" class=\"tabs small\" role=\"tablist\" aria-label=\"Versions\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"code-body\"\u003e\u003cdiv class=\"empty\"\u003eClick a function or type name in a box to open its source here, or a file under \"Changed files\" to see its diff.\u003c/div\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n\u003c/main\u003e\n\u003cscript id=\"data\" type=\"application/json\"\u003e{{DATA}}\u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n  const data = JSON.parse(document.getElementById(\"data\").textContent);\n  const $ = (id) =\u003e document.getElementById(id);\n  const esc = (s) =\u003e String(s).replace(/\u0026/g, \"\u0026amp;\").replace(/\u003c/g, \"\u0026lt;\").replace(/\u003e/g, \"\u0026gt;\");\n  const other = (version) =\u003e (version === \"before\" ? \"after\" : \"before\");\n  const viewNames = { before: \"Before\", diff: \"Diff\", after: \"After\" };\n  const state = { diagram: 0, view: {}, file: null, key: null, fileView: \"after\" };\n\n  $(\"title\").textContent = data.title;\n  $(\"subtitle\").textContent = data.base\n    ? \"Before is \" + data.base.slice(0, 12) + \", and After is the working tree.\"\n    : \"The working tree alone, with no base to compare against.\";\n\n  function tabs(container, items, selected, onSelect) {\n    container.innerHTML = \"\";\n    items.forEach((item) =\u003e {\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.setAttribute(\"role\", \"tab\");\n      b.setAttribute(\"aria-selected\", String(item.id === selected));\n      b.textContent = item.label;\n      if (item.hint) {\n        b.title = item.hint;\n      }\n      if (item.mark) {\n        const star = document.createElement(\"span\");\n        star.className = \"mark\";\n        star.textContent = \"*\";\n        star.title = item.mark;\n        b.appendChild(star);\n      }\n      b.addEventListener(\"click\", () =\u003e onSelect(item.id));\n      container.appendChild(b);\n    });\n  }\n\n  // The diagrams, each in its views.\n  let marked = null; // for each diagram, whether its drawings link a changed declaration\n\n  function selectDiagram(i) {\n    state.diagram = i;\n    marked = marked || data.diagrams.map(hasChange);\n    // A tab shows the diagram's number. Its title, the description of the expanded\n    // process, shows on hover and above the drawing.\n    tabs($(\"tabs\"), data.diagrams.map((d, k) =\u003e ({\n      id: k, label: d.number || \"Overview\", hint: d.number ? d.title : \"\",\n      mark: marked[k] ? \"links a declaration changed since \" + data.base : \"\",\n    })), i, selectDiagram);\n    const d = data.diagrams[i];\n    $(\"diagram-title\").textContent = d.title;\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e d[v]);\n    let view = state.view[i];\n    if (!present.includes(view)) {\n      view = present.includes(\"diff\") ? \"diff\" : present[present.length - 1];\n    }\n    showView(view);\n  }\n\n  function showView(view) {\n    const d = data.diagrams[state.diagram];\n    state.view[state.diagram] = view;\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e d[v]);\n    tabs($(\"views\"), present.length \u003e 1 ? present.map((v) =\u003e ({ id: v, label: viewNames[v] })) : [], view, showView);\n    $(\"drawing\").innerHTML = d[view] || \"\";\n    const svg = $(\"drawing\").querySelector(\"svg\");\n    if (svg) {\n      decorate(svg, view);\n    }\n  }\n\n  // The Before view reads the base; the Diff and After views read the working tree.\n  const versionOf = (view) =\u003e (view === \"before\" ? \"before\" : \"after\");\n\n  function decorate(svg, view) {\n    const version = versionOf(view);\n    svg.querySelectorAll(\"a[href]\").forEach((a) =\u003e {\n      const href = a.getAttribute(\"href\");\n      if (href.startsWith(\"#term/\")) {\n        const term = decodeURIComponent(href.slice(6));\n        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];\n        if (def) {\n          const t = document.createElementNS(\"http://www.w3.org/2000/svg\", \"title\");\n          t.textContent = term + \": \" + def;\n          a.appendChild(t);\n        }\n      } else if (href.startsWith(\"#code/\")) {\n        const decl = data.decls[href.slice(6)];\n        if (!decl || (!decl.before \u0026\u0026 !decl.after)) {\n          a.classList.add(\"missing\");\n        } else if (decl.changed) {\n          markChanged(a);\n        }\n      } else if (href.startsWith(\"#type/\")) {\n        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];\n        if (decl \u0026\u0026 decl.changed) {\n          markChanged(a);\n        }\n      } else if (/^https?:/.test(href)) {\n        a.setAttribute(\"target\", \"_blank\");\n        a.setAttribute(\"rel\", \"noopener\");\n      }\n    });\n    const here = data.diagrams[state.diagram].number;\n    svg.querySelectorAll(\"text\").forEach((t) =\u003e {\n      const n = t.textContent.trim();\n      const child = data.diagrams.findIndex((d) =\u003e d.number !== \"\" \u0026\u0026 d.number === n \u0026\u0026 parentOf(d.number) === here);\n      if (child \u003e= 0 \u0026\u0026 !t.closest(\"a\")) {\n        t.classList.add(\"child\");\n        t.setAttribute(\"tabindex\", \"0\");\n        t.setAttribute(\"role\", \"link\");\n        t.addEventListener(\"click\", () =\u003e selectDiagram(child));\n        t.addEventListener(\"keydown\", (e) =\u003e {\n          if (e.key === \"Enter\") {\n            selectDiagram(child);\n          }\n        });\n      }\n    });\n    svg.addEventListener(\"click\", (e) =\u003e {\n      const a = e.target.closest(\"a[href]\");\n      if (!a) {\n        return;\n      }\n      const href = a.getAttribute(\"href\");\n      if (href.startsWith(\"#code/\")) {\n        e.preventDefault();\n        showDecl(href.slice(6), version);\n      } else if (href.startsWith(\"#type/\")) {\n        e.preventDefault();\n        showType(decodeURIComponent(href.slice(6)), version);\n      } else if (href.startsWith(\"#\")) {\n        e.preventDefault();\n      }\n    });\n  }\n\n  // hasChange reports whether a diagram's drawings link a declaration that differs from the base.\n  function hasChange(d) {\n    return [\"before\", \"diff\", \"after\"].some((view) =\u003e\n      [...(d[view] || \"\").matchAll(/href=\"#(code|type)\\/([^\"]*)\"/g)].some((m) =\u003e {\n        const key = m[1] === \"code\" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));\n        return Boolean((data.decls[key] || {}).changed);\n      }),\n    );\n  }\n\n  // markChanged puts a red asterisk after a link whose declaration differs from the base.\n  function markChanged(a) {\n    const star = document.createElementNS(\"http://www.w3.org/2000/svg\", \"tspan\");\n    star.classList.add(\"changed\");\n    star.textContent = \"*\";\n    const t = document.createElementNS(\"http://www.w3.org/2000/svg\", \"title\");\n    t.textContent = \"changed since \" + data.base;\n    a.append(star, t);\n  }\n\n  function parentOf(number) {\n    const i = number.lastIndexOf(\".\");\n    return i \u003c 0 ? \"\" : number.slice(0, i);\n  }\n\n  // The code panel.\n  function status(html) {\n    $(\"code-status\").innerHTML = html;\n  }\n\n  function placeOf(key, version) {\n    return (data.decls[key] || {})[version] || null;\n  }\n\n  function showDecl(key, version) {\n    const place = placeOf(key, version) || placeOf(key, other(version));\n    if (!place) {\n      status(esc(key) + \" has no declaration in either version.\");\n      return false;\n    }\n    openFile(place.file, placeOf(key, version) ? version : other(version), key);\n    return true;\n  }\n\n  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.\n  function typeOf(d, item, version) {\n    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || \"\";\n  }\n\n  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.\n  function typeKey(type) {\n    const m = /\\b([a-z][a-z0-9_]*)\\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);\n    return m ? m[1] + \".\" + m[2] : \"\";\n  }\n\n  function showType(item, version) {\n    const type = typeOf(data.diagrams[state.diagram], item, version);\n    if (!type) {\n      status(esc(item) + \" has no type comment.\");\n      return;\n    }\n    const key = typeKey(type);\n    if (!key || !showDecl(key, version)) {\n      status(esc(item) + \": \" + esc(type));\n      return;\n    }\n    $(\"code-status\").innerHTML = esc(item) + \": \" + esc(type) + \"\u003cbr\u003e\" + $(\"code-status\").innerHTML;\n  }\n\n  function openFile(path, view, key) {\n    state.file = path;\n    state.key = key || null;\n    state.fileView = view;\n    renderFile();\n  }\n\n  // changedLines returns the status of each changed line of a file's After version, by line\n  // number, from the file's unified diff: \"modified\" for a line that replaces removed lines,\n  // and \"added\" for any other added line.\n  function changedLines(diff) {\n    const status = {};\n    let line = 0; // the After version's number of the next line, 0 before the first hunk\n    let removed = 0;\n    let added = [];\n    const flush = () =\u003e {\n      added.forEach((n) =\u003e {\n        status[n] = removed \u003e 0 ? \"modified\" : \"added\";\n      });\n      removed = 0;\n      added = [];\n    };\n    (diff || \"\").split(\"\\n\").forEach((ln) =\u003e {\n      const hunk = /^@@ -\\d+(?:,\\d+)? \\+(\\d+)/.exec(ln);\n      if (hunk) {\n        flush();\n        line = Number(hunk[1]);\n      } else if (line === 0 || ln.startsWith(\"\\\\\")) {\n        // The file's header, or a note such as \"\\ No newline at end of file\".\n      } else if (ln.startsWith(\"+\")) {\n        added.push(line++);\n      } else if (ln.startsWith(\"-\")) {\n        removed++;\n      } else {\n        flush();\n        line++;\n      }\n    });\n    flush();\n    return status;\n  }\n\n  // linkLine wraps each identifier of line n of the open file, in its highlighted html,\n  // in a link to the identifier's definition in the same version.\n  function linkLine(html, n, version) {\n    // HOLE(4): find the line's identifier links in the open file's links of version, and wrap each identifier, found by its column, in a link that calls openDefinition\n    return html;\n  }\n\n  // openDefinition opens a link's definition: its file in the same version at its line, or its URL.\n  function openDefinition(link, version) {\n    // HOLE(4): open the definition's file in the code panel in version, at its line, or open its URL in a new tab\n  }\n\n  function renderFile() {\n    const f = data.files[state.file];\n    if (!f) {\n      status(esc(state.file) + \" is not on the page.\");\n      $(\"code-views\").innerHTML = \"\";\n      $(\"code-body\").innerHTML = \"\";\n      return;\n    }\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e (v === \"diff\" ? f.diff : f[v] !== null));\n    if (!present.includes(state.fileView)) {\n      state.fileView = present[present.length - 1];\n    }\n    tabs($(\"code-views\"), present.length \u003e 1 ? present.map((v) =\u003e ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) =\u003e {\n      state.fileView = v;\n      renderFile();\n    });\n    const where = state.key \u0026\u0026 state.fileView !== \"diff\" ? placeOf(state.key, state.fileView) : null;\n    let label = esc(state.file) + \" (\" + viewNames[state.fileView] + \")\";\n    if (state.key) {\n      label = esc(state.key) + (where ? \" in \" + esc(state.file) + \":\" + where.start : \" in \" + esc(state.file)) + \" (\" + viewNames[state.fileView] + \")\";\n    }\n    status(label);\n    const out = [];\n    if (state.fileView === \"diff\") {\n      f.diff.replace(/\\n$/, \"\").split(\"\\n\").forEach((ln, i) =\u003e {\n        let cls = \"\";\n        if (ln.startsWith(\"@@\")) {\n          cls = \" hunk\";\n        } else if (ln.startsWith(\"+\") \u0026\u0026 !ln.startsWith(\"+++\")) {\n          cls = \" add\";\n        } else if (ln.startsWith(\"-\") \u0026\u0026 !ln.startsWith(\"---\")) {\n          cls = \" del\";\n        }\n        out.push('\u003cdiv class=\"line' + cls + '\"\u003e\u003cspan class=\"n\"\u003e' + (i + 1) + '\u003c/span\u003e\u003cspan class=\"s\"\u003e' + esc(ln) + \"\u003c/span\u003e\u003c/div\u003e\");\n      });\n    } else {\n      const go = state.file.endsWith(\".go\") \u0026\u0026 window.hljs;\n      const changed = state.fileView === \"after\" ? changedLines(f.diff) : {};\n      f[state.fileView].replace(/\\n$/, \"\").split(\"\\n\").forEach((ln, i) =\u003e {\n        const n = i + 1;\n        const sel = (where \u0026\u0026 n \u003e= where.start \u0026\u0026 n \u003c= where.end ? \" sel\" : \"\") + (changed[n] ? \" \" + changed[n] : \"\");\n        const src = linkLine(go ? hljs.highlight(ln, { language: \"go\", ignoreIllegals: true }).value : esc(ln), n, state.fileView);\n        out.push('\u003cdiv class=\"line' + sel + '\" id=\"L' + n + '\"\u003e\u003cspan class=\"n\"\u003e' + n + '\u003c/span\u003e\u003cspan class=\"s\"\u003e' + src + \"\u003c/span\u003e\u003c/div\u003e\");\n      });\n    }\n    $(\"code-body\").innerHTML = out.join(\"\");\n    const target = where \u0026\u0026 document.getElementById(\"L\" + where.start);\n    $(\"code\").scrollTop = target ? target.offsetTop - $(\"code-head\").offsetHeight - 12 : 0;\n  }\n\n  // packageErrors lists the package errors of both versions.\n  function packageErrors() {\n    // HOLE(4): list each package error, with its version and its package\n    return document.createElement(\"ul\");\n  }\n\n  // The notes under the drawings.\n  function section(title, content) {\n    const h = document.createElement(\"h2\");\n    h.textContent = title;\n    $(\"notes\").appendChild(h);\n    $(\"notes\").appendChild(content);\n  }\n\n  function prose(text) {\n    const div = document.createElement(\"div\");\n    div.className = \"prose\";\n    text.split(/\\n\\s*\\n/).forEach((para) =\u003e {\n      const p = document.createElement(\"p\");\n      p.textContent = para.replace(/\\n/g, \" \");\n      div.appendChild(p);\n    });\n    return div;\n  }\n\n  function scoreTable() {\n    const old = data.oldScore;\n    const rows = [\"\u003ctr\u003e\u003cth\u003eColumn\u003c/th\u003e\u003cth\u003eCached\u003c/th\u003e\u003cth\u003eNew\u003c/th\u003e\u003cth\u003eChange\u003c/th\u003e\u003c/tr\u003e\"];\n    data.newScore.columns.forEach((col, i) =\u003e {\n      const now = Number(data.newScore.values[i]);\n      const k = old ? old.columns.indexOf(col) : -1;\n      const before = k \u003e= 0 ? Number(old.values[k]) : null;\n      let change = \"\";\n      if (before !== null \u0026\u0026 !Number.isNaN(now) \u0026\u0026 !Number.isNaN(before)) {\n        const d = now - before;\n        change = d \u003e 0 ? '\u003cspan class=\"rise\"\u003e+' + d + \" rise\u003c/span\u003e\" : d \u003c 0 ? '\u003cspan class=\"fall\"\u003e' + d + \"\u003c/span\u003e\" : \"0\";\n      }\n      rows.push(\"\u003ctr\u003e\u003ctd\u003e\" + esc(col) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + (before === null ? \"\" : before) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' +\n        esc(data.newScore.values[i]) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + change + \"\u003c/td\u003e\u003c/tr\u003e\");\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.join(\"\");\n    return t;\n  }\n\n  function vocabularyChanges() {\n    const before = data.terms.before || {};\n    const after = data.terms.after || {};\n    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();\n    const rows = [];\n    names.forEach((term) =\u003e {\n      let kind = \"\";\n      if (!(term in before)) {\n        kind = \"added\";\n      } else if (!(term in after)) {\n        kind = \"removed\";\n      } else if (before[term] !== after[term]) {\n        kind = \"changed\";\n      }\n      if (kind) {\n        rows.push('\u003ctr\u003e\u003ctd class=\"' + kind + '\"\u003e' + kind + \"\u003c/td\u003e\u003ctd\u003e\" + esc(term) + \"\u003c/td\u003e\u003ctd\u003e\" + esc(after[term] || before[term]) + \"\u003c/td\u003e\u003c/tr\u003e\");\n      }\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.length ? rows.join(\"\") : '\u003ctr\u003e\u003ctd class=\"muted\"\u003eNo changes.\u003c/td\u003e\u003c/tr\u003e';\n    return t;\n  }\n\n  function changedFiles() {\n    const ul = document.createElement(\"ul\");\n    ul.className = \"files\";\n    (data.changed || []).forEach((c) =\u003e {\n      const li = document.createElement(\"li\");\n      const s = document.createElement(\"span\");\n      s.className = \"status \" + ({ added: \"added\", deleted: \"removed\" }[c.status] || \"changed\");\n      s.textContent = c.status;\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = c.path;\n      b.addEventListener(\"click\", () =\u003e openFile(c.path, \"diff\", null));\n      li.appendChild(s);\n      li.appendChild(b);\n      ul.appendChild(li);\n    });\n    if (!ul.children.length) {\n      ul.innerHTML = '\u003cli class=\"muted\"\u003eNo changes.\u003c/li\u003e';\n    }\n    return ul;\n  }\n\n  if (data.brief) {\n    section(\"The change in brief\", prose(data.brief));\n  }\n  if (data.metaphor) {\n    section(\"Metaphor\", prose(data.metaphor));\n  }\n  if (data.newScore) {\n    section(\"Score\", scoreTable());\n  }\n  if (data.base) {\n    section(\"Vocabulary changes\", vocabularyChanges());\n    section(\"Changed files\", changedFiles());\n  }\n  if (data.report) {\n    const pre = document.createElement(\"pre\");\n    pre.className = \"report\";\n    pre.textContent = data.report;\n    section(\"dfdmetrics report\", pre);\n  }\n  if (data.errors \u0026\u0026 data.errors.length) {\n    section(\"Package errors\", packageErrors());\n  }\n  if (data.diagrams.length) {\n    selectDiagram(0);\n  }\n\n  // The splitter resizes the code panel, and this browser keeps the width.\n  const main = document.querySelector(\"main\");\n  const splitter = $(\"splitter\");\n  const widthKey = \"dfdreview.codeWidth\";\n  function setCodeWidth(px) {\n    const width = Math.max(240, Math.min(px, main.clientWidth - 320));\n    main.style.setProperty(\"--code-width\", width + \"px\");\n    return width;\n  }\n  function saveCodeWidth(width) {\n    try {\n      localStorage.setItem(widthKey, String(width));\n    } catch (e) {\n      // Without storage, the width lasts until the page reloads.\n    }\n  }\n  try {\n    const saved = Number(localStorage.getItem(widthKey));\n    if (saved \u003e 0) {\n      setCodeWidth(saved);\n    }\n  } catch (e) {\n    // Without storage, the panel keeps its default width.\n  }\n  splitter.addEventListener(\"pointerdown\", (e) =\u003e {\n    e.preventDefault();\n    splitter.setPointerCapture(e.pointerId);\n    splitter.classList.add(\"dragging\");\n    document.body.classList.add(\"resizing\");\n  });\n  splitter.addEventListener(\"pointermove\", (e) =\u003e {\n    if (splitter.hasPointerCapture(e.pointerId)) {\n      setCodeWidth(main.getBoundingClientRect().right - e.clientX);\n    }\n  });\n  splitter.addEventListener(\"pointerup\", (e) =\u003e {\n    splitter.releasePointerCapture(e.pointerId);\n    splitter.classList.remove(\"dragging\");\n    document.body.classList.remove(\"resizing\");\n    saveCodeWidth($(\"code\").offsetWidth);\n  });\n  splitter.addEventListener(\"keydo th/filepath\"\n\t\"sort\"\n\t\"strconv\"\n\t\"strings\"\n)\n\n// Text is a file's content in one version.\ntype Text struct {\n\tContent string\n\tFound   bool // the file exists in this version\n}\n\n// Pair is a file in both versions: at the base and in the working tree.\ntype Pair struct {\n\tBefore, After Text\n}\n\n// Change is a file changed since the base, with its unified diff.\ntype Change struct {\n\tPath    string // relative to the code directory\n\tStatus  string // \"added\", \"modified\" or \"deleted\"\n\tDiff    string\n\tContent Pair // a binary file's versions hold no text\n}\n\n// Repo reads the files of a code directory in both versions.\ntype Repo struct {\n\ttop  string // the repository's top level\n\tdir  string // the code directory, relative to top, with slashes\n\tbase string // the base revision, \"\" for none\n}\n\n// Open opens the repository holding dir, to compare against base.\n// An empty base means the page shows the working tree alone.\nfunc Open(dir, base string) (*Repo, error) {\n\tabs, err := resolve(dir)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tout, err := git(abs, \"rev-parse\", \"--show-toplevel\")\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"%s: not in a git repository: %w\", dir, err)\n\t}\n\ttop := strings.TrimSpace(out)\n\trel, err := filepath.Rel(top, abs)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif base != \"\" {\n\t\tif _, err := git(top, \"rev-parse\", \"--verify\", \"--quiet\", base+\"^{commit}\"); err != nil {\n\t\t\treturn nil, fmt.Errorf(\"base %q: not a commit in %s\", base, top)\n\t\t}\n\t}\n\treturn \u0026Repo{top: top, dir: filepath.ToSlash(rel), base: base}, nil\n}\n\n// Base returns the base revision, \"\" when the page shows the working tree alone.\nfunc (r *Repo) Base() string { return r.base }\n\n// Read returns the file at path in both versions.\n// Without a base, Before is not found.\nfunc (r *Repo) Read(p string) (Pair, error) {\n\tvar pair Pair\n\tafter, err := os.ReadFile(p)\n\tsw

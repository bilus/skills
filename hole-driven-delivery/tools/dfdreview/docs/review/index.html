s finds it, and a function whose reach in the working tree holds such a function or method.","changed file":"a file of the code directory that differs between the versions, a new or a deleted file included.","changed mark":"the red asterisk after the link of a changed declaration, and after the label of a diagram tab whose drawings hold such a link.","code directory":"the directory above the design's directory, whose Go files dfdreview indexes.","code index":"the declarations of both versions with the changed ones, the files the page shows with the identifier links of each Go file, the standard library's import paths, the package errors, and the changed files with their diffs.","code panel":"the part of the page that shows a source file in its views.","declaration":"a top-level Go function, type, variable or constant of a file other than a test file, with its file and lines, in one version. Methods are not declarations, since a box names a method by its type.","design":"the diagrams and the vocabulary, in both versions.","diff":"the unified diff of a changed file, as git prints it.","element":"a process title, an entity or external system name, a store name or an arrow label of a dfd source, with its text on each of its lines.","external system":"something outside the program that a process sends data to or receives data from, drawn as \u003cName\u003e beside the process, such as \u003cGo command\u003e.","footnote definitions":"the target of each footnote id that the links use, passed to dfd in one file.","identifier link":"an identifier in a Go file that uses an object declared in Go code, not a predeclared one such as int, with the place where the page opens the object: a line of a Go file of the code directory in the same version, the package clause of a package's first file, or the object's documentation on pkg.go.dev.","item":"one comma-separated part of a flow arrow's label, such as \"sum types\".","key":"the package name joined to the name of a declaration, as in analyze.sumTypes, or of a method, as in render.renderer.text. Two packages with one name share their keys.","link":"a span of a drawing that points at a target. dfdreview makes one by wrapping a reference, a typed item or a term in dfd's footnote syntax, {text:id}, with a footnote definition, {id} target.","load":"the work of code.Load: running the go command and type-checking the module in both versions, the base from the base export.","module":"the Go module of the nearest go.mod at or above the code directory, inside the repository, in each version. A version without one has no module.","module directory":"the directory that holds the module's go.mod.","notes":"the plan's title and its sections \"The change in brief\" and \"Metaphor\", the score cards and the report.","package error":"an error that the load reports for a version: an error of the go command, a parse or type error of a package, or the failure of the version's whole load.","patch":"the unified diff of one diagram, with the whole file as context, written from its alignment with the linked lines, that dfd draws as the Diff view.","reach":"the functions and methods of a function's own package that it calls, and those that they call in turn, without leaving the package or entering its tests. A method call resolves by the receiver's type, and a call of an interface method reaches the method of every type of the package that implements the interface.","reference":"a qualified name in the last top-level parentheses of a box, such as analyze.sumTypes.","report":"the output of dfdmetrics without -score.","resolution":"what the load finds in one version of the module: the functions and methods of its own package that each function and method calls, and the text and the identifier links of every Go file.","review page":"the HTML page a reviewer opens at the plan gate and at each stage boundary.","score card":"the output of dfdmetrics -score. The page shows the old card, cached from the last approved review, beside the new card of this review.","sheet":"a diagram ready to draw: both versions and the patch, linked.","target":"where a link points: a declaration, a type, a term, or a page outside the repository.","term":"a word or phrase that the vocabulary defines.","top diagram":"the diagram the command names, such as docs/flow.dfd. A child diagram expands one process of the diagram above it, as flow.3.dfd expands process 3 and flow.3.2.dfd expands process 3.2.","type comment":"a line \"# type: item = type\" of a dfd source; an item with one is a typed item.","version":"one side of the comparison: the base, shown as Before, or the working tree, shown as After.","view":"one drawing of a diagram, or one text of a source file: Before, Diff or After. An unchanged diagram has a single view. A file has a view for each version that holds it, and a Diff view after a change.","vocabulary":"the file of terms, one \"- term: definition\" per line."}},"changed":[{"path":"build.go","status":"modified"},{"path":"build_test.go","status":"modified"},{"path":"code/code.go","status":"modified"},{"path":"code/load_test.go","status":"added"},{"path":"code/resolve.go","status":"added"},{"path":"docs/flow.4.dfd","status":"modified"},{"path":"docs/flow.dfd","status":"modified"},{"path":"docs/plans/2026-09-27-dfdreview-types.ledger.md","status":"added"},{"path":"docs/plans/2026-09-27-dfdreview-types.md","status":"added"},{"path":"docs/vocabulary.md","status":"modified"},{"path":"page/page.go","status":"modified"},{"path":"page/page.html","status":"modified"}],"brief":"code.Read now loads the module with its types in both versions. Each version's resolution holds the calls that every function and method makes in its own package, and the text and the identifier links of every Go file, and the load also reports the package errors. The code index compares the declarations and the methods of both versions, parsed without types, and marks each changed declaration, now with every function whose reach in the working tree holds a changed function or method. The page holds every Go file of both versions with its identifier links, so each identifier in the code panel opens its definition, and the page lists the package errors.","metaphor":"The review page is an editor's proof packet. Each changed drawing and file comes as old, marked-up and new copies, and every citation in them opens its source.","oldScore":null,"newScore":{"columns":["live_range","read_distance","top_shared","shared","pressure","package_spread","findings"],"values":["0","0","0","0","0","0","1"]},"report":"design flow.dfd: 2 diagrams, 8 boxes\n\nprivate items\n  Page file: review page  writers 5  readers -\n\npressure\n  flow.dfd    max 0 in 4 gaps, first between 1 and 2\n  flow.4.dfd  max 0 in 2 gaps, first between 4.1 and 4.2\n\nfindings\n  dead item  Page file: review page\n\ndesign packages\n  flow.dfd, depth 0    code, design, dfdreview, draw, repo\n  flow.4.dfd, depth 1  draw\n\ntotals\n  shared items by level                               none\n  private items                                       1\n  unlabeled arrow                                     0\n  dead item                                           1\n  orphan item                                         0\n  read before write                                   0\n  arrow candidate                                     0\n  unmatched summary                                   0\n  missing summary                                     0\n  summary above home                                  0\n  mixed box                                           0\n  mixed diagram                                       0\n  diagrams with two or more design packages by depth  0: 1\n"}</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  const state = { diagram: 0, view: {}, file: null, key: null, fileView: "after" };

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      if (item.hint) {
        b.title = item.hint;
      }
      if (item.mark) {
        const star = document.createElement("span");
        star.className = "mark";
        star.textContent = "*";
        star.title = item.mark;
        b.appendChild(star);
      }
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  let marked = null; // for each diagram, whether its drawings link a changed declaration

  function selectDiagram(i) {
    state.diagram = i;
    marked = marked || data.diagrams.map(hasChange);
    // A tab shows the diagram's number. Its title, the description of the expanded
    // process, shows on hover and above the drawing.
    tabs($("tabs"), data.diagrams.map((d, k) => ({
      id: k, label: d.number || "Overview", hint: d.number ? d.title : "",
      mark: marked[k] ? "links a declaration changed since " + data.base : "",
    })), i, selectDiagram);
    const d = data.diagrams[i];
    $("diagram-title").textContent = d.title;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    let view = state.view[i];
    if (!present.includes(view)) {
      view = present.includes("diff") ? "diff" : present[present.length - 1];
    }
    showView(view);
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, showView);
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        } else if (decl.changed) {
          markChanged(a);
        }
      } else if (href.startsWith("#type/")) {
        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];
        if (decl && decl.changed) {
          markChanged(a);
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => selectDiagram(child));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            selectDiagram(child);
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        showDecl(href.slice(6), version);
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        showType(decodeURIComponent(href.slice(6)), version);
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  // hasChange reports whether a diagram's drawings link a declaration that differs from the base.
  function hasChange(d) {
    return ["before", "diff", "after"].some((view) =>
      [...(d[view] || "").matchAll(/href="#(code|type)\/([^"]*)"/g)].some((m) => {
        const key = m[1] === "code" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));
        return Boolean((data.decls[key] || {}).changed);
      }),
    );
  }

  // markChanged puts a red asterisk after a link whose declaration differs from the base.
  function markChanged(a) {
    const star = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
    star.classList.add("changed");
    star.textContent = "*";
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = "changed since " + data.base;
    a.append(star, t);
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel.
  function status(html) {
    $("code-status").innerHTML = html;
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.
  function typeOf(d, item, version) {
    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || "";
  }

  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.
  function typeKey(type) {
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    return m ? m[1] + "." + m[2] : "";
  }

  function showType(item, version) {
    const type = typeOf(data.diagrams[state.diagram], item, version);
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const key = typeKey(type);
    if (!key || !showDecl(key, version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.fileView = view;
    renderFile();
  }

  // changedLines returns the status of each changed line of a file's After version, by line
  // number, from the file's unified diff: "modified" for a line that replaces removed lines,
  // and "added" for any other added line.
  function changedLines(diff) {
    const status = {};
    let line = 0; // the After version's number of the next line, 0 before the first hunk
    let removed = 0;
    let added = [];
    const flush = () => {
      added.forEach((n) => {
        status[n] = removed > 0 ? "modified" : "added";
      });
      removed = 0;
      added = [];
    };
    (diff || "").split("\n").forEach((ln) => {
      const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
      if (hunk) {
        flush();
        line = Number(hunk[1]);
      } else if (line === 0 || ln.startsWith("\\")) {
        // The file's header, or a note such as "\ No newline at end of file".
      } else if (ln.startsWith("+")) {
        added.push(line++);
      } else if (ln.startsWith("-")) {
        removed++;
      } else {
        flush();
        line++;
      }
    });
    flush();
    return status;
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
    });
    const where = state.key && state.fileView !== "diff" ? placeOf(state.key, state.fileView) : null;
    let label = esc(state.file) + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + (where ? " in " + esc(state.file) + ":" + where.start : " in " + esc(state.file)) + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      const changed = state.fileView === "after" ? changedLines(f.diff) : {};
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = (where && n >= where.start && n <= where.end ? " sel" : "") + (changed[n] ? " " + changed[n] : "");
        const src = go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    const target = where && document.getElementById("L" + where.start);
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => openFile(c.path, "diff", null));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.diagrams.length) {
    selectDiagram(0);
  }

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>

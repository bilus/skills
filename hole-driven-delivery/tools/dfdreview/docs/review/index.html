ke-width=\"2\"/\u003e\n  \u003crect x=\"430\" y=\"280\" width=\"300\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/\u003e\n  \u003ctext x=\"580\" y=\"370\" fill=\"#000\" text-anchor=\"middle\"\u003e5. Write the page\u003c/text\u003e\n  \u003cline x1=\"820\" y1=\"355\" x2=\"733\" y2=\"355\" stroke=\"#000\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/\u003e\n  \u003ctext x=\"775\" y=\"347\" fill=\"#000\" text-anchor=\"middle\"\u003e\u003ca href=\"#type/views\"\u003e\u003ctspan text-decoration=\"underline\"\u003eviews\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n\u003c/svg\u003e\n","types":{"before":{"alignments":"map[string][]dfdtext.Op","code index":"*code.Index","design":"*design.Design","dfd command":"draw.Command","footnote definitions":"map[string]string","sheets":"[]draw.sheet","views":"[]draw.View"},"after":{"alignments":"map[string][]dfdtext.Op","code index":"*code.Index","design":"*design.Design","dfd command":"draw.Command","footnote definitions":"map[string]string","sheets":"[]draw.sheet","views":"[]draw.View"}}}],"files":{"build.go":{"before":"// Package dfdreview builds the review page of a leveled dfd design.\npackage dfdreview\n\nimport (\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/code\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/design\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/dfdtext\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/draw\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/notes\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/page\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\"\n)\n\n// Options are the inputs of one build of the review page.\ntype Options struct {\n\tDesign     string // the top diagram, such as docs/flow.dfd\n\tBase       string // the revision to compare against, \"\" for none\n\tVocabulary string // the vocabulary, \"\" for none\n\tPlan       string // the plan, \"\" for none\n\tOldScore   string // the cached score card, \"\" for none\n\tNewScore   string // this review's score card, \"\" for none\n\tReport     string // this review's dfdmetrics report, \"\" for none\n\tDFD        string // the dfd command\n\tPerRow     int    // boxes per row in the drawings, 3 when 0\n\tOut        string // the page to write\n}\n\n// Build writes the review page that opts describes.\n// The code is the directory above the design's directory.\nfunc Build(opts Options) error {\n\tr, err := repo.Open(filepath.Dir(filepath.Dir(opts.Design)), opts.Base)\n\tif err != nil {\n\t\treturn err\n\t}\n\td, err := design.Read(r, opts.Design, opts.Vocabulary)\n\tif err != nil {\n\t\treturn err\n\t}\n\tc, err := code.Read(r, d)\n\tif err != nil {\n\t\treturn err\n\t}\n\tviews, err := draw.Views(d, c, draw.Command{Name: opts.DFD, PerRow: opts.PerRow})\n\tif err != nil {\n\t\treturn err\n\t}\n\treturn writePage(opts, views, d, c)\n}\n\n// writePage writes the review page to opts.Out, with the notes that opts names.\n// The page leaves itself out of the files it shows.\nfunc writePage(opts Options, views []draw.View, d *design.Design, c *code.Index) error {\n\tn, err := notes.Read(opts.Plan, opts.OldScore, opts.NewScore, opts.Report)\n\tif err != nil {\n\t\treturn err\n\t}\n\tself, err := filepath.Rel(absolute(filepath.Dir(filepath.Dir(opts.Design))), absolute(opts.Out))\n\tif err != nil {\n\t\treturn err\n\t}\n\tself = filepath.ToSlash(self)\n\tdata := page.Data{\n\t\tTitle: n.Title, Base: d.Base, Brief: n.Brief, Metaphor: n.Metaphor, Report: n.Report,\n\t\tOldScore: card(n.OldScore), NewScore: card(n.NewScore), Errors: c.Errors,\n\t\tFiles: map[string]page.File{}, Decls: map[string]page.Decl{},\n\t\tTerms: page.Versions{Before: design.Terms(d.Vocabulary.Before.Content), After: design.Terms(d.Vocabulary.After.Content)},\n\t}\n\tif data.Title == \"\" {\n\t\tdata.Title = filepath.Base(opts.De text := range res.Before.Files {\n\t\t\t\tp := idx.Files[file]\n\t\t\t\tp.Before = repo.Text{Content: text, Found: true}\n\t\t\t\tidx.Files[file] = p\n\t\t\t}\n\t\t\tidx.BeforeLinks = res.Before.Links\n\t\t}\n\t\tif res.After != nil {\n\t\t\tfor file, text := range res.After.Files {\n\t\t\t\tp := idx.Files[file]\n\t\t\t\tp.After = repo.Text{Content: text, Found: true}\n\t\t\t\tidx.Files[file] = p\n\t\t\t}\n\t\t\tidx.AfterLinks = res.After.Links\n\t\t}\n\t\tidx.Errors = res.Errors\n\t\t// A version without a resolution keeps the texts from git.\n\t\tfor file, p := range idx.Files {\n\t\t\tif content, ok := before[file]; ok \u0026\u0026 !p.Before.Found {\n\t\t\t\tp.Before = repo.Text{Content: content, Found: true}\n\t\t\t}\n\t\t\tif content, ok := after[file]; ok \u0026\u0026 !p.After.Found {\n\t\t\t\tp.After = repo.Text{Content: content, Found: true}\n\t\t\t}\n\t\t\tidx.Files[file] = p\n\t\t}\n\t}\n\treturn idx, nil\n}\n\n// changedDeclsAndMethods returns the keys of the changed declarations and methods of idx,\n// methods keyed like render.renderer.text.\nfunc changedDeclsAndMethods(before, after map[string]string, idx *Index) (map[string]bool, error) {\n\tbeforeMethods, err := methodPlaces(before)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"at the base: %w\", err)\n\t}\n\tafterMethods, err := methodPlaces(after)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn changedDecls(before, after, union(idx.Before, beforeMethods), union(idx.After, afterMethods)), nil\n}\n\n// reached returns the keys of the functions and methods whose reach over calls holds a key\n// of changed.\nfunc reached(calls map[string][]string, changed map[string]bool) map[string]bool {\n\tcallers := map[string][]string{}\n\tfor caller, callees := range calls {\n\t\tfor _, callee := range callees {\n\t\t\tcallers[callee] = append(callers[callee], caller)\n\t\t}\n\t}\n\tvar queue []string\n\tfor key := range changed {\n\t\tqueue = append(queue, key)\n\t}\n\tout := map[string]bool{}\n\tfor l  || strings.Count(all, \"p/p.go\") != 2 {\n\t\tt.Errorf(\"package errors:\\n%s\", all)\n\t}\n\tif _, ok := res.After.Calls[\"p.G\"]; !ok {\n\t\tt.Errorf(\"the package with an error lost its functions: %v\", res.After.Calls)\n\t}\n}\n\nfunc TestLoadLinksIdentifiers(t *testing.T) {\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\n\t\t\"go.mod\":        goMod,\n\t\t\"docs/flow.dfd\": \"[1. Run]\\n\",\n\t\t\"p/a.go\": \"package p\\n\\nimport \\\"strings\\\"\\n\\n// A trims s.\\n\" +\n\t\t\t\"func A(s string) string { return strings.TrimSpace(s) + b }\\n\\n\" +\n\t\t\t\"var c = \\\"\\u00e9\\\" + b\\n\\n\" +\n\t\t\t\"func w(sb *strings.Builder) { sb.WriteString(\\\"x\\\") }\\n\",\n\t\t\"p/b.go\": \"package p\\n\\nvar b = \\\"x\\\"\\n\",\n\t\t\"q/q.go\": \"package q\\n\\nimport \\\"example.com/m/p\\\"\\n\\nvar d = p.A\\n\",\n\t})\n\tbase := g.Commit(\"base\")\n\t// The working tree moves b down two lines.\n\tg.Write(map[string]string{\"p/b.go\": \"package p\\n\\n// b ends each result.\\n\\nvar b = \\\"x\\\"\\n\"})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlinks := func(b int) []code.Link {\n\t\treturn []code.Link{\n\t\t\t{Line: 6, Col: 34, Len: 7, URL: \"https://pkg.go.dev/strings\"},\n\t\t\t{Line: 6, Col: 42, Len: 9, URL: \"https://pkg.go.dev/strings#TrimSpace\"},\n\t\t\t{Line: 6, Col: 52, Len: 1, File: \"p/a.go\", To: 6},\n\t\t\t{Line: 6, Col: 57, Len: 1, File: \"p/b.go\", To: b},\n\t\t\t{Line: 8, Col: 15, Len: 1, File: \"p/b.go\", To: b}, // after a two-byte letter, one UTF-16 unit\n\t\t\t{Line: 10, Col: 12, Len: 7, URL: \"https://pkg.go.dev/strings\"},\n\t\t\t{Line: 10, Col: 20, Len: 7, URL: \"https://pkg.go.dev/strings#Builder\"},\n\t\t\t{Line: 10, Col: 31, Len: 2, File: \"p/a.go\", To: 10},\n\t\t\t{Line: 10, Col: 34, Len: 11, URL: \"https://pkg.go.dev/strings#Builder.WriteString\"},\n\t\t}\n\t}\n\tif got, want := res.Before.Links[\"p/a.go\"], links(3); !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"before:\\n got %+v\\nwant %+v\", got, want)\n\t}\n\tif got, want := res.After.Links[\"p/a.go\"], links(5); !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"after:\\n got %+v\\nwant %+v\", got, want)\n\t}\n\t// A package of the code directory opens at the package clause of its first file.\n\tq := []code.Link{{Line: 5, Col: 9, Len: 1, File: \"p/a.go\", To: 1}, {Line: 5, Col: 11, Len: 1, File: \"p/a.go\", To: 6}}\n\tfor _, v := range []*code.Resolution{res.Before, res.After} {\n\t\tif got := v.Links[\"q/q.go\"]; !reflect.DeepEqual(got, q) {\n\t\t\tt.Errorf(\"q/q.go:\\n got %+v\\nwant %+v\", got, q)\n\t\t}\n\t}\n}\n\nfunc TestReadMarksByReach(t *testing.T) {\n\tr, dir := module(t)\n\tc := index(t, r, dir)\n\tfor key, want := range map[string]bool{\n\t\t\"p.F\": true,  // reaches T.M, which changed\n\t\t\"p.G\": false, // reaches U.M only, though T.M shares its name\n\t\t\"p.H\": true,  // reaches T.M through I\n\t\t\"q.K\": false, // p.F lies in another package\n\t\t\"p.T\": false, // a type keeps its own rule\n\t} {\n\t\tif got := c.ChangedDecls[key]; got != want {\n\t\t\tt.Errorf(\"%s changed: %v, want %v\", key, got, want)\n\t\t}\n\t}\n}\n\nfunc TestReadMarksByReachWithoutBaseModule(t *testing.T) {\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\"docs/flow.dfd\": \"[1. Run\\n (p.F)]\\n\", \"p/p.go\": pGo(1)})\n\tbase := g.Commit(\"base\")\n\tg.Write(map[string]string{\"go.mod\": goMod, \"p/p.go\": pGo(2)})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tc := index(t, r, g.Dir)\n\tfor key, want := range map[string]bool{\"p.F\": true, \"p.G\": false, \"p.H\": true} {\n\t\tif got := c.ChangedDecls[key]; got != want {\n\t\t\tt.Errorf(\"%s changed: %v, want %v\", key, got, want)\n\t\t}\n\t}\n}\n\nfunc TestReadHoldsEveryGoFile(t *testing.T) {\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\n\t\t\"go.mod\":        goMod,\n\t\t\"docs/flow.dfd\": \"[1. Run\\n (p.F)]\\n\",\n\t\t\"p/p.go\":        \"package p\\n\\n// F returns one.\\nfunc F() int { return 1 }\\n\",\n\t\t\"p/p_test.go\":   \"package p\\n\\nimport \\\"testing\\\"\\n\\nfunc TestF(t *testing.T) {}\\n\",\n\t\t\"q/q.go\":        \"package q\\n\",\n\t\t\"q/r.go\":        \"package q\\n\\n// R is not named by any box.\\nfunc R() {}\\n\",\n\t})\n\tbase := g.Commit(\"base\")\n\tg.Write(map[string]string{\"q/q.go\": \"package q\\n\\n// K is new.\\nfunc K() {}\\n\"})\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tc := index(t, r, g.Dir)\n\tfor _, path := range []string{\"p/p.go\", \"p/p_test.go\", \"q/q.go\", \"q/r.go\"} {\n\t\tif f, ok := c.Files[path]; !ok || !f.Before.Found || !f.After.Found {\n\t\t\tt.Errorf(\"%s: %+v\", path, f)\n\t\t}\n\t}\n}\n\nfunc TestLoadLeavesGoModAlone(t *testing.T) {\n\t// Under -mod=mod, the go command adds a go directive to a go.mod without one.\n\tconst mod = \"module example.com/m\\n\"\n\tg := gittest.New(t)\n\tg.Write(map[string]string{\"go.mod\": mod, \"docs/flow.dfd\": \"[1. Run]\\n\", \"p/p.go\": \"package p\\n\\n// F does nothing.\\nfunc F() {}\\n\"})\n\tbase := g.Commit(\"base\")\n\tr, err := repo.Open(g.Dir, base)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tt.Setenv(\"GOFLAGS\", \"-mod=mod\")\n\tres, err := code.Load(r)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif got, err := os.ReadFile(filepath.Join(g.Dir, \"go.mod\")); err != nil || string(got) != mod {\n\t\tt.Errorf(\"the load changed go.mod to %q (%v)\", got, err)\n\t}\n\tif res.Before == nil || res.After == nil || len(res.Errors) \u003e 0 {\n\t\tt.Errorf(\"resolutions: before %v, after %v, errors %v\", res.Before != nil, res.After != nil, res.Errors)\n\t}\n}\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/code/load_test.go b/hole-driven-delivery/tools/dfdreview/code/load_test.go\nindex 9dd207c..0caad98 100644\n--- a/hole-driven-delivery/tools/dfdreview/code/load_test.go\n+++ b/hole-driven-delivery/tools/dfdreview/code/load_test.go\n@@ -213,7 +213,6 @@ func TestLoadLinksIdentifiers(t *testing.T) {\n }\n \n func TestReadMarksByReach(t *testing.T) {\n-\tt.Skip(\"HOLE(3): mark each function whose reach holds a changed function or method\")\n \tr, dir := module(t)\n \tc := index(t, r, dir)\n \tfor key, want := range map[string]bool{\n@@ -230,7 +229,6 @@ func TestReadMarksByReach(t *testing.T) {\n }\n \n func TestReadMarksByReachWithoutBaseModule(t *testing.T) {\n-\tt.Skip(\"HOLE(3): the reach marks functions when only the working tree has a module\")\n \tg := gittest.New(t)\n \tg.Write(map[string]string{\"docs/flow.dfd\": \"[1. Run\\n (p.F)]\\n\", \"p/p.go\": pGo(1)})\n \tbase := g.Commit(\"base\")\n@@ -248,7 +246,6 @@ func TestReadMarksByReachWithoutBaseModule(t *testing.T) {\n }\n \n func TestReadHoldsEveryGoFile(t *testing.T) {\n-\tt.Skip(\"HOLE(3): hold every Go file of both versions, test files included\")\n \tg := gittest.New(t)\n \tg.Write(map[string]string{\n \t\t\"go.mod\":        goMod,\n"},"code/resolve.go":{"before":"package code\n\nimport (\n\t\"go/ast\"\n\t\"go/parser\"\n\t\"go/token\"\n\t\"go/types\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"sort\"\n\t\"strings\"\n\t\"sync\"\n\n\t\"golang.org/x/tools/go/packages\"\n\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\"\n)\n\n// Resolved holds the resolution of each version and the package errors of both.\ntype Resolved struct {\n\tBefore, After *Resolution // nil for a version without a module\n\tErrors        []string    // each naming its version and its package\n}\n\n// Resolution is what the load finds in one version of the module.\ntype Resolution struct {\n\tCalls map[string][]string // by the key of each function and method, such as \"render.renderer.text\", the keys of the functions and methods of its package that it calls\n\tFiles map[string]string   // the text of every Go file as the load parsed it, test files included, by path relative to the code directory\n\tLinks map[string][]Link   // the identifier links of each Go file, by path\n}\n\n// Link is an identifier that uses a declared object, with the object's definition.\ntype Link struct {\n\tLine, Col, Len int    // the identifier's line, and its column and length in UTF-16 code units, from 1\n\tFile           string // the definition's file in the same version, relative to the code directory\n\tTo             int    // the definition's line in File\n\tURL            string // the definition's documentation, for one outside the code directory\n}\n\n// Load type-checks the module in both versions. It records the calls that every function\n// and method makes within its package, the text and the identifier links of every Go file,\n// and the package errors. It reads the base from the base export, a temporary copy of the\n// module directory's blobs at the base that it deletes at the end. It returns an error only\n// when it cannot run: an error that the go command or the type checker reports becomes a\n// package error of its version.\nfunc Load(r *repo.Repo) (*Resolved, error) {\n\tbeforeMod, afterMod, err := r.ModuleDirs()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tres := \u0026Resolved{}\n\tif beforeMod != \"\" {\n\t\tvar errs []string\n\t\tif res.Before, errs, err = loadBase(r, beforeMod); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tres.Errors = append(res.Errors, errs...)\n\t}\n\tif afterMod != \"\" {\n\t\tvar errs []string\n\t\tres.After, errs = load(r.Dir(), \"working tree\")\n\t\tres.Errors = append(res.Errors, errs...)\n\t}\n\treturn res, nil\n}\n\n// loadBase type-checks the base from the base export of the module directory mod, relative\n// to the code directory, and deletes the export.\nfunc loadBase(r *repo.Repo, mod string) (res *Resolution, errs []string, err error) {\n\ttmp, err := os.MkdirTemp(\"\", \"dfdreview-base-*\")\n\tif err != nil {\n\t\treturn nil, nil, err\n\t}\n\tdefer func() {\n\t\tif rerr := os.RemoveAll(tmp); rerr != nil \u0026\u0026 err == nil {\n\t\t\terr = rerr\n\t\t}\n\t}()\n\tif err := r.Export(mod, tmp); err != nil {\n\t\treturn nil, nil, err\n\t}\n\t// The code directory sits at the same place below the module directory in both versions.\n\tbelow, err := filepath.Rel(filepath.Join(r.Dir(), mod), r.Dir())\n\tif err != nil {\n\t\treturn nil, nil, err\n\t}\n\tres, errs = load(filepath.Join(tmp, below), \"base\")\n\treturn res, errs, nil\n}\n\n// load type-checks the packages of dir and below, test files included, and records their\n// calls, and the text and the identifier links of each of their Go files. Each error it\n// returns names the version.\n// A load that fails as a whole gives no resolution.\nfunc load(dir, version string) (*Resolution, []string) {\n\troot, err := filepath.EvalSymlinks(dir)\n\tif err != nil {\n\t\treturn nil, []string{version + \": \" + err.Error()}\n\t}\n\tres := \u0026Resolution{Calls: map[string][]string{}, Files: map[string]string{}}\n\tvar mu sync.Mutex\n\trecord := func(file string, text []byte) {\n\t\tif rel, ok := within(root, file); ok {\n\t\t\tmu.Lock()\n\t\t\tres.Files[rel] = string(text)\n\t\t\tmu.Unlock()\n\t\t}\n\t}\n\tcfg := \u0026packages.Config{\n\t\tMode: packages.NeedName | packages.NeedFiles | packages.NeedSyntax | packages.NeedTypes |\n\t\t\tpackages.NeedTypesInfo | packages.NeedImports,\n\t\tDir:        root,\n\t\tEnv:        append(os.Environ(), \"GOWORK=off\"),\n\t\tBuildFlags: []string{\"-mod=readonly\"},\n\t\tTests:      true,\n\t\tParseFile: func(fset *token.FileSet, file string, src []byte) (*ast.File, error) {\n\t\t\trecord(file, src)\n\t\t\treturn parser.ParseFile(fset, file, src, parser.AllErrors|parser.ParseComments)\n\t\t},\n\t}\n\tpkgs, err := packages.Load(cfg, \"./...\")\n\tif err != nil {\n\t\treturn nil, []string{version + \": \" + err.Error()}\n\t}\n\tvar errs []string\n\tseen := map[string]bool{}\n\tpackages.Visit(pkgs, nil, func(p *packages.Package) {\n\t\tchecked := false\n\t\tfor _, e := range p.Errors {\n\t\t\tchecked = checked || e.Kind == packages.TypeError || e.Kind == packages.Pars licit[m[1]] = describe(text)\n\t\t\t}\n\t\t\tcontinue\n\t\t}\n\t\tif alias := aliasOf(lines, e); alias != \"\" {\n\t\t\taliases[alias] = title\n\t\t} else if label, ok := aliases[title]; ok {\n\t\t\ttitle = label\n\t\t}\n\t\tif !numbers[title] {\n\t\t\tnumbers[title] = true\n\t\t\tautomatic[prefix+strconv.Itoa(len(numbers))] = describe(title)\n\t\t}\n\t}\n\tif len(explicit) \u003e 0 {\n\t\treturn explicit\n\t}\n\treturn automatic\n}\n\n// describe returns a box's text on one line, without the references in its\n// last top-level parentheses.\nfunc describe(text string) string {\n\tdepth, start, from, to := 0, 0, -1, -1\n\tfor i, c := range text {\n\t\tswitch c {\n\t\tcase '(':\n\t\t\tif depth == 0 {\n\t\t\t\tstart = i\n\t\t\t}\n\t\t\tdepth++\n\t\tcase ')':\n\t\t\tif depth == 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tdepth--\n\t\t\tif depth == 0 {\n\t\t\t\tfrom, to = start, i+1\n\t\t\t}\n\t\t}\n\t}\n\tif from \u003e= 0 \u0026\u0026 qualified.MatchString(text[from:to]) {\n\t\ttext = text[:from] + text[to:]\n\t}\n\treturn strings.Join(strings.Fields(text), \" \")\n}\n\n// firstLine returns text up to its first line break.\nfunc firstLine(text string) string {\n\tline, _, _ := strings.Cut(text, \"\\n\")\n\treturn line\n}\n\n// aliasOf returns the alias that a box's opening line declares, or \"\".\nfunc aliasOf(lines []string, e element) string {\n\tfirst := e.spans[0]\n\thead := lines[first.line][:first.start]\n\topen := strings.IndexAny(head, \"[{\")\n\tmarker := strings.LastIndex(head, \":=\")\n\tif open \u003c 0 || marker \u003c open {\n\t\treturn \"\"\n\t}\n\treturn strings.TrimSpace(head[open+1 : marker])\n}\n\n// Op is one line of an alignment: ' ' for a line of both versions, '-' for a\n// line of before alone, and '+' for a line of after alone.\ntype Op byte\n\n// Align matches the lines of before and after along a longest common subsequence.\n// Within a change, removed lines come before added ones, as in git's diffs.\nfunc Align(before, after string) []Op {\n\ta, b := fileLines(before), fileLines(after)\n\t// common[i][j] is the length of the longest common subsequence of a[i:] and b[j:].\n\tcommon := make([][]int, len(a)+1)\n\tfor i := range common {\n\t\tcommon[i] = make([]int, len(b)+1)\n\t}\n\tfor i := len(a) - 1; i \u003e= 0; i-- {\n\t\tfor j := len(b) - 1; j \u003e= 0; j-- {\n\t\t\tif a[i] == b[j] {\n\t\t\t\tcommon[i][j] = common[i+1][j+1] + 1\n\t\t\t} else {\n\t\t\t\tcommon[i][j] = max(common[i+1][j], common[i][j+1])\n\t\t\t}\n\t\t}\n\t}\n\tvar ops []Op\n\ti, j := 0, 0\n\tfor i \u003c len(a) || j \u003c len(b) {\n\t\tswitch {\n\t\tcase i \u003c len(a) \u0026\u0026 j \u003c len(b) \u0026\u0026 a[i] == b[j]:\n\t\t\tops = append(ops, ' ')\n\t\t\ti++\n\t\t\tj++\n\t\tcase j == len(b) || (i \u003c len(a) \u0026\u0026 common[i+1][j] \u003e= common[i][j+1]):\n\t\t\tops = append(ops, '-')\n\t\t\ti++\n\t\tdefault:\n\t\t\tops = append(ops, '+')\n\t\t\tj++\n\t\t}\n\t}\n\treturn ops\n}\n\n// Patch writes the patch of an alignment, with the whole file as context. It takes\n// removed lines from before and the other lines from after, so both texts may be\n// linked versions of the aligned ones, with the same lines.\nfunc Patch(path string, ops []Op, before, after string) string {\n\ta, b := fileLines(before), fileLines(after)\n\tvar out strings.Builder\n\tfmt.Fprintf(\u0026out, \"--- a/%s\\n+++ b/%s\\n@@ -%s +%s @@\\n\", path, path, hunkRange(len(a)), hunkRange(len(b)))\n\ti, j := 0, 0\n\tfor _, op := range ops {\n\t\tswitch {\n\t\tcase op == '-' \u0026\u0026 i \u003c len(a):\n\t\t\tout.WriteString(\"-\" + a[i] + \"\\n\")\n\t\t\ti++\n\t\tcase op == '+' \u0026\u0026 j \u003c len(b):\n\t\t\tout.WriteString(\"+\" + b[j] + \"\\n\")\n\t\t\tj++\n\t\tcase op == ' ' \u0026\u0026 i \u003c len(a) \u0026\u0026 j \u003c len(b):\n\t\t\tout.WriteString(\" \" + b[j] + \"\\n\")\n\t\t\ti++\n\t\t\tj++\n\t\t}\n\t}\n\treturn out.String()\n}\n\n// fileLines splits a file's text into lines, without the empty text after a final newline.\n// A missing final newline makes no difference to an alignment.\nfunc fileLines(text string) []string {\n\tif text == \"\" {\n\t\treturn nil\n\t}\n\treturn strings.Split(strings.TrimSuffix(text, \"\\n\"), \"\\n\")\n}\n\n// hunkRange writes the range of a hunk header for a file of n lines.\nfunc hunkRange(n int) string {\n\tif n == 0 {\n\t\treturn \"0,0\"\n\t}\n\treturn fmt.Sprintf(\"1,%d\", n)\n}\n","diff":""},"docs/plans/2026-09-27-dfdreview-types.ledger.md":{"before":"# Ledger, plan: docs/plans/2026-09-27-dfdreview-types.md\n\n- 2026-09-27 user: follow the recommendation of the investigation into gopls, which found no importable gopls API and chose go/packages and go/types in-process. A probe in the session's scratchpad loaded both versions of gox_bullet with types in 0.2 to 0.3 s each, warm, and resolved every identifier. Work stays on the branch hdd-review-page of the skills repository and starts from 7e87621, the base of this plan's review pages.\n- 2026-09-27 plan written, with 7 requirements and 4 stages. The design gains process 6, code.Load, between processes 2 and 3, and process 3 takes its resolutions.\n- 2026-09-27 design: process 6, code.Load, sits between processes 2 and 3 and draws its I/O as three external systems, Module directory, Git repository and Go command, each with one reply label. A first draft also drew the requests (base revision, package patterns and base files), and dfd's layout overlapped their labels under the box, so the drawing keeps the replies. dfdmetrics still scores 0 in every column but findings, which holds the old dead item \"Page file: review page\": the reviewer reads the page outside the flow.\n- 2026-09-27 vocabulary: added changed declaration, module, resolution, resolutions, reach, identifier link, definition and package error. The entry for code index now names the marks, the identifier links and the package errors.\n- 2026-09-27 skeleton: code.Load (holes 1 code.Load and 2 code.Load#2) returns the identifier links that a correct body r defines.","top diagram":"the diagram the command names, such as docs/flow.dfd. A child diagram expands one process of the diagram above it, as flow.3.dfd expands process 3 and flow.3.2.dfd expands process 3.2.","type comment":"a line \"# type: item = type\" of a dfd source; an item with one is a typed item.","version":"one side of the comparison: the base, shown as Before, or the working tree, shown as After.","view":"one drawing of a diagram, or one text of a source file: Before, Diff or After. An unchanged diagram has a single view. A file has a view for each version that holds it, and a Diff view after a change.","vocabulary":"the file of terms, one \"- term: definition\" per line."},"after":{"alignment":"which lines of a diagram's two versions match, and which the change removed or added, found on the sources before any link.","base":"the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothing has changed.","base export":"a temporary copy of the module directory's blobs at the base, written for the load and deleted after it.","build configuration":"the GOOS, GOARCH and build tags of the go command, which choose the files of each package.","changed declaration":"a declaration or a method that differs between the versions, doc comment included, or exists in one of them only, as a parse without types finds it, and a function whose reach in the working tree holds such a function or method.","changed file":"a file of the code directory that differs between the versions, a new or a deleted file included.","changed mark":"the red asterisk after the link of a changed declaration, and after the label of a diagram tab whose drawings hold such a link.","code directory":"the directory above the design's directory, whose Go files dfdreview indexes.","code index":"the declarations of both versions with the changed ones, the files the page shows with the identifier links of each Go file, the standard library's import paths, the package errors, and the changed files with their diffs.","code panel":"the part of the page that shows a source file in its views.","declaration":"a top-level Go function, type, variable or constant of a file other than a test file, with its file and lines, in one version. Methods are not declarations, since a box names a method by its type.","design":"the diagrams and the vocabulary, in both versions.","diff":"the unified diff of a changed file, as git prints it.","element":"a process title, an entity or external system name, a store name or an arrow label of a dfd source, with its text on each of its lines.","external system":"something outside the program that a process sends data to or receives data from, drawn as \u003cName\u003e beside the process, such as \u003cGo command\u003e.","footnote definitions":"the target of each footnote id that the links use, passed to dfd in one file.","identifier link":"an identifier in a Go file that uses an object declared in Go code, not a predeclared one such as int, with the place where the page opens the object: a line of a Go file of the code directory in the same version, the package clause of a package's first file, or the object's documentation on pkg.go.dev.","item":"one comma-separated part of a flow arrow's label, such as \"sum types\".","key":"the package name joined to the name of a declaration, as in analyze.sumTypes, or of a method, as in render.renderer.text. Two packages with one name share their keys.","link":"a span of a drawing that points at a target. dfdreview makes one by wrapping a reference, a typed item or a term in dfd's footnote syntax, {text:id}, with a footnote definition, {id} target.","load":"the work of code.Load: running the go command and type-checking the module in both versions, the base from the base export.","module":"the Go module of the nearest go.mod at or above the code directory, inside the repository, in each version. A version without one has no  flow.dfd, depth 0    code, design, dfdreview, draw, repo\n  flow.4.dfd, depth 1  draw\n\ntotals\n  shared items by level                               none\n  private items                                       1\n  unlabeled arrow                                     0\n  dead item                                           1\n  orphan item                                         0\n  read before write                                   0\n  arrow candidate                                     0\n  unmatched summary                                   0\n  missing summary                                     0\n  summary above home                                  0\n  mixed box                                           0\n  mixed diagram                                       0\n  diagrams with two or more design packages by depth  0: 1\n"}</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  const state = { diagram: 0, view: {}, file: null, key: null, fileView: "after" };

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      if (item.hint) {
        b.title = item.hint;
      }
      if (item.mark) {
        const star = document.createElement("span");
        star.className = "mark";
        star.textContent = "*";
        star.title = item.mark;
        b.appendChild(star);
      }
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  let marked = null; // for each diagram, whether its drawings link a changed declaration

  function selectDiagram(i) {
    state.diagram = i;
    marked = marked || data.diagrams.map(hasChange);
    // A tab shows the diagram's number. Its title, the description of the expanded
    // process, shows on hover and above the drawing.
    tabs($("tabs"), data.diagrams.map((d, k) => ({
      id: k, label: d.number || "Overview", hint: d.number ? d.title : "",
      mark: marked[k] ? "links a declaration changed since " + data.base : "",
    })), i, selectDiagram);
    const d = data.diagrams[i];
    $("diagram-title").textContent = d.title;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    let view = state.view[i];
    if (!present.includes(view)) {
      view = present.includes("diff") ? "diff" : present[present.length - 1];
    }
    showView(view);
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, showView);
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        } else if (decl.changed) {
          markChanged(a);
        }
      } else if (href.startsWith("#type/")) {
        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];
        if (decl && decl.changed) {
          markChanged(a);
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => selectDiagram(child));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            selectDiagram(child);
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        showDecl(href.slice(6), version);
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        showType(decodeURIComponent(href.slice(6)), version);
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  // hasChange reports whether a diagram's drawings link a declaration that differs from the base.
  function hasChange(d) {
    return ["before", "diff", "after"].some((view) =>
      [...(d[view] || "").matchAll(/href="#(code|type)\/([^"]*)"/g)].some((m) => {
        const key = m[1] === "code" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));
        return Boolean((data.decls[key] || {}).changed);
      }),
    );
  }

  // markChanged puts a red asterisk after a link whose declaration differs from the base.
  function markChanged(a) {
    const star = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
    star.classList.add("changed");
    star.textContent = "*";
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = "changed since " + data.base;
    a.append(star, t);
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel.
  function status(html) {
    $("code-status").innerHTML = html;
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.
  function typeOf(d, item, version) {
    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || "";
  }

  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.
  function typeKey(type) {
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    return m ? m[1] + "." + m[2] : "";
  }

  function showType(item, version) {
    const type = typeOf(data.diagrams[state.diagram], item, version);
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const key = typeKey(type);
    if (!key || !showDecl(key, version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.fileView = view;
    renderFile();
  }

  // changedLines returns the status of each changed line of a file's After version, by line
  // number, from the file's unified diff: "modified" for a line that replaces removed lines,
  // and "added" for any other added line.
  function changedLines(diff) {
    const status = {};
    let line = 0; // the After version's number of the next line, 0 before the first hunk
    let removed = 0;
    let added = [];
    const flush = () => {
      added.forEach((n) => {
        status[n] = removed > 0 ? "modified" : "added";
      });
      removed = 0;
      added = [];
    };
    (diff || "").split("\n").forEach((ln) => {
      const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
      if (hunk) {
        flush();
        line = Number(hunk[1]);
      } else if (line === 0 || ln.startsWith("\\")) {
        // The file's header, or a note such as "\ No newline at end of file".
      } else if (ln.startsWith("+")) {
        added.push(line++);
      } else if (ln.startsWith("-")) {
        removed++;
      } else {
        flush();
        line++;
      }
    });
    flush();
    return status;
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
    });
    const where = state.key && state.fileView !== "diff" ? placeOf(state.key, state.fileView) : null;
    let label = esc(state.file) + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + (where ? " in " + esc(state.file) + ":" + where.start : " in " + esc(state.file)) + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      const changed = state.fileView === "after" ? changedLines(f.diff) : {};
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = (where && n >= where.start && n <= where.end ? " sel" : "") + (changed[n] ? " " + changed[n] : "");
        const src = go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    const target = where && document.getElementById("L" + where.start);
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => openFile(c.path, "diff", null));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.diagrams.length) {
    selectDiagram(0);
  }

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>

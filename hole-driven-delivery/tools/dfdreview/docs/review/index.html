* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }
#left { overflow: auto; padding: 12px 16px 32px; }
#splitter { cursor: col-resize; background: var(--rule); border-left: 3px solid var(--paper); border-right: 3px solid var(--panel); }
#splitter:hover, #splitter.dragging, #splitter:focus-visible { background: var(--sel-rule); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
#code { position: relative; overflow: auto; background: var(--panel); }
@media (max-width: 1000px) {
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  #splitter { display: none; }
  #code { border-top: 1px solid var(--rule); max-height: 80vh; }
}
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tabs button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--sel-rule); font-weight: 600; }
.tabs.small button { font-size: 12px; padding: 2px 8px; }
.tabs button .mark { color: var(--del); font-weight: 700; margin-left: 2px; }
#drawing svg { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; }
#drawing a[href] { cursor: pointer; }
#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }
#drawing .child { cursor: pointer; fill: #4a37b0; text-decoration: underline; }
#drawing .missing tspan { fill: #b3261e; }
/* A larger asterisk stays visible in a scaled-down drawing; the shift keeps it on its line. */
#drawing a[href] tspan.changed, #drawing a[href]:hover tspan.changed, #drawing a[href]:focus tspan.changed {
  fill: #b3261e; font-weight: 700; font-size: 1.7em; baseline-shift: -0.35em; }
h2 { font-size: 14px; margin: 22px 0 6px; }
#diagram-title { font-size: 15px; margin: 2px 0 8px; }
.prose p { margin: 0 0 8px; max-width: 70em; }
table { border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.rise { color: var(--del); font-weight: 600; }
.fall { color: var(--add); }
.added { color: var(--add); }
.removed { color: var(--del); }
.changed { color: var(--amber); }
ul.files { list-style: none; padding: 0; margin: 0; }
ul.files li { padding: 2px 0; }
ul.files button { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.status { display: inline-block; width: 5.5em; font-size: 12px; }
pre.report { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.muted { color: var(--muted); }
#code-head { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; }
#code-status { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 6px; }
#code-body { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
#code-body .empty { padding: 20px; color: var(--muted); font: 14px/1.5 system-ui, sans-serif; }
.line { display: flex; white-space: pre; }
.line .n { flex: 0 0 3.6em; text-align: right; padding-right: 1em; color: var(--muted); user-select: none; }
.line .s { padding-right: 16px; }
.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }
.line.add { background: var(--add-bg); }
.line.del { background: var(--del-bg); }
.line.hunk { color: var(--muted); }
.hljs-keyword, .hljs-literal { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-cmt); }
.hljs-type, .hljs-built_in { color: var(--code-type); }
.hljs-number { color: var(--code-num); }
.hljs-title { font-weight: 600; }

href=\"#term/link\"\u003e\u003ctspan text-decoration=\"underline\"\u003elinks\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"164\" fill=\"#000\" text-anchor=\"middle\"\u003e(\u003ca href=\"#code/draw.link\"\u003e\u003ctspan text-decoration=\"underline\"\u003edraw.link\u003c/tspan\u003e\u003c/a\u003e)\u003c/text\u003e\n  \u003cline x1=\"730\" y1=\"115\" x2=\"817\" y2=\"115\" stroke=\"#000\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/\u003e\n  \u003ctext x=\"775\" y=\"73\" fill=\"#000\" text-anchor=\"middle\"\u003e\u003ca href=\"#type/design\"\u003e\u003ctspan text-decoration=\"underline\"\u003edesign\u003c/tspan\u003e\u003c/a\u003e,\u003c/text\u003e\n  \u003ctext x=\"775\" y=\"90\" fill=\"#000\" text-anchor=\"middle\"\u003e\u003ca href=\"#type/code%20index\"\u003e\u003ctspan text-decoration=\"underline\"\u003ecode index\u003c/tspan\u003e\u003c/a\u003e,\u003c/text\u003e\n  \u003ctext x=\"775\" y=\"107\" fill=\"#000\" text-anchor=\"middle\"\u003e\u003ca href=\"#type/alignments\"\u003e\u003ctspan text-decoration=\"underline\"\u003ealignments\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n  \u003crect x=\"820\" y=\"280\" width=\"300\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/\u003e\n  \u003cline x1=\"820\" y1=\"300\" x2=\"1120\" y2=\"300\" stroke=\"#000\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"832\" y=\"295\" fill=\"#000\" font-size=\"11\"\u003e4.3\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"362\" fill=\"#000\" text-anchor=\"middle\"\u003eRun dfd for each \u003ca href=\"#term/view\"\u003e\u003ctspan text-decoration=\"underline\"\u003eview\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"379\" fill=\"#000\" text-anchor=\"middle\"\u003e(\u003ca href=\"#code/draw.render\"\u003e\u003ctspan text-decoration=\"underline\"\u003edraw.render\u003c/tspan\u003e\u003c/a\u003e)\u003c/text\u003e\n  \u003cline x1=\"970\" y1=\"190\" x2=\"970\" y2=\"277\" stroke=\"#000\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/\u003e\n  \u003ctext x=\"978\" y=\"240\" fill=\"#000\"\u003e\u003ca href=\"#type/sheets\"\u003e\u003ctspan text-decoration=\"underline\"\u003esheets\u003c/tspan\u003e\u003c/a\u003e, \u003ca href=\"#type/footnote%20definitions\"\u003e\u003ctspan text-decoration=\"underline\"\u003efootnote definitions\u003c/tspan\u003e\u003c/a\u003e, \u003ca href=\"#type/dfd%20command\"\u003e\u003ctspan text-decoration=\"underline\"\u003edfd command\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n  \u003crect x=\"436\" y=\"286\" width=\"300\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/\u003e\n  \u003crect x=\"430\" y=\"280\" width=\"300\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/\u003e\n  \u003ctext x=\"580\" y=\"370\" fill=\"#000\" text-anchor=\"middle\"\u003e5. Write the page\u003c/text\u003e\n  \u003cline x1=\"820\" y1=\"355\" x2=\"733\" y2=\"355\" stroke=\"#000\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"/\u003e\n  \u003ctext x=\"775\" y=\"347\" fill=\"#000\" text-anchor=\"middle\"\u003e\u003ca href=\"#type/views\"\u003e\u003ctspan text-decoration=\"underline\"\u003eviews\u003c/tspan\u003e\u003c/a\u003e\u003c/text\u003e\n\u003c/svg\u003e\n","types":{"before":{"code":"*code.Index","design":"*design.Design","footnotes":"map[string]string","linked design":"draw.linked","patches":"map[string]string","views":"[]draw.View"},"after":{"alignments":"map[string][]dfdtext.Op","code index":"*code.Index","design":"*design.Design","dfd command":"draw.Command","footnote definitions":"map[string]string","sheets":"[]draw.sheet","views":"[]draw.View"}}}],"files":{"README.md":{"before":null,"after":"# dfdreview\n\ndfdreview builds the review page of a leveled data flow design written in the [dfd](https://github.com/bilus/dfd) format. The page shows each diagram and each changed file before a stage, as a diff and after it. Links lead from the diagrams into the code, and the page holds the score cards and the report of dfdmetrics and the plan's brief and metaphor.\n\n## Running it\n\nInstall it from this directory:\n\n```sh\ngo install ./cmd/dfdreview\n```\n\nThe binary lands in `$(go env GOPATH)/bin`, which must be on the PATH for the bare name to work. At a review, run it on the top diagram of the design:\n\n```sh\ndfdreview -base \u003ccommit\u003e -plan docs/plans/\u003cplan\u003e.md \\\n  -old-score docs/review/score.tsv -new-score docs/review/score.new.tsv \\\n  -report docs/review/report.txt docs/flow.dfd\n```\n\n| Flag | Gives |\n|---|---|\n| `-base REV` | The revision to compare against, such as the stage's start commit. Without it, the page shows the working tree alone. |\n| `-plan FILE` | The plan. The page shows its first heading and its sections \"The change in brief\" and \"Metaphor\". |\n| `-old-score FILE` | The cached score card of the last approved review. A file that does not exist yet counts as none. |\n| `-new-score FILE` | This review's score card, from `dfdmetrics -score`. |\n| `-report FILE` | This review's report, from `dfdmetrics`. |\n| `-vocabulary FILE` | The vocabulary, by default `vocabulary.md` beside the design. |\n| `-dfd PATH` | The dfd command, by default `dfd`. |\n| `-per-row N` | The boxes per row of each drawing, 3 by default. |\n| `-o FILE` | The page, by default `review/index.html` beside the design. |\n\nThe command exits with status 0 after writing the page, 2 after a usage error, and 1 after any other error. An error names its input: the file, the revision, or the diagram and view that dfd rejected, as in `docs/flow.3.dfd (diff):7: ...`.\n\ndfdreview runs git, dfd and `go list std`. The dfd must have `--patch` and `--footnotes`: check that `dfd --help` lists both.\n\n## What the page relies on\n\n- The design has a top diagram such as `docs/flow.dfd`, with child diagrams named like `flow.3.dfd` beside it. The code directory is the directory above the design's directory, and dfdreview indexes its Go files.\n- A process's number is the explicit number at the start of its label, as in `[3. Validate the sum types`. In a design without explicit numbers, it is dfd's own number, as dfdmetrics reads it. A child diagram's tab shows its process's number. Its title is the text of the process's box without the references, and the page shows the title in the tab's tooltip and as the heading above the drawing. A click on the box's number opens the tab.\n- A box lists its references in its last top-level pair of parentheses, as in `(analyze.sumTypes, go/format.Source)`. A reference links to the Go declaration of that name, from either version. A reference to the standard library or to another module links to pkg.go.dev.\n- A type comment, `# type: item = type`, links the item in the flow labels to its type, and the type's first qualified name opens its declaration.\n- The vocabulary's lines, `- term: definition`, give each term in a box, an entity or a store name its definition on hover.\n- A score card is two tab-separated lines, as `dfdmetrics -score` prints them: the column names and the values.\n\n## How it works\n\ndfdreview reads each diagram at the base and in the working tree and aligns the two versions line by line. It then wraps the references, the typed items and the terms of both versions in dfd footnote references, and writes each changed diagram's patch from its alignment with the linked lines. So a link that exists in one version alone does not show as a change. dfd draws every view with one shared file of footnote definitions. The page holds the drawings, the files, the declarations, the types, the terms and the notes as JSON, and its script adds the tabs and the code panel. dfdreview also compares each declaration's lines, doc comment included, in the two versions. The script puts a red asterisk after the link of each declaration that differs or exists in one version only, and after each flow item with such a type. It also puts one after the label of each tab whose drawings hold such a link. Methods are not in the index, so a change to a type's methods leaves the type unmarked. Dragging the divider beside the code panel, or pressing the arrow keys on it, resizes the panel, and the browser keeps the width.\n\n`docs/flow.dfd` and `docs/flow.4.dfd` hold dfdreview's own design, `docs/vocabulary.md` its terms, and `docs/plans` the plan and the ledger of its construction. `docs/review/index.html` is the review page of that design.\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/README.md b/hole-driven-delivery/tools/dfdreview/README.md\nnew file mode 100644\nindex 0000000..4d10a6c\n--- /dev/null\n+++ b/hole-driven-delivery/tools/dfdreview/README.md\n@@ -0,0 +1,50 @@\n+# dfdreview\n+\n+dfdreview builds the review page of a leveled data flow design written in the [dfd](https://github.com/bilus/dfd) format. The page shows each diagram and each changed file before a stage, as a diff and after it. Links lead from the diagrams into the code, and the page holds the score cards and the report of dfdmetrics and the plan's brief and metaphor.\n+\n+## Running it\n+\n+Install it from this directory:\n+\n+```sh\n+go install ./cmd/dfdreview\n+```\n+\n+The binary lands in `$(go env GOPATH)/bin`, which must be on the PATH for the bare name to work. At a review, run it on the top diagram of the design:\n+\n+```sh\n+dfdreview -base \u003ccommit\u003e -plan docs/plans/\u003cplan\u003e.md \\\n+  -old-score docs/review/score.tsv -new-score docs/review/score.new.tsv \\\n+  -report docs/review/report.txt docs/flow.dfd\n+```\n+\n+| Flag | Gives |\n+|---|---|\n+| `-base REV` | The revision to compare against, such as the stage's start commit. Without it, the page shows the working tree alone. |\n+| `-plan FILE` | The plan. The page shows its first heading and its sections \"The change in brief\" and \"Metaphor\". |\n+| `-old-score FILE` | The cached score card of the last approved review. A file that does not exist yet counts as none. |\n+| `-new-score FILE` | This review's score card, from `dfdmetrics -score`. |\n+| `-report FILE` | This review's report, from `dfdmetrics`. |\n+| `-vocabulary FILE` | The vocabulary, by default `vocabulary.md` beside the design. |\n+| `-dfd PATH` | The dfd command, by default `dfd`. |\n+| `-per-row N` | The boxes per row of each drawing, 3 by default. |\n+| `-o FILE` | The page, by default `review/index.html` beside the design. |\n+\n+The command exits with status 0 after writing the page, 2 after a usage error, and 1 after any other error. An error names its input: the file, the revision, or the diagram and view that dfd rejected, as in `docs/flow.3.dfd (diff):7: ...`.\n+\n+dfdreview runs git, dfd and `go list std`. The dfd must have `--patch` and `--footnotes`: check that `dfd --help` lists both.\n+\n+## What the page relies on\n+\n+- The design has a top diagram such as `docs/flow.dfd`, with child diagrams named like `flow.3.dfd` beside it. The code directory is the directory above the design's directory, and dfdreview indexes its Go files.\n+- A process's number is the explicit number at the start of its label, as in `[3. Validate the sum types`. In a design without explicit numbers, it is dfd's own number, as dfdmetrics reads it. A child diagram's tab shows its process's number. Its title is the text of the process's box without the references, and the page shows the title in the tab's tooltip and as the heading above the drawing. A click on the box's number opens the tab.\n+- A box lists its references in its last top-level pair of parentheses, as in `(analyze.sumTypes, go/format.Source)`. A reference links to the Go declaration of that name, from either version. A reference to the standard library or to another module links to pkg.go.dev.\n+- A type comment, `# type: item = type`, links the item in the flow labels to its type, and the type's first qualified name opens its declaration.\n+- The vocabulary's lines, `- term: definition`, give each term in a box, an entity or a store name its definition on hover.\n+- A score card is two tab-separated lines, as `dfdmetrics -score` prints them: the column names and the values.\n+\n+## How it works\n+\n+dfdreview reads each diagram at the base and in the working tree and aligns the two versions line by line. It then wraps the references, the typed items and the terms of both versions in dfd footnote references, and writes each changed diagram's patch from its alignment with the linked lines. So a link that exists in one version alone does not show as a change. dfd draws every view with one shared file of footnote definitions. The page holds the drawings, the files, the declarations, the types, the terms and the notes as JSON, and its script adds the tabs and the code panel. dfdreview also compares each declaration's lines, doc comment included, in the two versions. The script puts a red asterisk after the link of each declaration that differs or exists in one version only, and after each flow item with such a type. It also puts one after the label of each tab whose drawings hold such a link. Methods are not in the index, so a change to a type's methods leaves the type unmarked. Dragging the divider beside the code panel, or pressing the arrow keys on it, resizes the panel, and the browser keeps the width.\n+\n+`docs/flow.dfd` and `docs/flow.4.dfd` hold dfdreview's own design, `docs/vocabulary.md` its terms, and `docs/plans` the plan and the ledger of its construction. `docs/review/index.html` is the review page of that design.\n"},"build.go":{"before":"// Package dfdreview builds the review page of a leveled dfd design.\npackage dfdreview\n\nimport (\n\t\"path/filepath\"\n\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/code\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/design\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/draw\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/notes\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\ bel              // the label of a flow arrow\n\tstoreLabel             // the label of a store arrow\n)\n\n// span is the text of an element on one source line: lines[line][start:end].\ntype span struct {\n\tline, start, end int\n}\n\n// element is a title, a name or a label, over one span per source line.\ntype element struct {\n\tkind  kind\n\tspans []span\n}\n\n// elements reads the titles, names and labels of a dfd source, in order.\n// A title's or a name's first span starts after its alias marker, if any.\nfunc elements(lines []string) []element {\n\tvar out []element\n\tvar pending []element // arrows waiting for the line that says what they point at\n\topen := -1            // the index in out of a box still open, or -1\n\tvar closer byte       // the closing delimiter of the open box\n\tcont := false         // the last line was an arrow or its continuation\n\tfor i, raw := range lines {\n\t\tstart, end := trim(raw)\n\t\ttext := raw[start:end]\n\t\tif open \u003e= 0 {\n\t\t\tsp := span{line: i, start: start, end: end}\n\t\t\tbox := \u0026out[open]\n\t\t\tif closes(text, closer) {\n\t\t\t\tsp.end--\n\t\t\t\topen = -1\n\t\t\t}\n\t\t\tbox.spans = append(box.spans, sp)\n\t\t\tcontinue\n\t\t}\n\t\tswitch {\n\t\tcase text == \"\" || text[0] == '#':\n\t\t\tcont = false\n\t\tcase definition.MatchString(text):\n\t\t\tcont = false\n\t\tcase text[0] == '[' || text[0] == '{':\n\t\t\tcont = false\n\t\t\tfor _, a := range pending {\n\t\t\t\ta.kind = flowLabel\n\t\t\t\tout = append(out, a)\n\t\t\t}\n\t\t\tpending = nil\n\t\t\tk, c := process, byte(']')\n\t\t\tif text[0] == '{' {\n\t\t\t\tk, c = entity, '}'\n\t\t\t}\n\t\t\tsp := afterAlias(raw, span{line: i, start: start + 1, end: end})\n\t\t\tif closes(text[1:], c) {\n\t\t\t\tsp.end--\n\t\t\t} else {\n\t\t\t\topen, closer = len(out), c\n\t\t\t}\n\t\t\tout = append(out, element{kind: k, spans: []span{sp}})\n\t\tcase text[0] == '|':\n\t\t\tcont = false\n\t\t\tfor _, a := range pending {\n\t\t\t\ta.kind = storeLabel\n\t\t\t spans))\n\tfor k, sp := range e.spans {\n\t\tif k \u003e 0 {\n\t\t\tb.WriteByte('\\n')\n\t\t}\n\t\toffsets[k] = b.Len()\n\t\tb.WriteString(lines[sp.line][sp.start:sp.end])\n\t}\n\treturn b.String(), offsets\n}\n\n// at returns the span of the joined text's range [start, end), which lies on one line.\nfunc at(e element, offsets []int, start, end int) span {\n\tk := sort.Search(len(offsets), func(k int) bool { return offsets[k] \u003e start }) - 1\n\tsp := e.spans[k]\n\treturn span{line: sp.line, start: sp.start + start - offsets[k], end: sp.start + end - offsets[k]}\n}\n\n// lastGroup returns the spans inside the last top-level pair of parentheses of a box,\n// and a test of whether a span lies inside them.\nfunc lastGroup(lines []string, e element) ([]span, func(span) bool) {\n\ttext, offsets := joined(lines, e)\n\tdepth, start, from, to := 0, 0, -1, -1\n\tfor i, c := range text {\n\t\tswitch c {\n\t\tcase '(':\n\t\t\tif depth == 0 {\n\t\t\t\tstart = i + 1\n\t\t\t}\n\t\t\tdepth++\n\t\tcase ')':\n\t\t\tif depth == 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tdepth--\n\t\t\tif depth == 0 {\n\t\t\t\tfrom, to = start, i\n\t\t\t}\n\t\t}\n\t}\n\tif from \u003c 0 {\n\t\treturn nil, func(span) bool { return false }\n\t}\n\tvar group []span\n\tfor k, sp := range e.spans {\n\t\tlo, hi := max(from, offsets[k]), min(to, offsets[k]+sp.end-sp.start)\n\t\tif lo \u003c hi {\n\t\t\tgroup = append(group, span{line: sp.line, start: sp.start + lo - offsets[k], end: sp.start + hi - offsets[k]})\n\t\t}\n\t}\n\tinside := func(s span) bool {\n\t\tfor _, g := range group {\n\t\t\tif s.line == g.line \u0026\u0026 s.start \u003c g.end \u0026\u0026 g.start \u003c s.end {\n\t\t\t\treturn true\n\t\t\t}\n\t\t}\n\t\treturn false\n\t}\n\treturn group, inside\n}\n\n// found is a reference and where it sits.\ntype found struct {\n\tref Reference\n\tat  span\n}\n\n// qualified matches a qualified name, as dfdmetrics reads it.\nvar qualified = regexp.MustCompile(`((?:[A-Za-z0-9_.~-]+/)*)([a-z][a-z0-9_]*)\\.([A-Za-z_][A-Za-z0-9_]*)`)\n\n// references returns the qualified names in the spans of a box's last parentheses.\nfunc references(lines []string, group []span) []found {\n\tvar out []found\n\tfor _, sp := range group {\n\t\ttext := lines[sp.line][sp.start:sp.end]\n\t\tfor _, m := range qualified.FindAllStringSubmatchIndex(text, -1) {\n\t\t\t// A match inside a longer name, such as b.C in a.b.C, is not a reference.\n\t\t\tif m[0] \u003e 0 \u0026\u0026 strings.ContainsRune(\"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_.\", rune(text[m[0]-1])) {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tout = append(out, found{\n\t\t\t\tref: Reference{Qualifier: text[m[2]:m[5]], Name: text[m[6]:m[7]]},\n\t\t\t\tat:  span{line: sp.line, start: sp.start + m[0], end: sp.start + m[1]},\n\t\t\t})\n\t\t}\n\t}\n\treturn out\n}\n\n// item is a flow label item, with its parts on each line.\ntype item struct {\n\tname  string // the item's words, joined by single spaces\n\tparts []span\n}\n\n// items splits a flow label at its commas.\nfunc items(lines []string, e element) []item {\n\ttext, offsets := joined(lines, e)\n\tvar out []item\n\tstart := 0\n\tfor i := 0; i \u003c= len(text); i++ {\n\t\tif i \u003c len(text) \u0026\u0026 text[i] != ',' {\n\t\t\tcontinue\n\t\t}\n\t\tit := item{name: strings.Join(strings.Fields(text[start:i]), \" \")}\n\t\t// Each line of the item is one part, without its surrounding whitespace.\n\t\tfor lo := start; lo \u003c i; {\n\t\t\thi := strings.IndexByte(text[lo:i], '\\n')\n\t\t\tif hi \u003c 0 {\n\t\t\t\thi = i\n\t\t\t} else {\n\t\t\t\thi += lo\n\t\t\t}\n\t\t\ts, t := trim(text[lo:hi])\n\t\t\tif s \u003c t {\n\t\t\t\tit.parts = append(it.parts, at(e, offsets, lo+s, lo+t))\n\t\t\t}\n\t\t\tlo = hi + 1\n\t\t}\n\t\tif it.name != \"\" {\n\t\t\tout = append(out, it)\n\t\t}\n\t\tstart = i + 1\n\t}\n\treturn out\n}\n\n// termMatcher finds the terms of a vocabulary, and their plurals, in text.\ntype termMatcher struct {\n\tre     *regexp.Regexp // nil for an empty vocabulary\n\tbyForm map[string]string\n}\n\n// newTermMatcher builds a matcher for the terms, the longest first.\nfunc newTermMatcher(terms map[string]string) termMatcher {\n\tm := termMatcher{byForm: map[string]string{}}\n\tvar forms []string\n\tfor term := range terms {\n\t\tfor _, form := range []string{term, plural(term)} {\n\t\t\tm.byForm[strings.ToLower(form)] = term\n\t\t\tforms = append(forms, strings.ReplaceAll(regexp.QuoteMeta(form), \" \", `[ \\t]+`))\n\t\t}\n\t}\n\tif len(forms) == 0 {\n\t\treturn m\n\t}\n\tsort.Slice(forms, func(i, j int) bool {\n\t\treturn len(forms[i]) \u003e len(forms[j]) || (len(forms[i]) == len(forms[j]) \u0026\u0026 forms[i] \u003c forms[j])\n\t})\n\tm.re = regexp.MustCompile(`(?i)\\b(?:` + strings.Join(forms, \"|\") + `)\\b`)\n\treturn m\n}\n\n// termAt is a term and where it sits.\ntype termAt struct {\n\tterm string\n\tat   span\n}\n\n// find returns the terms on each line of an element.\nfunc (m termMatcher) find(lines []string, e element) []termAt {\n\tif m.re == nil {\n\t\treturn nil\n\t}\n\tvar out []termAt\n\tfor _, sp := range e.spans {\n\t\ttext := lines[sp.line][sp.start:sp.end]\n\t\tfor _, loc := range m.re.FindAllStringIndex(text, -1) {\n\t\t\tform := strings.ToLower(strings.Join(strings.Fields(text[loc[0]:loc[1]]), \" \"))\n\t\t\tout = append(out, termAt{term: m.byForm[form], at: span{line: sp.line, start: sp.start + loc[0], end: sp.start + loc[1]}})\n\t\t}\n\t}\n\treturn out\n}\n\n// plural returns the regular plural of a term's last word.\nfunc plural(term string) string {\n\tfor _, end := range []string{\"s\", \"x\", \"ch\", \"sh\"} {\n\t\tif strings.HasSuffix(term, end) {\n\t\t\treturn term + \"es\"\n\t\t}\n\t}\n\treturn term + \"s\"\n}\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/dfdtext/link.go b/hole-driven-delivery/tools/dfdreview/dfdtext/link.go\nnew file mode 100644\nindex 0000000..f0aedd6\n--- /dev/null\n+++ b/hole-driven-delivery/tools/dfdreview/dfdtext/link.go\n@@ -0,0 +1,235 @@\n+pac \" || r.Qualifier == \"analyze\":\n\t\treturn \"#code/\" + r.Qualifier + \".\" + r.Name\n\tcase strings.Contains(r.Qualifier, \"/\"):\n\t\treturn \"https://pkg.go.dev/\" + r.Qualifier + \"#\" + r.Name\n\t}\n\treturn \"\"\n}\n\nfunc TestLinkReferences(t *testing.T) {\n\tsrc := \"[3. Validate the sum types\\n to give patterns their variants\\n (analyze.sumTypes,\\n  analyze.checkCollisions, go/format.Source, q.Unlinked)]\\n\"\n\tgot, footnotes := dfdtext.Link(src, dfdtext.Linker{Code: code})\n\twant := \"[3. Validate the sum types\\n to give patterns their variants\\n\" +\n\t\t\" ({analyze.sumTypes:@c/analyze.sumTypes},\\n\" +\n\t\t\"  {analyze.checkCollisions:@c/analyze.checkCollisions}, {go/format.Source:@c/go/format.Source}, q.Unlinked)]\\n\"\n\tif got != want {\n\t\tt.Errorf(\"linked:\\n%s\\nwant:\\n%s\", got, want)\n\t}\n\twantNotes := map[string]string{\n\t\t\"@c/analyze.sumTypes\":        \"#code/analyze.sumTypes\",\n\t\t\"@c/analyze.checkCollisions\": \"#code/analyze.checkCollisions\",\n\t\t\"@c/go/format.Source\":        \"https://pkg.go.dev/go/format#Source\",\n\t}\n\tif !reflect.DeepEqual(footnotes, wantNotes) {\n\t\tt.Errorf(\"footnotes = %v, want %v\", footnotes, wantNotes)\n\t}\n}\n\nfunc TestLinkTerms(t *testing.T) {\n\tterms := map[string]string{\"sum type\": \"a closed set of variants\", \"client\": \"the caller\", \"registration\": \"a row\", \"row\": \"a record\"}\n\tsrc := \"{Client app}\\n\u003e sum types\\n[1. Check the sum types (p.Check)]\\n    \u003e row\\n    |R := Registration|\\n\u003e x\\n[R]\\n# type: sum types = []X\\n\"\n\tgot, footnotes := dfdtext.Link(src, dfdtext.Linker{Code: code, Terms: terms})\n\twant := \"{{Client:@v/client} app}\\n\u003e sum types\\n[1. Check the {sum types:@v/sum type} ({p.Check:@c/p.Check})]\\n\" +\n\t\t\"    \u003e row\\n    |R := {Registration:@v/registration}|\\n\u003e x\\n[R]\\n# type: sum types = []X\\n\"\n\tif got != want {\n\t\tt.Errorf(\"linked:\\n%s\\nwant:\\n%s\", got, want)\n\t}\n\tfor id, target := 03e x\\n-[B]\\n+[C]\\n\"\n\tif got != want {\n\t\tt.Errorf(\"patch:\\n%s\\nwant:\\n%s\", got, want)\n\t}\n}\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/dfdtext/link_test.go b/hole-driven-delivery/tools/dfdreview/dfdtext/link_test.go\nnew file mode 100644\nindex 0000000..3e24ec2\n--- /dev/null\n+++ b/hole-driven-delivery/tools/dfdreview/dfdtext/link_test.go\n@@ -0,0 +1,132 @@\n+package dfdtext_test\n+\n+import (\n+\t\"reflect\"\n+\t\"strings\"\n+\t\"testing\"\n+\n+\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/dfdtext\"\n+)\n+\n+// code links the references of package p and of import paths, and no others.\n+func code(r dfdtext.Reference) string {\n+\tswitch {\n+\tcase r.Qualifier == \"p\" || r.Qualifier == \"analyze\":\n+\t\treturn \"#code/\" + r.Qualifier + \".\" + r.Name\n+\tcase strings.Contains(r.Qualifier, \"/\"):\n+\t\treturn \"https://pkg.go.dev/\" + r.Qualifier + \"#\" + r.Name\n+\t}\n+\treturn \"\"\n+}\n+\n+func TestLinkReferences(t *testing.T) {\n+\tsrc := \"[3. Validate the sum types\\n to give patterns their variants\\n (analyze.sumTypes,\\n  analyze.checkCollisions, go/format.Source, q.Unlinked)]\\n\"\n+\tgot, footnotes := dfdtext.Link(src, dfdtext.Linker{Code: code})\n+\twant := \"[3. Validate the sum types\\n to give patterns their variants\\n\" +\n+\t\t\" ({analyze.sumTypes:@c/analyze.sumTypes},\\n\" +\n+\t\t\"  {analyze.checkCollisions:@c/analyze.checkCollisions}, {go/format.Source:@c/go/format.Source}, q.Unlinked)]\\n\"\n+\tif got != want {\n+\t\tt.Errorf(\"linked:\\n%s\\nwant:\\n%s\", got, want)\n+\t}\n+\twantNotes := map[string]string{\n+\t\t\"@c/analyze.sumTypes\":        \"#code/analyze.sumTypes\",\n+\t\t\"@c/analyze.checkCollisions\": \"#code/analyze.checkCollisions\",\n+\t\t\"@c/go/format.Source\":        \"https://pkg.go.dev/go/format#Source\",\n+\t}\n+\tif !reflect.DeepEqual(footnotes, wantNotes) {\n+\t\tt.Errorf(\"footnotes = %v, want %v\", footnotes, wantNotes)\n+\t}\n+}\n+\n+func TestLinkTerms(t *testing  marked, and with Before, Diff and After views when the file changed. A reference to a package outside the repository links to pkg.go.dev, and the page reports a reference without a declaration in either version.\n4. An item of a flow arrow's label with a `# type:` comment links to its type. Clicking it shows the type and opens the declaration of the first named type.\n5. A vocabulary term in a box, an entity or a store name shows its definition on hover, and the page lists the vocabulary's changes since the base.\n6. Each child diagram has a tab named by its number and its action line, and clicking the number of its box opens the tab.\n7. The page lists the files changed since the base, untracked files included, and each file opens its diff.\n8. The page shows the new score card beside the old one, with the change in each column and a mark on every rise, the dfdmetrics report, and the plan's sections \"The change in brief\" and \"Metaphor\".\n9. Every error names its input: the file, the revision, or the diagram and version that dfd rejected.\n10. `README.md` in the tool's directory describes the flags and the conventions the page relies on.\n\n## Questions and assumptions\n\n- dfdreview runs the dfd command instead of importing dfd, so it works with any dfd that has `--patch` and footnotes, and pins no dfd version.\n- dfdreview adds its links as footnotes on source lines, with a line-level reading of the dfd format, so it needs no dfd parser. A context line that the two versions read differently shows as changed.\n- The code is the directory above the design's directory, and only its Go files are indexed.\n- The page loads highlight.js from cdnjs, like the page builder it replaces.\n- The review page for this plan waits for the builder itself: the first page comes from stage 5.\n\n## The change in brief\n\nA stage boundary reads each diagram of the design at the base and in the working tree, links its references, flow label items and terms as footnotes, and draws it with dfd before, as a diff and after. The Go declarations of both versions give the references their code, and the changed files give the code its diffs. The page puts the drawings, the code, the score cards, the report and the plan's brief in one file.\n\n## Metaphor\n\nA light table: two transparencies of one drawing, the base and the working tree, lie over each other, and the reviewer flips between the old sheet, the overlay and the new sheet. Rules a reader would infer: both sheets show the same drawing at the same scale (dfd draws both with the same flags); the overlay shows only what differs (the Diff view colors changes and leaves the rest plain); pointing at a detail on a sheet shows that sheet's version of the detail (a link in the Before view opens the base version of the code). The rules hold at every level of the design.\n\n## Planned declarations\n\nPackage `dfdreview`, the command's library:\n\n- `type Options struct`: the inputs of one build: Design, Base, Vocabulary, Plan, OldScore, NewScore, Report, DFD, Out.\n- `func Build(opts Options) error`: Build writes the review page that opts describes.\n- `func writePage(out string, views []draw.View, d *design.Design, c *code.Index, n *notes.Notes) error`: assembles the page data and writes the page.\n\nPackage `repo`: `type Repo`, `func Open(dir, base string) (*Repo, error)`, and the methods `Read(path) (Pair, error)`, `Names(dir) ([]string, error)`, `GoFiles() (before, after map[string]string, err error)` and `Changed() ([]Change, error)`, with the types `Text`, `Pair` and `Change`.\n\nPackage `dfdtext`, dfd source text line by line: `Link(src, Linker) (string, map[string]string)`, `References(src) []Reference`, `Types(src) map[string]string`, `Titles(src) map[string]string` and `Unified(path, before, after) string`, with the types `Linker`, `CodeFn` and `Reference`.\n\nPackage `design`: `type Design`, `type Diagram`, `func Read(r *repo.Repo, top, vocabulary string) (*Design, error)`.\n\nPackage `code`: `type Index`, `type Place`, `func Read(r *repo.Repo, d *design.Design) (*Index, error)`, `func Declarations(files map[string]string) (map[string]Place, error)`.\n\nPackage `draw`: `type View`, `func Views(d *design.Design, c *code.Index, dfd string) ([]View, error)`, and the steps of process 4: `link`, `diff` and `render`, with the type `linked`.\n\nPackage `notes`: `type Notes`, `type Card`, `func Read(plan, oldScore, newScore, report string) (*Notes, error)`.\n\nPackage `page`: `func Write(w io.Writer, d Data) error` and the page's data types, with the page embedded.\n\nEvery step of the top diagram lives in its own package, so the tests of each stage reach its code through the package's exported API.\n\n## Stages\n\n### Stage 1: skeleton\n\nGoal: the vocabulary, the design and every planned declaration, with every body a hole.\nRequirement: all.\nDependencies: none.\nHoles: adds the holes of stages 2 to 5.\nAcceptance: `go vet ./... \u0026\u0026 go test ./...` passes and the census lists every hole.\nSize: 250 lines.\n\n### Stage 2: reading\n\nGoal: dfdreview reads the design, the vocabulary, the notes and every file of both versions through git.\nRequirement: 1, 8, 9.\nDependencies: stage 1.\nHoles: 2 repo.Open, 2 repo.Repo.Read, 2 repo.Repo.Names, 2 repo.Repo.GoFiles, 2 repo.Repo.Changed, 2 dfdtext.Types, 2 dfdtext.Titles, 2 design.Read, 2 notes.Read.\nAcceptance: tests on a temporary git repository for a changed, a new, a deleted and an untracked file, and for the plan's sections and the score cards.\nSize: 250 lines.\n\n### Stage 3: linking and diffs\n\nGoal: every reference, typed item and term of a dfd source becomes a footnote reference, and two versions of a source become a full-context patch.\nRequirement: 3, 4, 5.\nDependencies: stage 1.\nHoles: 3 dfdtext.Link, 3 dfdtext.References, 3 dfdtext.Unified.\nAcceptance: tests of Link on titles over several lines, aliases, entities, store names and flow labels over several lines, and of Unified.\nSize: 300 lines.\n\n### Stage 4: code and drawings\n\nGoal: the Go declarations of both versions are indexed, and every diagram is drawn in its views by dfd.\nRequirement: 2, 3, 9.\nDependencies: stages 2 and 3.\nHoles: 4 code.Read, 4 code.Declarations, 4 draw.link, 4 draw.diff, 4 draw.render.\nAcceptance: tests of code.Read and code.Declarations on a temporary repository, and of draw.Views with a stand-in dfd and, when it supports `--patch`, the real one.\nSize: 250 lines.\n\n### Stage 5: the page\n\nGoal: the page shows the tabs, the views, the code panel, the notes and the changed files.\nRequirement: 2 to 8.\nDependencies: stage 4.\nHoles: 5 dfdreview.writePage, 5 page.Write.\nAcceptance: a test of the page data, and the page of this tool's own design, checked in a browser.\nSize: 350 lines, most of it the page's script.\n\n### Stage 6: documentation\n\nGoal: the README describes the flags and the conventions.\nRequirement: 10.\nDependencies: stage 5.\nHoles: none.\nAcceptance: the skill's and the tool's text match the flags that `dfdreview -h` prints.\nSize: 80 lines.\n","after":"# dfdreview, the review page builder\n\ndfdreview builds the review page of hole-driven delivery: the leveled design and the code of a change, each before the stage, as a diff and after it, with the score cards, the dfdmetrics report and the plan's brief and metaphor.\n\n## Requirements\n\n1. `dfdreview [flags] docs/flow.dfd` writes one HTML page, by default `docs/review/index.html`, for the design rooted at the given top diagram. The child diagrams are the files named like `flow.3.dfd` beside it.\n2. With `-base REV`, a diagram changed since REV gets three views: Before, Diff and After. The Diff view is dfd's `--patch` drawing. An unchanged diagram gets one view, a diagram new since REV gets Diff and After, and a deleted diagram gets Before and Diff. Without `-base`, every diagram gets one view.\n3. A reference in the last top-level parentheses of a box links to its Go declaration. Clicking it shows the source file, highlighted and scrolled to the declaration, with the declaration's lines marked, and with Before, Diff and After views when the file changed. A reference to a package outside the repository links to pkg.go.dev, and the page reports a reference without a declaration in either version.\n4. An item of a flow arrow's label with a `# type:` comment links to its type. Clicking it shows the type and opens the declaration of the first named type.\n5. A vocabulary term in a box, an entity or a store name shows its definition on hover, and the page lists the vocabulary's changes since the base.\n6. Each child diagram has a tab named by its number and its action line, and clicking the number of its box opens the tab.\n7. The page lists the files changed since the base, untracked files included, and each file opens its diff.\n8. The page shows the new score card beside the old one, with the change in each column and a mark on every rise, the dfdmetrics report, and the plan's sections \"The change in brief\" and \"Metaphor\".\n9. Every error names its input: the file, the revision, or the diagram and version that dfd rejected.\n10. `README.md` in the tool's directory describes the flags and the conventions the page relies on.\n\n## Questions and assumptions\n\n- dfdreview runs the dfd command instead of importing dfd, so it works with any dfd that has `--patch` and footnotes, and pins no dfd version.\n- dfdreview adds its links as footnotes on source lines, with a line-level reading of the dfd format, so it needs no dfd parser. A context line that the two versions read differently shows as changed.\n- The code directory is the directory above the design's directory, and dfdreview indexes only its Go files.\n- The page loads highlight.js from cdnjs, like the page builder it replaces.\n- The review page for this plan waits for the builder itself: the first page comes from stage 5.\n\n## The change in brief\n\nA stage boundary reads each diagram of the design at the base and in the working tree, links its references, flow label items and terms as footnotes, and draws it with dfd before, as a diff and after. The Go declarations of both versions give the references their code, and the changed files give the code its diffs. The page puts the drawings, the code, the score cards, the report and the plan's brief in one file.\n\n## Metaphor\n\nThe review page is an editor's proof packet. Each changed drawing and file comes as the old copy, a marked-up copy and the new copy. A reference in a box is a citation that opens its source. The packet ends with the editor's notes: the plan's brief, the score cards and the report.\n\n## Planned declarations\n\nPackage `dfdreview`, the command's library:\n\n- `type Options struct`: the inputs of one build: Design, Base, Vocabulary, Plan, OldScore, NewScore, Report, DFD, Out.\n- `func Build(opts Options) error`: Build writes the review page that opts describes.\n- `func writePage(opts Options, views []draw.View, d *design.Design, c *code.Index) error`: reads the notes, assembles the page data and writes the page.\n\nPackage `repo`: `type Repo`, `func Open(dir, base string) (*Repo, error)`, and the methods `Base() string`, `Read(path) (Pair, error)`, `Names(dir) ([]string, error)`, `GoFiles() (before, after map[string]string, err error)` and `Changed() ([]Change, error)`, with the types `Text`, `Pair` and `Change`; a change holds its diff and both versions of the file.\n\nPackage `dfdtext`, dfd source text line by line: `Link(src, Linker) (string, map[string]string)`, `References(src) []Reference`, `Types(src) map[string]string`, `Titles(src) map[string]string`, `Align(before, after) []Op` and `Patch(path, ops, before, after) string`, with the types `Linker`, `CodeFn`, `Reference` and `Op`.\n\nPackage `design`: `type Design` (with the base revision), `type Diagram`, `func Read(r *repo.Repo, top, vocabulary string) (*Design, error)`, and `func Terms(vocabulary string) map[string]string`.\n\nPackage `code`: `type Index`, `type Place`, `func Read(r *repo.Repo, d *design.Design) (*Index, error)`, `func Declarations(files map[string]string) (map[string]Place, error)`, and `func Key(dfdtext.Reference) string`.\n\nPackage `draw`: `type View`, `func Views(d *design.Design, c *code.Index, dfd string) ([]View, error)`, and the steps of process 4: `align`, `link` and `render`, with the type `sheet`.\n\nPackage `notes`: `type Notes`, `type Card`, `func Read(plan, oldScore, newScore, report string) (*Notes, error)`, called by `writePage`.\n\nPackage `page`: `func Write(w io.Writer, d Data) error` and the page's data types, with the page embedded.\n\nEvery step of the top diagram lives in its own package, so the tests of each stage reach its code through the package's exported API. The boxes' functions call repo, dfdtext, notes and page inside their own bodies, so no box names those packages.\n\n## Stages\n\n### Stage 1: skeleton\n\nGoal: the vocabulary, the design and every planned declaration, with every body a hole.\nRequirement: all.\nDependencies: none.\nHoles: adds the holes of stages 2 to 5.\nAcceptance: `go vet ./... \u0026\u0026 go test ./...` passes and the census lists every hole.\nSize: 250 lines.\n\n### Stage 2: reading\n\nGoal: dfdreview reads the design, the vocabulary, the notes and every file of both versions through git.\nRequirement: 1, 8, 9.\nDependencies: stage 1.\nHoles: 2 repo.Open, 2 repo.Repo.Read, 2 repo.Repo.Names, 2 repo.Repo.GoFiles, 2 repo.Repo.Changed, 2 dfdtext.Types, 2 dfdtext.Titles, 2 design.Read, 2 notes.Read.\nAcceptance: tests on a temporary git repository for a modified, a new, a deleted and an untracked file, and for the plan's sections and the score cards.\nSize: 250 lines.\n\n### Stage 3: linking and diffs\n\nGoal: every reference, typed item and term of a dfd source becomes a footnote reference, and two versions of a source become a full-context patch.\nRequirement: 3, 4, 5.\nDependencies: stage 1.\nHoles: 3 dfdtext.Link, 3 dfdtext.References, 3 dfdtext.Unified (filled as Align and Patch).\nAcceptance: tests of Link on titles over several lines, aliases, entities, store names and flow labels over several lines, and of Align and Patch.\nSize: 300 lines.\n\n### Stage 4: code and drawings\n\nGoal: the Go declarations of both versions are indexed, and every diagram is drawn in its views by dfd.\nRequirement: 2, 3, 9.\nDependencies: stages 2 and 3.\nHoles: 4 code.Read, 4 code.Declarations, 4 draw.align, 4 draw.link, 4 draw.render.\nAcceptance: tests of code.Read and code.Declarations on a temporary repository, and of draw.Views with a stand-in dfd and, when it supports `--patch`, the real one.\nSize: 250 lines.\n\n### Stage 5: the page data\n\nGoal: dfdreview writes a page that holds every view, source file, declaration, type, term, change and note, and shows the drawings in tabs.\nRequirement: 1, 2, 7, 8.\nDependencies: stage 4.\nHoles: 5 dfdreview.writePage, 5 page.Write.\nAcceptance: a test of Build on a temporary repository with a stand-in dfd, which reads the page's data back.\nSize: 250 lines.\n\n### Stage 6: the page's script\n\nGoal: the page's links open code, types, terms and tabs, and its code panel shows each file before, as a diff and after.\nRequirement: 3 to 6.\nDependencies: stage 5.\nHoles: none; the script is one file, written in one piece.\nAcceptance: the page of this tool's own design, checked in a browser.\nSize: 350 lines.\n\n### Stage 7: documentation\n\nGoal: the README describes the flags and the conventions.\nRequirement: 10.\nDependencies: stage 6.\nHoles: none.\nAcceptance: the skill's and the tool's text match the flags that `dfdreview -h` prints.\nSize: 80 lines.\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/docs/plans/2026-09-26-dfdreview.md b/hole-driven-delivery/tools/dfdreview/docs/plans/2026-09-26-dfdreview.md\nindex c11d855..b6b489e 100644\n--- a/hole-driven-delivery/tools/dfdreview/docs/plans/2026-09-26-dfdreview.md\n+++ b/hole-driven- n\nTerms of dfdreview, one per line.\n\n- review page: the HTML page a reviewer opens at the plan gate and at each stage boundary.\n- base: the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothing has changed.\n- version: one side of the comparison: the base, shown as Before, or the working tree, shown as After.\n- top diagram: the diagram the command names, such as docs/flow.dfd; a child diagram expands one of its processes, as flow.3.dfd expands process 3.\n- action line: the first line of a box, the step's action in the imperative.\n- view: one drawing of a diagram, or one text of a source file: Before, Diff or After. An unchanged diagram or file has a single view.\n- element: a process title, an entity name, a store name or an arrow label of a dfd source, with its text on each of its lines.\n- reference: a qualified name in the last top-level parentheses of a box, such as analyze.sumTypes.\n- item: one comma-separated part of a flow arrow's label, such as \"sum types\".\n- type comment: a line \"# type: item = type\" of a dfd source; an item with one is a typed item.\n- vocabulary: the file of terms, one \"- term: definition\" per line.\n- term: a word or phrase that the vocabulary defines.\n- target: where a link points: a declaration, a type, a term, or a page outside the repository.\n- link: a span of a drawing that points at a target. dfdreview makes one by wrapping a reference, a typed item or a term in dfd's footnote syntax, {text:id}, with a footnote definition, {id} target.\n- footnote definitions: the target of each footnote id that the links use, passed to dfd in one file.\n- alignment: which lines of a diagram's two versions match, and which the change removed or added, found on the sources before any link.\n- patch: the unified diff of one diagram, with the whole file as context, written from its alignment with the linked lines, that dfd draws as the Diff view.\n- sheet: a diagram ready to draw: both versions and the patch, linked.\n- design: the diagrams and the vocabulary, in both versions.\n- code directory: the directory above the design's directory, whose Go files dfdreview indexes.\n- declaration: a top-level Go function, type, variable or constant, with its file and lines, in one version.\n- code index: the declarations of both versions, and the changed files with their diffs.\n- changed file: a file of the code directory that differs between the versions, a new or a deleted file included.\n- diff: the unified diff of a changed file, as git prints it.\n- score card: the output of dfdmetrics -score. The page shows the old card, cached from the last approved review, beside the new card of this review.\n- report: the output of dfdmetrics without -score.\n- notes: the plan's sections \"The change in brief\" and \"Metaphor\", the score cards and the report.\n- code panel: the part of the page that shows a source file in its views.\n","diff":"diff --git a/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md b/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\nindex 47fb686..9700c02 100644\n--- a/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\n+++ b/hole-driven-delivery/tools/dfdreview/docs/vocabulary.md\n@@ -2,16 +2,31 @@\n \n Terms of dfdreview, one per line.\n \n-- review page: the HTML page a reviewer opens at a stage boundary.\n-- base: the revision the page compares against, the commit at the start of the stage.\n-- version: a file as it is at the base (before) or in the working tree (after).\n-- view: one drawing of a diagram: Before, Diff or After.\n-- element: a box title, a store name or an arrow label of a dfd source, over one or more consecutive lines.\n+- review page: the HTML page a reviewer opens at the plan gate and at each stage boundary.\n+- base: the revision that the page compares against, given with -base; at a stage boundary, the commit at the start of the stage. Without a base, nothi h, and which the change removed or added, found on the sources before any link.\n+- patch: the unified diff of one diagram, with the whole file as context, written from its alignment with the linked lines, that dfd draws as the Diff view.\n+- sheet: a diagram ready to draw: both versions and the patch, linked.\n+- design: the diagrams and the vocabulary, in both versions.\n+- code directory: the directory above the design's directory, whose Go files dfdreview indexes.\n+- declaration: a top-level Go function, type, variable or constant, with its file and lines, in one version.\n+- code index: the declarations of both versions, and the changed files with their diffs.\n+- changed file: a file of the code directory that differs between the versions, a new or a deleted file included.\n+- diff: the unified diff of a changed file, as git prints it.\n+- score card: the output of dfdmetrics -score. The page shows the old card, cached from the last approved review, beside the new card of this review.\n+- report: the output of dfdmetrics without -score.\n+- notes: the plan's sections \"The change in brief\" and \"Metaphor\", the score cards and the report.\n+- code panel: the part of the page that shows a source file in its views.\n"},"draw/draw.go":{"before":"// Package draw draws each diagram of a design before, as a diff and after, with dfd.\npackage draw\n\nimport (\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/code\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/design\"\n)\n\n// View is one diagram drawn in its views, each an SVG document or \"\".\ntype View struct {\n\tNumber, Title       string\n\tBefore, Diff, After string\n}\n\n// Views draws each diagram of d in its views, with links to code, types and terms.\n// dfd is the command that draws.\nfunc Views(d *design.Design, c *code.Index, dfd string) ([]View, error) {\n\tl, footnotes := link(d, c)\n\tpatches := diff(l)\n\treturn render(dfd, l, patches, footnotes)\n}\n\n// linked is the design's diagrams with their sources linked in both versions.\ntype linked []design.Diagram\n\n// link links each version of each diagram, and returns the footnotes the links use.\nfunc link(d *design.Design, c *code.Index) (linked, map[string]string) {\n\tpanic(\"HOLE(4): dfdtext.Link with each version's types and terms; references resolve to code or pkg.go.dev\")\n}\n\n// diff returns the patch of each diagram whose versions differ, by path.\nfunc diff(l linked) map[string]string {\n\tpanic(\"HOLE(4): dfdtext.Unified for a changed, a new or a deleted diagram, none for an unchanged one\")\n}\n\n// render runs dfd for each view of each diagram.\nfunc render(dfd string, l linked, patches, footnotes map[string]string) ([]View, error) {\n\tpanic(\"HOLE(4): one dfd run per view with a shared footnotes file; an error names the diagram and the version\")\n}\n","after":"// Package draw draws each diagram of a design before, as a diff and after, with dfd.\npackage draw\n\nimport (\n\t\"bytes\"\n\t\"errors\"\n\t\"fmt\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"sort\"\n\t\"strconv\"\n\t\"strings\"\n\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/code\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/design\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/dfdtext\"\n\t\"github.com/bilus/skills/hole-driven-delivery/tools/dfdreview/repo\"\n)\n\n// View is one diagram drawn in its views, each an SVG document or \"\".\ntype View struct {\n\tNumber, Title       string\n\tBefore, Diff, After string\n}\n\n// Command is how dfd runs: the command and the boxes per row of each drawing.\ntype Command struct {\n\tName   string // the dfd command\n\tPerRow int    // boxes per row, 3 when 0\n}\n\n// Views draws each diagram of d in its views, with links to code, types and terms.\nfunc Views(d *design.Design, c *code.Index, dfd Command) ([]View, error) {\n\talignments := align(d)\n\tsheets, footnotes := link(d, c, alignments)\n\treturn render(dfd, sheets, footnotes)\n}\n\n// sheet is a diagram ready to draw: both versions and the patch, linked.\ntype sheet struct {\n\tnumber, title, path string\n\tsource              repo.Pair // the linked versions\n\tpatch               string    // \"\" for a diagram without changes\n}\n\n// align matches the lines of the two versions of each changed diagram, by path.\n// Without a base, nothing has changed.\nfunc align(d *design.Design) map[string][]dfdtext.Op {\n\talignments := map[string][]dfdtext.Op{}\n\tif d.Base == \"\" {\n\t\treturn alignments\n\t}\n\tfor _, dg := range d.Diagrams {\n\t\tb, a := dg.Source.Before, dg.Source.After\n\t\tif b.Found \u0026\u0026 a.Found \u0026\u0026 b.Content == a.Content {\n\t\t\tcontinue\n\t\t}\n\t\talignments[dg.Path] = dfdtext.Align(b.Content, a.Content)\n\t}\n\treturn alignments\n}\n\n// link links both versions of each diagram and writes each patch with the linked lines.\n// It returns the sheets and the footnote definitions their links use.\nfunc link(d *design.Design, c *code.Index, alignments map[string][]dfdtext.Op) ([]sheet, map[string]string) {\n\tfootnotes := map[string]string{}\n\ttarget := func(ref dfdtext.Reference) string {\n\t\tkey := code.Key(ref)\n\t\t_, before := c.Before[key]\n\t\t_, after := c.After[key]\n\t\tif !before \u0026\u0026 !after \u0026\u0026 (c.Std[ref.Qualifier] || strings.Contains(ref.Qualifier, \".\")) {\n\t\t\treturn \"https://pkg.go.dev/\" + ref.Qualifier + \"#\" + ref.Name\n\t\t}\n\t\t// A name without a declaration still links, so the page can report it.\n\t\treturn \"#code/\" + key\n\t}\n\tlinked := func(t repo.Text, vocabulary repo.Text) repo.Text {\n\t\tif !t.Found {\n\t\t\treturn t\n\t\t}\n\t\tsrc, used := dfdtext.Link(t.Content, dfdtext.Linker{\n\t\t\tCode:  target,\n\t\t\tTypes: dfdtext.Types(t.Content),\n\t\t\tTerms: design.Terms(vocabulary.Content),\n\t\t})\n\t\tfor id, to := range used {\n\t\t\tfootnotes[id] = to\n\t\t}\n\t\treturn repo.Text{Content: src, Found: true}\n\t}\n\tvar sheets []sheet\n\tfor _, dg := range d.Diagrams {\n\t\ts := sheet{number: dg.Number, title: dg.Title, path: dg.Path}\n\t\ts.source.Before = linked(dg.Source.Before, d.Vocabulary.Before)\n\t\ts.source.After = linked(dg.Source.After, d.Vocabulary.After)\n\t\tif ops, changed := alignments[dg.Path]; changed {\n\t\t\ts.patch = dfdtext.Patch(filepath.Base(dg.Path), ops, s.source.Before.Content, s.source.After.Content)\n\t\t}\n\t\tsheets = append(sheets, s)\n\t}\n\treturn sheets, footnotes\n}\n\n// render runs dfd for each view of each sheet, with the footnote definitions in one file.\nfunc render(dfd Command, sheets []sheet, footnotes map[string]string) ([]View, error) {\n\tdir, err := os.MkdirTemp(\"\", \"dfdreview\")\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer os.RemoveAll(dir) // a leftover temporary directory harms nothing\n\tdefs := filepath.Join(dir, \"footnotes.dfd\")\n\tids := make([]string, 0, len(footnotes))\n\tfor id := range footnotes {\n\t\tids = append(ids, id)\n\t}\n\tsort.Strings(ids)\n\tvar b strings.Builder\n\tfor _, id := range ids {\n\t\tfmt.Fprintf(\u0026b, \"{%s} %s\\n\", id, footnotes[id])\n\t}\n\tif err := os.WriteFile(defs, []byte(b.String()), 0o644); err != nil {\n\t\treturn nil, err\n\t}\n\trun := func(s sheet, view, input string, patch bool) (string, error) {\n\t\tperRow := dfd.PerRow\n\t\tif perRow \u003c= 0 {\n\t\t\tperRow = 3\n\t\t}\n\t\targs := []string{\"--box\", \"300x150\", \"--per-row\", strconv.Itoa(perRow), \"--number\", \"--footnotes\", defs, \"-o\", \"-\"}\n\t\tif s.number != \"\" {\n\t\t\t// dfd's own numbering needs the prefix; explicit numbers ignore it.\n\t\t\targs = append(args, \"--number-prefix\", s.number+\".\")\n\t\t}\n\t\tif patch {\n\t\t\targs = append(args, \"--patch\")\n\t\t}\n\t\tcmd := exec.Command(dfd.Name, args...)\n\t\tcmd.Stdin = strings.NewReader(input)\n\t\tvar out, stderr bytes.Buffer\n\t\tcmd.Stdout, cmd.Stderr = \u0026out, \u0026stderr\n\t\tname := s.path + \" (\" + view + \")  var(--panel); border: 1px solid var(--rule);\n  border-radius: 6px; padding: 8px 10px; overflow-x: auto; }\n.muted { color: var(--muted); }\n#code-head { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; }\n#code-status { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 6px; }\n#code-body { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }\n#code-body .empty { padding: 20px; color: var(--muted); font: 14px/1.5 system-ui, sans-serif; }\n.line { display: flex; white-space: pre; }\n.line .n { flex: 0 0 3.6em; text-align: right; padding-right: 1em; color: var(--muted); user-select: none; }\n.line .s { padding-right: 16px; }\n.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }\n.line.add { background: var(--add-bg); }\n.line.del { background: var(--del-bg); }\n.line.hunk { color: var(--muted); }\n.hljs-keyword, .hljs-literal { color: var(--code-kw); }\n.hljs-string { color: var(--code-str); }\n.hljs-comment { color: var(--code-cmt); }\n.hljs-type, .hljs-built_in { color: var(--code-type); }\n.hljs-number { color: var(--code-num); }\n.hljs-title { font-weight: 600; }\n\u003c/style\u003e\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader\u003e\n  \u003ch1 id=\"title\"\u003e\u003c/h1\u003e\n  \u003cp id=\"subtitle\"\u003e\u003c/p\u003e\n\u003c/header\u003e\n\u003cmain\u003e\n  \u003csection id=\"left\"\u003e\n    \u003cdiv id=\"tabs\" class=\"tabs\" role=\"tablist\" aria-label=\"Diagrams\"\u003e\u003c/div\u003e\n    \u003ch2 id=\"diagram-title\"\u003e\u003c/h2\u003e\n    \u003cdiv id=\"views\" class=\"tabs small\" role=\"tablist\" aria-label=\"Views\"\u003e\u003c/div\u003e\n    \u003cdiv id=\"drawing\"\u003e\u003c/div\u003e\n    \u003cdiv id=\"notes\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n  \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" aria-label=\"Resize the code panel\" tabindex=\"0\" title=\"Drag to resize; double-click to reset\"\u003e\u003c/div\u003e\n  \u003caside id=\"code\" aria-label=\"Code\"\u003e\n    \u003cdiv id=\"code-head\"\u003e\n      \u003cdiv id=\"code-status\"\u003eNo file open.\u003c/div\u003e\n      \u003cdiv id=\"code-views\" class=\"tabs small\" role=\"tablist\" aria-label=\"Versions\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"code-body\"\u003e\u003cdiv class=\"empty\"\u003eClick a function or type name in a box to open its source here, or a file under \"Changed files\" to see its diff.\u003c/div\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n\u003c/main\u003e\n\u003cscript id=\"data\" type=\"application/json\"\u003e{{DATA}}\u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n  const data = JSON.parse(document.getElementById(\"data\").textContent);\n  const $ = (id) =\u003e document.getElementById(id);\n  const esc = (s) =\u003e String(s).replace(/\u0026/g, \"\u0026amp;\").replace(/\u003c/g, \"\u0026lt;\").replace(/\u003e/g, \"\u0026gt;\");\n  const other = (version) =\u003e (version === \"before\" ? \"after\" : \"before\");\n  const viewNames = { before: \"Before\", diff: \"Diff\", after: \"After\" };\n  const state = { diagram: 0, view: {}, file: null, key: null, fileView: \"after\" };\n\n  $(\"title\").textContent = data.title;\n  $(\"subtitle\").textContent = data.base\n    ? \"Before is \" + data.base.slice(0, 12) + \", and After is the working tree.\"\n    : \"The working tree alone, with no base to compare against.\";\n\n  function tabs(container, items, selected, onSelect) {\n    container.innerHTML = \"\";\n    items.forEach((item) =\u003e {\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.setAttribute(\"role\", \"tab\");\n      b.setAttribute(\"aria-selected\", String(item.id === selected));\n      b.textContent = item.label;\n      if (item.hint) {\n        b.title = item.hint;\n      }\n      if (item.mark) {\n        const star = document.createElement(\"span\");\n        star.className = \"mark\";\n        star.textContent = \"*\";\n        star.title = item.mark;\n        b.appendChild(star);\n      }\n      b.addEventListener(\"click\", () =\u003e onSelect(item.id));\n      container.appendChild(b);\n    });\n  }\n\n  // The diagrams, each in its views.\n  let marked = null; // for each diagram, whether its drawings link a changed declaration\n\n  function selectDiagram(i) {\n    state.diagram = i;\n    marked = marked || data.diagrams.map(hasChange);\n    // A tab shows the diagram's number. Its title, the description of the expanded\n    // process, shows on hover and above the drawing.\n    tabs($(\"tabs\"), data.diagrams.map((d, k) =\u003e ({\n      id: k, label: d.number || \"Overview\", hint: d.number ? d.title : \"\",\n      mark: marked[k] ? \"links a declaration changed since \" + data.base : \"\",\n    })), i, selectDiagram);\n    const d = data.diagrams[i];\n    $(\"diagram-title\").textContent = d.title;\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e d[v]);\n    let view = state.view[i];\n    if (!present.includes(view)) {\n      view = present.includes(\"diff\") ? \"diff\" : present[present.length - 1];\n    }\n    showView(view);\n  }\n\n  function showView(view) {\n    const d = data.diagrams[state.diagram];\n    state.view[state.diagram] = view;\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e d[v]);\n    tabs($(\"views\"), present.length \u003e 1 ? present.map((v) =\u003e ({ id: v, label: viewNames[v] })) : [], view, showView);\n    $(\"drawing\").innerHTML = d[view] || \"\";\n    const svg = $(\"drawing\").querySelector(\"svg\");\n    if (svg) {\n      decorate(svg, view);\n    }\n  }\n\n  // The Before view reads the base; the Diff and After views read the working tree.\n  const versionOf = (view) =\u003e (view === \"before\" ? \"before\" : \"after\");\n\n  function decorate(svg, view) {\n    const version = versionOf(view);\n    svg.querySelectorAll(\"a[href]\").forEach((a) =\u003e {\n      const href = a.getAttribute(\"href\");\n      if (href.startsWith(\"#term/\")) {\n        const term = decodeURIComponent(href.slice(6));\n        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];\n        if (def) {\n          const t = document.createElementNS(\"http://www.w3.org/2000/svg\", \"title\");\n          t.textContent = term + \": \" + def;\n          a.appendChild(t);\n        }\n      } else if (href.startsWith(\"#code/\")) {\n        const decl = data.decls[href.slice(6)];\n        if (!decl || (!decl.before \u0026\u0026 !decl.after)) {\n          a.classList.add(\"missing\");\n        } else if (decl.changed) {\n          markChanged(a);\n        }\n      } else if (href.startsWith(\"#type/\")) {\n        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];\n        if (decl \u0026\u0026 decl.changed) {\n          markChanged(a);\n        }\n      } else if (/^https?:/.test(href)) {\n        a.setAttribute(\"target\", \"_blank\");\n        a.setAttribute(\"rel\", \"noopener\");\n      }\n    });\n    const here = data.diagrams[state.diagram].number;\n    svg.querySelectorAll(\"text\").forEach((t) =\u003e {\n      const n = t.textContent.trim();\n      const child = data.diagrams.findIndex((d) =\u003e d.number !== \"\" \u0026\u0026 d.number === n \u0026\u0026 parentOf(d.number) === here);\n      if (child \u003e= 0 \u0026\u0026 !t.closest(\"a\")) {\n        t.classList.add(\"child\");\n        t.setAttribute(\"tabindex\", \"0\");\n        t.setAttribute(\"role\", \"link\");\n        t.addEventListener(\"click\", () =\u003e selectDiagram(child));\n        t.addEventListener(\"keydown\", (e) =\u003e {\n          if (e.key === \"Enter\") {\n            selectDiagram(child);\n          }\n        });\n      }\n    });\n    svg.addEventListener(\"click\", (e) =\u003e {\n      const a = e.target.closest(\"a[href]\");\n      if (!a) {\n        return;\n      }\n      const href = a.getAttribute(\"href\");\n      if (href.startsWith(\"#code/\")) {\n        e.preventDefault();\n        showDecl(href.slice(6), version);\n      } else if (href.startsWith(\"#type/\")) {\n        e.preventDefault();\n        showType(decodeURIComponent(href.slice(6)), version);\n      } else if (href.startsWith(\"#\")) {\n        e.preventDefault();\n      }\n    });\n  }\n\n  // hasChange reports whether a diagram's drawings link a declaration that differs from the base.\n  function hasChange(d) {\n    return [\"before\", \"diff\", \"after\"].some((view) =\u003e\n      [...(d[view] || \"\").matchAll(/href=\"#(code|type)\\/([^\"]*)\"/g)].some((m) =\u003e {\n        const key = m[1] === \"code\" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));\n        return Boolean((data.decls[key] || {}).changed);\n      }),\n    );\n  }\n\n  // markChanged puts a red asterisk after a link whose declaration differs from the base.\n  function markChanged(a) {\n    const star = document.createElementNS(\"http://www.w3.org/2000/svg\", \"tspan\");\n    star.classList.add(\"changed\");\n    star.textContent = \"*\";\n    const t = document.createElementNS(\"http://www.w3.org/2000/svg\", \"title\");\n    t.textContent = \"changed since \" + data.base;\n    a.append(star, t);\n  }\n\n  function parentOf(number) {\n    const i = number.lastIndexOf(\".\");\n    return i \u003c 0 ? \"\" : number.slice(0, i);\n  }\n\n  // The code panel.\n  function status(html) {\n    $(\"code-status\").innerHTML = html;\n  }\n\n  function placeOf(key, version) {\n    return (data.decls[key] || {})[version] || null;\n  }\n\n  function showDecl(key, version) {\n    const place = placeOf(key, version) || placeOf(key, other(version));\n    if (!place) {\n      status(esc(key) + \" has no declaration in either version.\");\n      return false;\n    }\n    openFile(place.file, placeOf(key, version) ? version : other(version), key);\n    return true;\n  }\n\n  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.\n  function typeOf(d, item, version) {\n    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || \"\";\n  }\n\n  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.\n  function typeKey(type) {\n    const m = /\\b([a-z][a-z0-9_]*)\\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);\n    return m ? m[1] + \".\" + m[2] : \"\";\n  }\n\n  function showType(item, version) {\n    const type = typeOf(data.diagrams[state.diagram], item, version);\n    if (!type) {\n      status(esc(item) + \" has no type comment.\");\n      return;\n    }\n    const key = typeKey(type);\n    if (!key || !showDecl(key, version)) {\n      status(esc(item) + \": \" + esc(type));\n      return;\n    }\n    $(\"code-status\").innerHTML = esc(item) + \": \" + esc(type) + \"\u003cbr\u003e\" + $(\"code-status\").innerHTML;\n  }\n\n  function openFile(path, view, key) {\n    state.file = path;\n    state.key = key || null;\n    state.fileView = view;\n    renderFile();\n  }\n\n  function renderFile() {\n    const f = data.files[state.file];\n    if (!f) {\n      status(esc(state.file) + \" is not on the page.\");\n      $(\"code-views\").innerHTML = \"\";\n      $(\"code-body\").innerHTML = \"\";\n      return;\n    }\n    const present = [\"before\", \"diff\", \"after\"].filter((v) =\u003e (v === \"diff\" ? f.diff : f[v] !== null));\n    if (!present.includes(state.fileView)) {\n      state.fileView = present[present.length - 1];\n    }\n    tabs($(\"code-views\"), present.length \u003e 1 ? present.map((v) =\u003e ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) =\u003e {\n      state.fileView = v;\n      renderFile();\n    });\n    const where = state.key \u0026\u0026 state.fileView !== \"diff\" ? placeOf(state.key, state.fileView) : null;\n    let label = esc(state.file) + \" (\" + viewNames[state.fileView] + \")\";\n    if (state.key) {\n      label = esc(state.key) + (where ? \" in \" + esc(state.file) + \":\" + where.start : \" in \" + esc(state.file)) + \" (\" + viewNames[state.fileView] + \")\";\n    }\n    status(label);\n    const out = [];\n    if (state.fileView === \"diff\") {\n      f.diff.replace(/\\n$/, \"\").split(\"\\n\").forEach((ln, i) =\u003e {\n        let cls = \"\";\n        if (ln.startsWith(\"@@\")) {\n          cls = \" hunk\";\n        } else if (ln.startsWith(\"+\") \u0026\u0026 !ln.startsWith(\"+++\")) {\n          cls = \" add\";\n        } else if (ln.startsWith(\"-\") \u0026\u0026 !ln.startsWith(\"---\")) {\n          cls = \" del\";\n        }\n        out.push('\u003cdiv class=\"line' + cls + '\"\u003e\u003cspan class=\"n\"\u003e' + (i + 1) + '\u003c/span\u003e\u003cspan class=\"s\"\u003e' + esc(ln) + \"\u003c/span\u003e\u003c/div\u003e\");\n      });\n    } else {\n      const go = state.file.endsWith(\".go\") \u0026\u0026 window.hljs;\n      f[state.fileView].replace(/\\n$/, \"\").split(\"\\n\").forEach((ln, i) =\u003e {\n        const n = i + 1;\n        const sel = where \u0026\u0026 n \u003e= where.start \u0026\u0026 n \u003c= where.end ? \" sel\" : \"\";\n        const src = go ? hljs.highlight(ln, { language: \"go\", ignoreIllegals: true }).value : esc(ln);\n        out.push('\u003cdiv class=\"line' + sel + '\" id=\"L' + n + '\"\u003e\u003cspan class=\"n\"\u003e' + n + '\u003c/span\u003e\u003cspan class=\"s\"\u003e' + src + \"\u003c/span\u003e\u003c/div\u003e\");\n      });\n    }\n    $(\"code-body\").innerHTML = out.join(\"\");\n    const target = where \u0026\u0026 document.getElementById(\"L\" + where.start);\n    $(\"code\").scrollTop = target ? target.offsetTop - $(\"code-head\").offsetHeight - 12 : 0;\n  }\n\n  // The notes under the drawings.\n  function section(title, content) {\n    const h = document.createElement(\"h2\");\n    h.textContent = title;\n    $(\"notes\").appendChild(h);\n    $(\"notes\").appendChild(content);\n  }\n\n  function prose(text) {\n    const div = document.createElement(\"div\");\n    div.className = \"prose\";\n    text.split(/\\n\\s*\\n/).forEach((para) =\u003e {\n      const p = document.createElement(\"p\");\n      p.textContent = para.replace(/\\n/g, \" \");\n      div.appendChild(p);\n    });\n    return div;\n  }\n\n  function scoreTable() {\n    const old = data.oldScore;\n    const rows = [\"\u003ctr\u003e\u003cth\u003eColumn\u003c/th\u003e\u003cth\u003eCached\u003c/th\u003e\u003cth\u003eNew\u003c/th\u003e\u003cth\u003eChange\u003c/th\u003e\u003c/tr\u003e\"];\n    data.newScore.columns.forEach((col, i) =\u003e {\n      const now = Number(data.newScore.values[i]);\n      const k = old ? old.columns.indexOf(col) : -1;\n      const before = k \u003e= 0 ? Number(old.values[k]) : null;\n      let change = \"\";\n      if (before !== null \u0026\u0026 !Number.isNaN(now) \u0026\u0026 !Number.isNaN(before)) {\n        const d = now - before;\n        change = d \u003e 0 ? '\u003cspan class=\"rise\"\u003e+' + d + \" rise\u003c/span\u003e\" : d \u003c 0 ? '\u003cspan class=\"fall\"\u003e' + d + \"\u003c/span\u003e\" : \"0\";\n      }\n      rows.push(\"\u003ctr\u003e\u003ctd\u003e\" + esc(col) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + (before === null ? \"\" : before) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' +\n        esc(data.newScore.values[i]) + '\u003c/td\u003e\u003ctd class=\"num\"\u003e' + change + \"\u003c/td\u003e\u003c/tr\u003e\");\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.join(\"\");\n    return t;\n  }\n\n  function vocabularyChanges() {\n    const before = data.terms.before || {};\n    const after = data.terms.after || {};\n    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();\n    const rows = [];\n    names.forEach((term) =\u003e {\n      let kind = \"\";\n      if (!(term in before)) {\n        kind = \"added\";\n      } else if (!(term in after)) {\n        kind = \"removed\";\n      } else if (before[term] !== after[term]) {\n        kind = \"changed\";\n      }\n      if (kind) {\n        rows.push('\u003ctr\u003e\u003ctd class=\"' + kind + '\"\u003e' + kind + \"\u003c/td\u003e\u003ctd\u003e\" + esc(term) + \"\u003c/td\u003e\u003ctd\u003e\" + esc(after[term] || before[term]) + \"\u003c/td\u003e\u003c/tr\u003e\");\n      }\n    });\n    const t = document.createElement(\"table\");\n    t.innerHTML = rows.length ? rows.join(\"\") : '\u003ctr\u003e\u003ctd class=\"muted\"\u003eNo changes.\u003c/td\u003e\u003c/tr\u003e';\n    return t;\n  }\n\n  function changedFiles() {\n    const ul = document.createElement(\"ul\");\n    ul.className = \"files\";\n    (data.changed || []).forEach((c) =\u003e {\n      const li = document.createElement(\"li\");\n      const s = document.createElement(\"span\");\n      s.className = \"status \" + ({ added: \"added\", deleted: \"removed\" }[c.status] || \"changed\");\n      s.textContent = c.status;\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = c.path;\n      b.addEventListener(\"click\", () =\u003e openFile(c.path, \"diff\", null));\n      li.appendChild(s);\n      li.appendChild(b);\n      ul.appendChild(li);\n    });\n    if (!ul.children.length) {\n      ul.innerHTML = '\u003cli class=\"muted\"\u003eNo changes.\u003c/li\u003e';\n    }\n    return ul;\n  }\n\n  if (data.brief) {\n    section(\"The change in brief\", prose(data.brief));\n  }\n  if (data.metaphor) {\n    section(\"Metaphor\", prose(data.metaphor));\n  }\n  if (data.newScore) {\n    section(\"Score\", scoreTable());\n  }\n  if (data.base) {\n    section(\"Vocabulary changes\", vocabularyChanges());\n    section(\"Changed files\", change

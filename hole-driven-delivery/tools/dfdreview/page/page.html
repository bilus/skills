<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --paper: #f5f6f8; --ink: #1b1f26; --muted: #5d6470; --panel: #ffffff; --rule: #d9dce3;
  --accent: #4a37b0; --sel: #ece8fb; --sel-rule: #b9acf0;
  --add: #1e7e34; --add-bg: #e6f4ea; --del: #b3261e; --del-bg: #fdecea; --amber: #b36b00;
  --code-kw: #8a3d9c; --code-str: #1d6b3a; --code-cmt: #6f7682; --code-type: #1c5fa8; --code-num: #a35a12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;
    --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0;
    --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b;
    --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;
  --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0;
  --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b;
  --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }
#left { overflow: auto; padding: 12px 16px 32px; }
#splitter { cursor: col-resize; background: var(--rule); border-left: 3px solid var(--paper); border-right: 3px solid var(--panel); }
#splitter:hover, #splitter.dragging, #splitter:focus-visible { background: var(--sel-rule); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
#code { position: relative; overflow: auto; background: var(--panel); }
@media (max-width: 1000px) {
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  #splitter { display: none; }
  #code { border-top: 1px solid var(--rule); max-height: 80vh; }
}
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tabs button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--sel-rule); font-weight: 600; }
.tabs.small button { font-size: 12px; padding: 2px 8px; }
#drawing svg { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; }
#drawing a[href] { cursor: pointer; }
#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }
#drawing .child { cursor: pointer; fill: #4a37b0; text-decoration: underline; }
#drawing .missing tspan { fill: #b3261e; }
h2 { font-size: 14px; margin: 22px 0 6px; }
.prose p { margin: 0 0 8px; max-width: 70em; }
table { border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.rise { color: var(--del); font-weight: 600; }
.fall { color: var(--add); }
.added { color: var(--add); }
.removed { color: var(--del); }
.changed { color: var(--amber); }
ul.files { list-style: none; padding: 0; margin: 0; }
ul.files li { padding: 2px 0; }
ul.files button { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.status { display: inline-block; width: 5.5em; font-size: 12px; }
pre.report { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.muted { color: var(--muted); }
#code-head { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; }
#code-status { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 6px; }
#code-body { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
#code-body .empty { padding: 20px; color: var(--muted); font: 14px/1.5 system-ui, sans-serif; }
.line { display: flex; white-space: pre; }
.line .n { flex: 0 0 3.6em; text-align: right; padding-right: 1em; color: var(--muted); user-select: none; }
.line .s { padding-right: 16px; }
.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }
.line.add { background: var(--add-bg); }
.line.del { background: var(--del-bg); }
.line.hunk { color: var(--muted); }
.hljs-keyword, .hljs-literal { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-cmt); }
.hljs-type, .hljs-built_in { color: var(--code-type); }
.hljs-number { color: var(--code-num); }
.hljs-title { font-weight: 600; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</header>
<main>
  <section id="left">
    <div id="tabs" class="tabs" role="tablist" aria-label="Diagrams"></div>
    <div id="views" class="tabs small" role="tablist" aria-label="Views"></div>
    <div id="drawing"></div>
    <div id="notes"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the code panel" tabindex="0" title="Drag to resize; double-click to reset"></div>
  <aside id="code" aria-label="Code">
    <div id="code-head">
      <div id="code-status">No file open.</div>
      <div id="code-views" class="tabs small" role="tablist" aria-label="Versions"></div>
    </div>
    <div id="code-body"><div class="empty">Click a function or type name in a box to open its source here, or a file under "Changed files" to see its diff.</div></div>
  </aside>
</main>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  const state = { diagram: 0, view: {}, file: null, key: null, fileView: "after" };

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  function selectDiagram(i) {
    state.diagram = i;
    tabs($("tabs"), data.diagrams.map((d, k) => ({ id: k, label: d.title })), i, selectDiagram);
    const d = data.diagrams[i];
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    let view = state.view[i];
    if (!present.includes(view)) {
      view = present.includes("diff") ? "diff" : present[present.length - 1];
    }
    showView(view);
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, showView);
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => selectDiagram(child));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            selectDiagram(child);
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        showDecl(href.slice(6), version);
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        showType(decodeURIComponent(href.slice(6)), version);
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel.
  function status(html) {
    $("code-status").innerHTML = html;
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  function showType(item, version) {
    const types = data.diagrams[state.diagram].types;
    const type = (types[version] || {})[item] || (types[other(version)] || {})[item];
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    if (!m || !showDecl(m[1] + "." + m[2], version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.fileView = view;
    renderFile();
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
    });
    const where = state.key && state.fileView !== "diff" ? placeOf(state.key, state.fileView) : null;
    let label = esc(state.file) + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + (where ? " in " + esc(state.file) + ":" + where.start : " in " + esc(state.file)) + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = where && n >= where.start && n <= where.end ? " sel" : "";
        const src = go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    const target = where && document.getElementById("L" + where.start);
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => openFile(c.path, "diff", null));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.diagrams.length) {
    selectDiagram(0);
  }

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>

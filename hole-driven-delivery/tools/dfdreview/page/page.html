<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --paper: #f5f6f8; --ink: #1b1f26; --muted: #5d6470; --panel: #ffffff; --rule: #d9dce3;
  --accent: #4a37b0; --sel: #ece8fb; --sel-rule: #b9acf0; --focus: #d9d0fa;
  --add: #1e7e34; --add-bg: #e6f4ea; --del: #b3261e; --del-bg: #fdecea; --amber: #b36b00; --amber-bg: #fcefd6;
  --code-kw: #8a3d9c; --code-str: #1d6b3a; --code-cmt: #6f7682; --code-type: #1c5fa8; --code-num: #a35a12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;
    --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0; --focus: #3d3470;
    --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b; --amber-bg: #3a2d16;
    --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #14161a; --ink: #e6e8ec; --muted: #9aa1ad; --panel: #1b1e24; --rule: #2c3038;
  --accent: #b3a6f5; --sel: #2a2544; --sel-rule: #5b4fa0; --focus: #3d3470;
  --add: #6fcf8a; --add-bg: #17301f; --del: #f28b82; --del-bg: #3a1c1a; --amber: #e6a86b; --amber-bg: #3a2d16;
  --code-kw: #d197e0; --code-str: #8fd2a6; --code-cmt: #7d8592; --code-type: #8ec1f2; --code-num: #e6a86b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
#search-box { position: relative; flex: 0 1 300px; }
#search { width: 100%; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 5px 10px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); }
#search:focus { outline: none; border-color: var(--sel-rule); }
#search-results { position: absolute; top: calc(100% + 4px); right: 0; z-index: 10; width: min(560px, calc(100vw - 32px));
  max-height: 60vh; overflow: auto; margin: 0; padding: 4px 0; list-style: none; background: var(--panel);
  border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); }
#search-results li { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
  font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
#search-results li.active { background: var(--sel); }
#search-results .kind { flex: 0 0 4.5em; color: var(--muted); font-size: 11.5px; }
#search-results .mark { color: var(--del); font-weight: 700; }
#search-results .mark.reached { color: var(--amber); }
#search-results .where { margin-left: auto; padding-left: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
#search-results li.note { cursor: default; color: var(--muted); font: 12.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 7px var(--code-width, 40%); height: calc(100% - 58px); }
#left { overflow: auto; padding: 12px 16px 32px; }
#splitter { cursor: col-resize; background: var(--rule); border-left: 3px solid var(--paper); border-right: 3px solid var(--panel); }
#splitter:hover, #splitter.dragging, #splitter:focus-visible { background: var(--sel-rule); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
#code { position: relative; overflow: auto; background: var(--panel); }
@media (max-width: 1000px) {
  main { grid-template-columns: minmax(0, 1fr); height: auto; }
  #splitter { display: none; }
  #code { border-top: 1px solid var(--rule); max-height: 80vh; }
}
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tabs button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--sel-rule); font-weight: 600; }
.tabs.small button { font-size: 12px; padding: 2px 8px; }
.tabs button .mark { color: var(--del); font-weight: 700; margin-left: 2px; }
.tabs button .mark.reached { color: var(--amber); }
#drawing svg { display: block; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--rule); border-radius: 6px; }
#drawing a[href] { cursor: pointer; }
#drawing a[href]:hover tspan, #drawing a[href]:focus tspan { fill: #4a37b0; }
#drawing .child { cursor: pointer; fill: #4a37b0; text-decoration: underline; }
#drawing .missing tspan { fill: #b3261e; }
/* A larger asterisk stays visible in a scaled-down drawing; the shift keeps it on its line. */
/* A marked link's highlight: light red for its own change, light amber for a change in its reach. */
#drawing rect.hl.changed { fill: #fde2df; }
#drawing rect.hl.reached { fill: #fcefd6; }
#drawing a[href] tspan.reached, #drawing a[href]:hover tspan.reached, #drawing a[href]:focus tspan.reached {
  fill: #b36b00; font-weight: 700; font-size: 1.7em; }
#drawing a[href] tspan.changed, #drawing a[href]:hover tspan.changed, #drawing a[href]:focus tspan.changed {
  fill: #b3261e; font-weight: 700; font-size: 1.7em; baseline-shift: -0.35em; }
h2 { font-size: 14px; margin: 22px 0 6px; }
#diagram-title { font-size: 15px; margin: 2px 0 8px; }
.prose p { margin: 0 0 8px; max-width: 70em; }
table { border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.rise { color: var(--del); font-weight: 600; }
.fall { color: var(--add); }
.added { color: var(--add); }
.removed { color: var(--del); }
.changed { color: var(--amber); }
ul.files { list-style: none; padding: 0; margin: 0; }
ul.files li { padding: 2px 0; }
ul.files button { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.status { display: inline-block; width: 5.5em; font-size: 12px; }
pre.report { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.muted { color: var(--muted); }
#code-head { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; }
#code-line { position: relative; margin-bottom: 6px; }
#code-status { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
#refs-link, #impls-link { margin-left: 10px; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer;
  font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: underline; }
#refs, #impls { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 2; max-height: 50vh; overflow: auto; padding: 6px 10px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); }
#refs p, #impls p { margin: 0 0 4px; color: var(--muted); font-size: 12px; }
#refs ul, #impls ul { list-style: none; margin: 0; padding: 0; font: 12.5px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; }
#refs li, #impls li { display: flex; flex-wrap: wrap; column-gap: 12px; }
#refs a, #impls a { color: var(--accent); text-decoration: none; }
#refs a:hover, #refs a:focus, #impls a:hover, #impls a:focus { text-decoration: underline; }
#refs .where, #impls .where { color: var(--muted); }
#code-body { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
#code-body .empty { padding: 20px; color: var(--muted); font: 14px/1.5 system-ui, sans-serif; }
.line { display: flex; white-space: pre; }
.line .n { flex: 0 0 3.6em; text-align: right; padding-right: 1em; color: var(--muted); user-select: none; }
.line .s { padding-right: 16px; }
.line.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-rule); }
/* Inside a selected declaration, the line that a link opened: a definition or a reference. */
.line.sel.focus { background: var(--focus); }
.line.add { background: var(--add-bg); }
.line.del { background: var(--del-bg); }
.line.hunk { color: var(--muted); }
/* The After view marks changed lines beside their numbers; the left edge marks a selected declaration. */
.line.added .n { box-shadow: inset -4px 0 0 var(--add); }
.line.modified .n { box-shadow: inset -4px 0 0 var(--amber); }
#code-body a.ident { color: inherit; text-decoration: none; }
#code-body a.ident:hover, #code-body a.ident:focus { text-decoration: underline; cursor: pointer; }
/* A marked identifier: its highlight, and its mark drawn above the line, so no column moves. */
a.ident.mark-changed, a.ident.mark-reached { position: relative; border-radius: 2px; }
a.ident.mark-changed { background: var(--del-bg); }
a.ident.mark-reached { background: var(--amber-bg); }
a.ident.mark-changed::after, a.ident.mark-reached::after { position: absolute; top: -0.55em; right: -0.5em; font-weight: 700; }
a.ident.mark-changed::after { content: "*"; color: var(--del); }
a.ident.mark-reached::after { content: "~"; color: var(--amber); }
#uncovered ul { margin: 0; padding-left: 18px; font: 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; }
#uncovered a.ident { color: var(--ink); text-decoration: none; }
#uncovered a.ident:hover, #uncovered a.ident:focus { text-decoration: underline; }
#uncovered li .muted { margin-left: 1.2em; }
ul.errors { margin: 0; padding-left: 18px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
ul.errors li { white-space: pre-wrap; }
.hljs-keyword, .hljs-literal { color: var(--code-kw); }
.hljs-string { color: var(--code-str); }
.hljs-comment { color: var(--code-cmt); }
.hljs-type, .hljs-built_in { color: var(--code-type); }
.hljs-number { color: var(--code-num); }
.hljs-title { font-weight: 600; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <div id="search-box">
    <input id="search" type="search" placeholder="Search declarations and methods" autocomplete="off" spellcheck="false"
      role="combobox" aria-label="Search the declarations and methods" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results">
    <ul id="search-results" role="listbox" aria-label="Matching declarations and methods" hidden></ul>
  </div>
</header>
<main>
  <section id="left">
    <div id="tabs" class="tabs" role="tablist" aria-label="Diagrams"></div>
    <h2 id="diagram-title"></h2>
    <div id="views" class="tabs small" role="tablist" aria-label="Views"></div>
    <div id="drawing"></div>
    <div id="uncovered"></div>
    <div id="notes"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the code panel" tabindex="0" title="Drag to resize; double-click to reset"></div>
  <aside id="code" aria-label="Code">
    <div id="code-head">
      <div id="code-line"><span id="code-status">No file open.</span><button type="button" id="refs-link" aria-expanded="false" aria-controls="refs" hidden>Show references</button><button type="button" id="impls-link" aria-expanded="false" aria-controls="impls" hidden>Show implementations</button>
        <div id="refs" hidden></div>
        <div id="impls" hidden></div>
      </div>
      <div id="code-views" class="tabs small" role="tablist" aria-label="Versions"></div>
    </div>
    <div id="code-body"><div class="empty">Click a function or type name in a box to open its source here, or a file under "Changed files" to see its diff.</div></div>
  </aside>
</main>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const other = (version) => (version === "before" ? "after" : "before");
  const viewNames = { before: "Before", diff: "Diff", after: "After" };
  // line and end select lines of the open file: a definition's line, or a declaration's lines.
  const state = { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" };
  const emptyCode = $("code-body").innerHTML;
  const emptyStatus = $("code-status").innerHTML;
  const refsLink = $("refs-link");
  const refs = $("refs");
  const implsLink = $("impls-link");
  const impls = $("impls");

  $("title").textContent = data.title;
  $("subtitle").textContent = data.base
    ? "Before is " + data.base.slice(0, 12) + ", and After is the working tree."
    : "The working tree alone, with no base to compare against.";

  function tabs(container, items, selected, onSelect) {
    container.innerHTML = "";
    items.forEach((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(item.id === selected));
      b.textContent = item.label;
      if (item.hint) {
        b.title = item.hint;
      }
      if (item.mark) {
        const star = document.createElement("span");
        star.className = "mark " + item.mark;
        star.textContent = marks[item.mark].glyph;
        star.title = item.markTip;
        b.appendChild(star);
      }
      b.addEventListener("click", () => onSelect(item.id));
      container.appendChild(b);
    });
  }

  // The diagrams, each in its views.
  let marked = null; // for each diagram, the strongest mark of the declarations its drawings link

  function selectDiagram(i) {
    state.diagram = i;
    marked = marked || data.diagrams.map(tabMark);
    // A tab shows the diagram's number. Its title, the description of the expanded
    // process, shows on hover and above the drawing.
    tabs($("tabs"), data.diagrams.map((d, k) => ({
      id: k, label: d.number || "Overview", hint: d.number ? d.title : "",
      mark: marked[k],
      markTip: (marked[k] === "changed" ? "shows a declaration changed since " : "shows a function whose calls reach a change since ") + data.base,
    })), i, (k) => navigate(() => selectDiagram(k)));
    const d = data.diagrams[i];
    $("diagram-title").textContent = d.title;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    showView(present.includes(state.view[i]) ? state.view[i] : defaultView(d));
    uncoveredList(d);
  }

  // uncoveredList lists, under the Overview drawing, the changed declarations and methods that
  // no drawing covers, each with its mark and a link to its declaration.
  function uncoveredList(d) {
    const box = $("uncovered");
    box.innerHTML = "";
    if (d.number !== "" || !(data.uncovered || []).length) {
      return;
    }
    const h = document.createElement("h2");
    h.textContent = "Changes outside the drawings";
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "No drawing links these declarations, and no linked function reaches them through its calls.";
    const ul = document.createElement("ul");
    data.uncovered.forEach((u) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#";
      a.className = "ident mark-" + u.mark;
      a.textContent = u.key;
      a.title = marks[u.mark].tip + data.base;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        navigate(() => showDecl(u.key, u.version));
      });
      const where = document.createElement("span");
      where.className = "muted";
      where.textContent = u.file + ":" + u.line + (u.version === "before" ? " (Before)" : "");
      li.append(a, where);
      ul.appendChild(li);
    });
    box.append(h, p, ul);
  }

  // defaultView returns the view a diagram opens in: Diff when it changed, else its one view.
  function defaultView(d) {
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    return present.includes("diff") ? "diff" : present[present.length - 1];
  }

  function showView(view) {
    const d = data.diagrams[state.diagram];
    state.view[state.diagram] = view;
    const present = ["before", "diff", "after"].filter((v) => d[v]);
    tabs($("views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], view, (v) => {
      showView(v);
      record(false);
    });
    $("drawing").innerHTML = d[view] || "";
    const svg = $("drawing").querySelector("svg");
    if (svg) {
      decorate(svg, view);
    }
  }

  // The Before view reads the base; the Diff and After views read the working tree.
  const versionOf = (view) => (view === "before" ? "before" : "after");

  function decorate(svg, view) {
    const version = versionOf(view);
    svg.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#term/")) {
        const term = decodeURIComponent(href.slice(6));
        const def = (data.terms[version] || {})[term] || (data.terms[other(version)] || {})[term];
        if (def) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = term + ": " + def;
          a.appendChild(t);
        }
      } else if (href.startsWith("#code/")) {
        const decl = data.decls[href.slice(6)];
        if (!decl || (!decl.before && !decl.after)) {
          a.classList.add("missing");
        } else if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (href.startsWith("#type/")) {
        const decl = data.decls[typeKey(typeOf(data.diagrams[state.diagram], decodeURIComponent(href.slice(6)), version))];
        if (markOf(decl)) {
          markLink(a, markOf(decl));
        }
      } else if (/^https?:/.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    const here = data.diagrams[state.diagram].number;
    svg.querySelectorAll("text").forEach((t) => {
      const n = t.textContent.trim();
      const child = data.diagrams.findIndex((d) => d.number !== "" && d.number === n && parentOf(d.number) === here);
      if (child >= 0 && !t.closest("a")) {
        t.classList.add("child");
        t.setAttribute("tabindex", "0");
        t.setAttribute("role", "link");
        t.addEventListener("click", () => navigate(() => selectDiagram(child)));
        t.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            navigate(() => selectDiagram(child));
          }
        });
      }
    });
    svg.addEventListener("click", (e) => {
      const a = e.target.closest("a[href]");
      if (!a) {
        return;
      }
      const href = a.getAttribute("href");
      if (href.startsWith("#code/")) {
        e.preventDefault();
        navigate(() => showDecl(href.slice(6), version));
      } else if (href.startsWith("#type/")) {
        e.preventDefault();
        navigate(() => showType(decodeURIComponent(href.slice(6)), version));
      } else if (href.startsWith("#")) {
        e.preventDefault();
      }
    });
  }

  // The two marks of a changed declaration: a change in its own text, or in its reach only.
  const marks = {
    changed: { glyph: "*", tip: "changed since " },
    reached: { glyph: "~", tip: "calls a function or method changed since " },
  };

  // markOf returns a declaration's mark: "changed", "reached" or "".
  const markOf = (decl) => (!decl || !decl.changed ? "" : decl.reached ? "reached" : "changed");

  // tabMark returns the strongest mark among the declarations that a diagram's drawings link.
  function tabMark(d) {
    let best = "";
    ["before", "diff", "after"].forEach((view) => {
      for (const m of (d[view] || "").matchAll(/href="#(code|type)\/([^"]*)"/g)) {
        const key = m[1] === "code" ? m[2] : typeKey(typeOf(d, decodeURIComponent(m[2]), versionOf(view)));
        const kind = markOf(data.decls[key]);
        if (kind === "changed" || (kind === "reached" && !best)) {
          best = kind;
        }
      }
    });
    // The Overview also shows the changes outside the drawings.
    if (d.number === "") {
      (data.uncovered || []).forEach((u) => {
        if (u.mark === "changed" || (u.mark === "reached" && !best)) {
          best = u.mark;
        }
      });
    }
    return best;
  }

  // markLink puts a highlight behind a link of a changed declaration and its mark after it.
  function markLink(a, kind) {
    const svg = "http://www.w3.org/2000/svg";
    const name = a.querySelector("tspan");
    const text = a.closest("text");
    if (name && text) {
      const box = name.getBBox();
      const rect = document.createElementNS(svg, "rect");
      Object.entries({ x: box.x - 1, y: box.y, width: box.width + 2, height: box.height, rx: 2 }).forEach(([k, v]) => rect.setAttribute(k, v));
      rect.setAttribute("class", "hl " + kind);
      text.before(rect);
    }
    const star = document.createElementNS(svg, "tspan");
    star.classList.add(kind);
    star.textContent = marks[kind].glyph;
    const t = document.createElementNS(svg, "title");
    t.textContent = marks[kind].tip + data.base;
    a.append(star, t);
  }

  function parentOf(number) {
    const i = number.lastIndexOf(".");
    return i < 0 ? "" : number.slice(0, i);
  }

  // The code panel. status shows a message above the code and hides the "Show references"
  // and "Show implementations" links, which renderFile shows again for a declaration or a
  // method, and for an interface.
  function status(html) {
    $("code-status").innerHTML = html;
    refsLink.hidden = true;
    implsLink.hidden = true;
    closeRefs();
    closeImpls();
  }

  function placeOf(key, version) {
    return (data.decls[key] || {})[version] || null;
  }

  function showDecl(key, version) {
    const place = placeOf(key, version) || placeOf(key, other(version));
    if (!place) {
      status(esc(key) + " has no declaration in either version.");
      return false;
    }
    openFile(place.file, placeOf(key, version) ? version : other(version), key);
    return true;
  }

  // typeOf returns a flow item's type in diagram d, from the other version when this one lacks it.
  function typeOf(d, item, version) {
    return (d.types[version] || {})[item] || (d.types[other(version)] || {})[item] || "";
  }

  // typeKey returns the declaration key of a type's first qualified name, such as lib.Item in []*lib.Item.
  function typeKey(type) {
    const m = /\b([a-z][a-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)/.exec(type);
    return m ? m[1] + "." + m[2] : "";
  }

  function showType(item, version) {
    const type = typeOf(data.diagrams[state.diagram], item, version);
    if (!type) {
      status(esc(item) + " has no type comment.");
      return;
    }
    const key = typeKey(type);
    if (!key || !showDecl(key, version)) {
      status(esc(item) + ": " + esc(type));
      return;
    }
    $("code-status").innerHTML = esc(item) + ": " + esc(type) + "<br>" + $("code-status").innerHTML;
  }

  function openFile(path, view, key) {
    state.file = path;
    state.key = key || null;
    state.line = null;
    state.end = null;
    state.fileView = view;
    renderFile();
  }

  // changedLines returns the status of each changed line of a file's After version, by line
  // number, from the file's unified diff: "modified" for a line that replaces removed lines,
  // and "added" for any other added line.
  function changedLines(diff) {
    const status = {};
    let line = 0; // the After version's number of the next line, 0 before the first hunk
    let removed = 0;
    let added = [];
    const flush = () => {
      added.forEach((n) => {
        status[n] = removed > 0 ? "modified" : "added";
      });
      removed = 0;
      added = [];
    };
    (diff || "").split("\n").forEach((ln) => {
      const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)/.exec(ln);
      if (hunk) {
        flush();
        line = Number(hunk[1]);
      } else if (line === 0 || ln.startsWith("\\")) {
        // The file's header, or a note such as "\ No newline at end of file".
      } else if (ln.startsWith("+")) {
        added.push(line++);
      } else if (ln.startsWith("-")) {
        removed++;
      } else {
        flush();
        line++;
      }
    });
    flush();
    return status;
  }

  // The identifier links of the open file's view, by line; renderFile fills it.
  let lineLinks = {};

  // linkLine wraps each identifier of line n of the open file, in its highlighted html,
  // in a link to the identifier's definition in the same version.
  function linkLine(html, n, version) {
    const links = lineLinks[n];
    if (!links) {
      return html;
    }
    const t = document.createElement("template");
    t.innerHTML = html;
    const texts = [];
    let offset = 0; // UTF-16 code units before each text node
    const walker = document.createTreeWalker(t.content, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      texts.push({ node, start: offset });
      offset += node.data.length;
    }
    // From the last identifier back, so a split leaves the earlier offsets of its node valid.
    [...links].sort((a, b) => b.c - a.c).forEach((link) => {
      const from = link.c - 1;
      const text = texts.find((x) => from >= x.start && from + link.n <= x.start + x.node.data.length);
      if (!text) {
        return;
      }
      const name = text.node.splitText(from - text.start);
      name.splitText(link.n);
      const a = document.createElement("a");
      a.className = link.m ? "ident mark-" + link.m : "ident";
      if (link.m) {
        a.title = marks[link.m].tip + data.base;
      }
      if (link.u) {
        a.href = link.u;
        a.target = "_blank";
        a.rel = "noopener";
      } else {
        a.href = "#";
        if (link.k) {
          a.dataset.key = link.k;
        }
        a.dataset.file = link.f;
        a.dataset.line = link.t;
        if (link.e) {
          a.dataset.end = link.e;
        }
        a.dataset.version = version;
      }
      name.replaceWith(a);
      a.appendChild(name);
    });
    return t.innerHTML;
  }

  // openDefinition opens a link's definition: its file in the same version at its line, with
  // the key of its declaration or method, or its URL. The link of a declaration's name
  // selects the declaration's lines instead.
  function openDefinition(link, version) {
    if (link.u) {
      window.open(link.u, "_blank", "noopener");
      return;
    }
    state.file = link.f;
    state.key = link.k || null;
    state.line = link.t;
    state.end = link.e || null;
    state.fileView = version;
    renderFile();
  }

  function renderFile() {
    const f = data.files[state.file];
    if (!f) {
      status(esc(state.file) + " is not on the page.");
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = "";
      return;
    }
    const present = ["before", "diff", "after"].filter((v) => (v === "diff" ? f.diff : f[v] !== null));
    if (!present.includes(state.fileView)) {
      state.fileView = present[present.length - 1];
    }
    tabs($("code-views"), present.length > 1 ? present.map((v) => ({ id: v, label: viewNames[v] })) : [], state.fileView, (v) => {
      state.fileView = v;
      renderFile();
      record(false);
    });
    // The selection: a declaration's lines, from the link of its name or from its key, and
    // inside them the line that a link opened, such as a definition or a reference, as the
    // focus. Without a declaration that holds it, that line stands alone.
    let where = null;
    let focus = null;
    if (state.fileView !== "diff") {
      const decl = state.key ? placeOf(state.key, state.fileView) : null;
      const holds = decl && decl.file === state.file && (!state.line || (state.line >= decl.start && state.line <= decl.end));
      if (state.end) {
        where = { start: state.line, end: state.end };
      } else if (holds) {
        where = decl;
        focus = state.line;
      } else if (state.line) {
        where = { start: state.line, end: state.line };
      }
    }
    const at = focus || (where && where.start);
    let label = esc(state.file) + (state.line ? ":" + state.line : "") + " (" + viewNames[state.fileView] + ")";
    if (state.key) {
      label = esc(state.key) + " in " + esc(state.file) + (at ? ":" + at : "") + " (" + viewNames[state.fileView] + ")";
    }
    status(label);
    refsLink.hidden = !state.key;
    implsLink.hidden = !implementationsOf(state.key);
    const out = [];
    if (state.fileView === "diff") {
      f.diff.replace(/\n$/, "").split("\n").forEach((ln, i) => {
        let cls = "";
        if (ln.startsWith("@@")) {
          cls = " hunk";
        } else if (ln.startsWith("+") && !ln.startsWith("+++")) {
          cls = " add";
        } else if (ln.startsWith("-") && !ln.startsWith("---")) {
          cls = " del";
        }
        out.push('<div class="line' + cls + '"><span class="n">' + (i + 1) + '</span><span class="s">' + esc(ln) + "</span></div>");
      });
    } else {
      const go = state.file.endsWith(".go") && window.hljs;
      const changed = state.fileView === "after" ? changedLines(f.diff) : {};
      lineLinks = {};
      (f[state.fileView + "Links"] || []).forEach((l) => {
        (lineLinks[l.l] = lineLinks[l.l] || []).push(l);
      });
      f[state.fileView].replace(/\n$/, "").split("\n").forEach((ln, i) => {
        const n = i + 1;
        const sel = (where && n >= where.start && n <= where.end ? " sel" : "") + (n === focus ? " focus" : "") +
          (changed[n] ? " " + changed[n] : "");
        const src = linkLine(go ? hljs.highlight(ln, { language: "go", ignoreIllegals: true }).value : esc(ln), n, state.fileView);
        out.push('<div class="line' + sel + '" id="L' + n + '"><span class="n">' + n + '</span><span class="s">' + src + "</span></div>");
      });
    }
    $("code-body").innerHTML = out.join("");
    // The panel scrolls to the selection's first line, or to the focus when that line would
    // leave the focus out of view.
    const first = where && document.getElementById("L" + where.start);
    const marked = focus && document.getElementById("L" + focus);
    const room = $("code").clientHeight - $("code-head").offsetHeight - 36;
    const target = first && marked && marked.offsetTop - first.offsetTop > room ? marked : first;
    $("code").scrollTop = target ? target.offsetTop - $("code-head").offsetHeight - 12 : 0;
  }

  // packageErrors lists the package errors of both versions.
  function packageErrors() {
    const ul = document.createElement("ul");
    ul.className = "errors";
    data.errors.forEach((e) => {
      const li = document.createElement("li");
      li.textContent = e;
      ul.appendChild(li);
    });
    return ul;
  }

  // The notes under the drawings.
  function section(title, content) {
    const h = document.createElement("h2");
    h.textContent = title;
    $("notes").appendChild(h);
    $("notes").appendChild(content);
  }

  function prose(text) {
    const div = document.createElement("div");
    div.className = "prose";
    text.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      p.textContent = para.replace(/\n/g, " ");
      div.appendChild(p);
    });
    return div;
  }

  function scoreTable() {
    const old = data.oldScore;
    const rows = ["<tr><th>Column</th><th>Cached</th><th>New</th><th>Change</th></tr>"];
    data.newScore.columns.forEach((col, i) => {
      const now = Number(data.newScore.values[i]);
      const k = old ? old.columns.indexOf(col) : -1;
      const before = k >= 0 ? Number(old.values[k]) : null;
      let change = "";
      if (before !== null && !Number.isNaN(now) && !Number.isNaN(before)) {
        const d = now - before;
        change = d > 0 ? '<span class="rise">+' + d + " rise</span>" : d < 0 ? '<span class="fall">' + d + "</span>" : "0";
      }
      rows.push("<tr><td>" + esc(col) + '</td><td class="num">' + (before === null ? "" : before) + '</td><td class="num">' +
        esc(data.newScore.values[i]) + '</td><td class="num">' + change + "</td></tr>");
    });
    const t = document.createElement("table");
    t.innerHTML = rows.join("");
    return t;
  }

  function vocabularyChanges() {
    const before = data.terms.before || {};
    const after = data.terms.after || {};
    const names = Array.from(new Set(Object.keys(before).concat(Object.keys(after)))).sort();
    const rows = [];
    names.forEach((term) => {
      let kind = "";
      if (!(term in before)) {
        kind = "added";
      } else if (!(term in after)) {
        kind = "removed";
      } else if (before[term] !== after[term]) {
        kind = "changed";
      }
      if (kind) {
        rows.push('<tr><td class="' + kind + '">' + kind + "</td><td>" + esc(term) + "</td><td>" + esc(after[term] || before[term]) + "</td></tr>");
      }
    });
    const t = document.createElement("table");
    t.innerHTML = rows.length ? rows.join("") : '<tr><td class="muted">No changes.</td></tr>';
    return t;
  }

  function changedFiles() {
    const ul = document.createElement("ul");
    ul.className = "files";
    (data.changed || []).forEach((c) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.className = "status " + ({ added: "added", deleted: "removed" }[c.status] || "changed");
      s.textContent = c.status;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.path;
      b.addEventListener("click", () => navigate(() => openFile(c.path, "diff", null)));
      li.appendChild(s);
      li.appendChild(b);
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      ul.innerHTML = '<li class="muted">No changes.</li>';
    }
    return ul;
  }

  if (data.brief) {
    section("The change in brief", prose(data.brief));
  }
  if (data.metaphor) {
    section("Metaphor", prose(data.metaphor));
  }
  if (data.newScore) {
    section("Score", scoreTable());
  }
  if (data.base) {
    section("Vocabulary changes", vocabularyChanges());
    section("Changed files", changedFiles());
  }
  if (data.report) {
    const pre = document.createElement("pre");
    pre.className = "report";
    pre.textContent = data.report;
    section("dfdmetrics report", pre);
  }
  if (data.errors && data.errors.length) {
    section("Package errors", packageErrors());
  }
  $("code-body").addEventListener("click", (e) => {
    const a = e.target.closest("a.ident");
    if (a && a.dataset.file) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), e: Number(a.dataset.end), k: a.dataset.key }, a.dataset.version));
    }
  });

  // The search box lists the declarations and methods whose keys match its text, and opens
  // the chosen one in the code panel.
  const search = $("search");
  const results = $("search-results");
  const shown = 50; // the most results that the list shows
  let found = []; // the keys that match the text, best first
  let active = -1; // the index of the highlighted result, -1 for none

  // matching returns the keys of the declarations and methods that match query, best first:
  // those named query, then those whose names start with it, then those whose keys hold it.
  function matching(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      return [];
    }
    const scored = [];
    Object.keys(data.decls).forEach((key) => {
      const k = key.toLowerCase();
      const name = k.slice(k.lastIndexOf(".") + 1);
      const score = name === q ? 0 : name.startsWith(q) ? 1 : k.includes(q) ? 2 : -1;
      if (score >= 0) {
        scored.push({ key, score });
      }
    });
    scored.sort((a, b) => a.score - b.score || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
    return scored.map((s) => s.key);
  }

  function showResults() {
    found = matching(search.value);
    results.replaceChildren();
    found.slice(0, shown).forEach((key, i) => {
      const decl = data.decls[key];
      const version = decl.after ? "after" : "before";
      const where = decl[version];
      const li = document.createElement("li");
      li.id = "result-" + i;
      li.setAttribute("role", "option");
      li.dataset.key = key;
      li.dataset.index = i;
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = where.kind;
      const name = document.createElement("span");
      name.textContent = key;
      li.append(kind, name);
      const m = markOf(decl);
      if (m) {
        const star = document.createElement("span");
        star.className = "mark " + m;
        star.textContent = marks[m].glyph;
        star.title = marks[m].tip + data.base;
        li.append(star);
      }
      const place = document.createElement("span");
      place.className = "where";
      place.textContent = where.file + ":" + where.start + (version === "before" ? " (Before)" : "");
      li.append(place);
      results.appendChild(li);
    });
    const typed = search.value.trim() !== "";
    const note = found.length > shown ? found.length - shown + " more; type more of the name to narrow the list."
      : typed && !found.length ? "No declaration or method matches." : "";
    if (note) {
      const li = document.createElement("li");
      li.className = "note";
      li.textContent = note;
      results.appendChild(li);
    }
    results.hidden = !typed;
    search.setAttribute("aria-expanded", String(typed));
    setActive(found.length ? 0 : -1);
  }

  function setActive(i) {
    active = i;
    results.querySelectorAll("li[data-key]").forEach((li) => {
      const on = Number(li.dataset.index) === i;
      li.classList.toggle("active", on);
      li.setAttribute("aria-selected", String(on));
      if (on) {
        li.scrollIntoView({ block: "nearest" });
      }
    });
    if (i >= 0) {
      search.setAttribute("aria-activedescendant", "result-" + i);
    } else {
      search.removeAttribute("aria-activedescendant");
    }
  }

  function closeResults() {
    results.hidden = true;
    search.setAttribute("aria-expanded", "false");
  }

  // choose opens a declaration or method in the version of the open file.
  function choose(key) {
    closeResults();
    navigate(() => showDecl(key, state.fileView === "before" ? "before" : "after"));
  }

  search.addEventListener("input", showResults);
  search.addEventListener("focus", () => {
    if (search.value.trim()) {
      showResults();
    }
  });
  search.addEventListener("blur", closeResults);
  search.addEventListener("keydown", (e) => {
    const n = Math.min(found.length, shown);
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
      e.preventDefault();
      if (results.hidden) {
        showResults();
      } else {
        setActive((active + (e.key === "ArrowDown" ? 1 : n - 1)) % n);
      }
    } else if (e.key === "Enter" && !results.hidden && active >= 0) {
      e.preventDefault();
      choose(found[active]);
    } else if (e.key === "Escape" && !results.hidden) {
      e.preventDefault();
      closeResults();
    }
  });
  // A press on the list keeps the focus in the box, so the list stays open until the click.
  results.addEventListener("mousedown", (e) => e.preventDefault());
  results.addEventListener("mousemove", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li && Number(li.dataset.index) !== active) {
      setActive(Number(li.dataset.index));
    }
  });
  results.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-key]");
    if (li) {
      choose(li.dataset.key);
    }
  });

  // The "Show references" link lists the uses of the open declaration or method in the open
  // version, one line for each declaration or method that holds some, with their lines.
  function openRefs() {
    closeImpls();
    const version = state.fileView === "before" ? "before" : "after";
    const list = ((data.uses || {})[version] || {})[state.key] || [];
    const groups = new Map();
    list.forEach((u) => {
      const id = (u.i || "") + " " + u.f;
      if (!groups.has(id)) {
        groups.set(id, { key: u.i || "", file: u.f, lines: [] });
      }
      groups.get(id).lines.push(u.l);
    });
    const head = document.createElement("p");
    head.textContent = (list.length ? "References to " : "No references to ") + state.key + " in the " + viewNames[version] +
      " version" + (list.length ? ":" : ".");
    refs.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      groups.forEach((g) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.append(g.file + ":");
        g.lines.forEach((line, i) => {
          if (i) {
            where.append(", ");
          }
          where.append(refLink(String(line), g, line, version));
        });
        li.append(refLink(g.key || g.file, g, g.lines[0], version), where);
        ul.appendChild(li);
      });
      refs.appendChild(ul);
    }
    refs.hidden = false;
    refsLink.textContent = "Hide references";
    refsLink.setAttribute("aria-expanded", "true");
  }

  // refLink returns a link to a line of a group's file, which opens with the group's key.
  function refLink(text, group, line, version) {
    const a = document.createElement("a");
    a.href = "#";
    a.textContent = text;
    if (group.key) {
      a.dataset.key = group.key;
    }
    a.dataset.file = group.file;
    a.dataset.line = line;
    a.dataset.version = version;
    return a;
  }

  function closeRefs() {
    refs.hidden = true;
    refs.replaceChildren();
    refsLink.textContent = "Show references";
    refsLink.setAttribute("aria-expanded", "false");
  }

  // implementationsOf returns the types that implement an interface in the open version, or
  // null for a key of anything else.
  function implementationsOf(key) {
    const all = (data.implementations || {})[state.fileView === "before" ? "before" : "after"] || {};
    return key && Object.prototype.hasOwnProperty.call(all, key) ? all[key] : null;
  }

  // The "Show implementations" link lists the types that implement the open interface in the
  // open version, a type marked with "*" when only its pointer implements it.
  function openImpls() {
    closeRefs();
    const version = state.fileView === "before" ? "before" : "after";
    const list = implementationsOf(state.key) || [];
    const head = document.createElement("p");
    head.textContent = (list.length ? "Implementations of " : "No implementations of ") + state.key + " in the " +
      viewNames[version] + " version" + (list.length ? ":" : ".");
    impls.replaceChildren(head);
    if (list.length) {
      const ul = document.createElement("ul");
      list.forEach((m) => {
        const li = document.createElement("li");
        const where = document.createElement("span");
        where.className = "where";
        where.textContent = m.f + ":" + m.l;
        li.append(refLink((m.p ? "*" : "") + m.k, { key: m.k, file: m.f }, m.l, version), where);
        ul.appendChild(li);
      });
      impls.appendChild(ul);
    }
    impls.hidden = false;
    implsLink.textContent = "Hide implementations";
    implsLink.setAttribute("aria-expanded", "true");
  }

  function closeImpls() {
    impls.hidden = true;
    impls.replaceChildren();
    implsLink.textContent = "Show implementations";
    implsLink.setAttribute("aria-expanded", "false");
  }

  refsLink.addEventListener("click", () => (refs.hidden ? openRefs() : closeRefs()));
  implsLink.addEventListener("click", () => (impls.hidden ? openImpls() : closeImpls()));
  [refs, impls].forEach((list) => list.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-file]");
    if (a) {
      e.preventDefault();
      navigate(() => openDefinition({ f: a.dataset.file, t: Number(a.dataset.line), k: a.dataset.key }, a.dataset.version));
    }
  }));
  // A click elsewhere, or Escape, closes the lists.
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#refs, #refs-link, #impls, #impls-link")) {
      closeRefs();
      closeImpls();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeRefs();
      closeImpls();
    }
  });

  // The history: each navigation adds an entry, and a switch of view updates the current one,
  // so the Back button returns to the previous place. An entry's URL hash names its place, as
  // in #d=3.3&v=diff&f=cart/cart.go&fv=after&l=21, and a hash such as #code/analyze.sumTypes
  // opens that declaration.
  const place = () => ({
    diagram: state.diagram, view: { ...state.view },
    file: state.file, key: state.key, line: state.line, end: state.end, fileView: state.fileView,
  });

  function hashOf(p) {
    const parts = [];
    const add = (name, value) => {
      if (value) {
        parts.push(name + "=" + encodeURIComponent(value).replace(/%2F/g, "/"));
      }
    };
    const d = data.diagrams[p.diagram] || {};
    add("d", d.number);
    if (p.view[p.diagram] !== defaultView(d)) {
      add("v", p.view[p.diagram]);
    }
    if (p.file) {
      add("f", p.file);
      add("fv", p.fileView);
      add("k", p.key);
      add("l", p.line ? String(p.line) : "");
      add("e", p.end ? String(p.end) : "");
    }
    return parts.length ? "#" + parts.join("&") : "";
  }

  // placeOfHash reads a place from a hash that hashOf wrote.
  function placeOfHash(hash) {
    const q = new URLSearchParams(hash.slice(1));
    const diagram = Math.max(0, data.diagrams.findIndex((d) => d.number === (q.get("d") || "")));
    const view = q.get("v") ? { [diagram]: q.get("v") } : {};
    return {
      diagram, view, file: q.get("f"), key: q.get("k"),
      line: Number(q.get("l")) || null, end: Number(q.get("e")) || null, fileView: q.get("fv") || "after",
    };
  }

  function record(push) {
    const p = place();
    const url = location.href.split("#")[0] + hashOf(p);
    if (push) {
      history.pushState(p, "", url);
    } else {
      history.replaceState(p, "", url);
    }
  }

  // navigate runs a step, and adds a history entry when the step changes the place.
  function navigate(step) {
    const before = hashOf(place());
    step();
    if (hashOf(place()) !== before) {
      record(true);
    }
  }

  function restore(p) {
    state.view = { ...p.view };
    selectDiagram(p.diagram);
    Object.assign(state, { file: p.file, key: p.key, line: p.line, end: p.end || null, fileView: p.fileView });
    if (state.file) {
      renderFile();
    } else {
      $("code-views").innerHTML = "";
      $("code-body").innerHTML = emptyCode;
      status(emptyStatus);
    }
  }

  // openHash opens the place that a URL hash names, and the top diagram for an empty one.
  function openHash(hash) {
    if (hash.startsWith("#code/")) {
      selectDiagram(0);
      showDecl(decodeURIComponent(hash.slice(6)), "after");
    } else {
      restore(hash.length > 1 ? placeOfHash(hash) : { diagram: 0, view: {}, file: null, key: null, line: null, end: null, fileView: "after" });
    }
  }

  if (data.diagrams.length) {
    openHash(location.hash);
    record(false);
  }
  // An entry without a state comes from a change of the hash alone, as in an edited URL.
  window.addEventListener("popstate", (e) => {
    if (e.state) {
      restore(e.state);
    } else {
      openHash(location.hash);
      record(false);
    }
  });

  // The splitter resizes the code panel, and this browser keeps the width.
  const main = document.querySelector("main");
  const splitter = $("splitter");
  const widthKey = "dfdreview.codeWidth";
  function setCodeWidth(px) {
    const width = Math.max(240, Math.min(px, main.clientWidth - 320));
    main.style.setProperty("--code-width", width + "px");
    return width;
  }
  function saveCodeWidth(width) {
    try {
      localStorage.setItem(widthKey, String(width));
    } catch (e) {
      // Without storage, the width lasts until the page reloads.
    }
  }
  try {
    const saved = Number(localStorage.getItem(widthKey));
    if (saved > 0) {
      setCodeWidth(saved);
    }
  } catch (e) {
    // Without storage, the panel keeps its default width.
  }
  splitter.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  splitter.addEventListener("pointermove", (e) => {
    if (splitter.hasPointerCapture(e.pointerId)) {
      setCodeWidth(main.getBoundingClientRect().right - e.clientX);
    }
  });
  splitter.addEventListener("pointerup", (e) => {
    splitter.releasePointerCapture(e.pointerId);
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    saveCodeWidth($("code").offsetWidth);
  });
  splitter.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 20;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const wider = e.key === "ArrowLeft" ? step : -step;
      saveCodeWidth(setCodeWidth($("code").offsetWidth + wider));
    }
  });
  splitter.addEventListener("dblclick", () => {
    main.style.removeProperty("--code-width");
    try {
      localStorage.removeItem(widthKey);
    } catch (e) {
      // Without storage, there is no saved width to forget.
    }
  });
  window.addEventListener("resize", () => {
    if (main.style.getPropertyValue("--code-width")) {
      setCodeWidth($("code").offsetWidth);
    }
  });
})();
</script>
</body>
</html>

name: Release

on:
  push:
    # Per-skill tags: <skill-name>/vX.Y.Z (e.g. three-layer-cake-haskell/v0.1.0)
    tags: ['*/v*']
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill directory name to package (leave empty to build all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Determine which skill(s) to package
        id: which
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag is <skill-name>/vX.Y.Z — strip the version to get the skill dir.
            TAG_REF="${GITHUB_REF#refs/tags/}"
            SKILL="${TAG_REF%/v*}"
            echo "skill=$SKILL" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          else
            echo "skill=${{ github.event.inputs.skill }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package skill(s)
        run: |
          mkdir -p dist
          if [[ -n "${{ steps.which.outputs.skill }}" ]]; then
            # Single skill
            SKILL="${{ steps.which.outputs.skill }}"
            if [[ ! -d "$SKILL" ]] || [[ ! -f "$SKILL/SKILL.md" ]]; then
              echo "::error::Skill directory '$SKILL' not found or has no SKILL.md"
              exit 1
            fi
            (cd "$SKILL" && zip -r "../dist/${SKILL}.skill" . -x "*.DS_Store" "*.swp")
          else
            # All skills (each top-level dir with a SKILL.md)
            for dir in */; do
              skill="${dir%/}"
              if [[ -f "$skill/SKILL.md" ]]; then
                (cd "$skill" && zip -r "../dist/${skill}.skill" . -x "*.DS_Store" "*.swp")
              fi
            done
          fi
          ls -la dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.which.outputs.tag }}
          name: ${{ steps.which.outputs.tag }}
          files: dist/*.skill
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: dist/*.skill
